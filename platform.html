<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Boring Investor — Plataforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --black:#0A0A0A;--white:#FFFFFF;--bg:#F7F6F4;
  --g50:#FAFAF8;--g100:#F4F3F0;--g200:#E8E6E1;--g300:#C8C5BE;--g400:#9A9690;--g500:#6B6762;--g600:#4A4845;--g700:#3A3835;
  --accent:#1B3A6B;--accent-l:#EBF0FA;--accent-m:#4A7CC7;
  --green:#1A5C3A;--green-l:#EAF3DE;
  --amber:#7A4A00;--amber-l:#FEF5E7;
  --red:#8B1A1A;--red-l:#FDF0F0;
  --purple:#534AB7;--purple-l:#EDEAF9;
  --fd:'Playfair Display',Georgia,serif;
  --fb:'DM Sans',system-ui,sans-serif;
  --fm:'DM Mono',monospace;
  --r:12px;--sidebar-w:240px;--topbar-h:56px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--fb);background:var(--bg);color:var(--black);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ══════════ UTILITIES ══════════ */
.hidden{display:none!important}

/* ══════════ LOGIN ══════════ */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:var(--black);
  position:relative;overflow:hidden;
}
#login-screen::before{
  content:'';position:absolute;top:-30%;right:-10%;
  width:700px;height:700px;
  background:radial-gradient(circle,rgba(27,58,107,.15) 0%,transparent 70%);
  border-radius:50%;pointer-events:none;
}
#login-screen::after{
  content:'';position:absolute;bottom:-20%;left:-10%;
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(26,92,58,.1) 0%,transparent 70%);
  border-radius:50%;pointer-events:none;
}
.login-card{
  background:var(--white);border-radius:20px;padding:48px 44px;
  width:100%;max-width:420px;position:relative;z-index:1;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.login-logo-text{display:flex;flex-direction:column}
.login-logo-name{font-size:14px;font-weight:500;color:var(--black)}
.login-logo-sub{font-size:10px;color:var(--g400);margin-top:1px}
.login-title{font-family:var(--fd);font-size:28px;font-weight:400;letter-spacing:-.4px;margin-bottom:8px;color:var(--black)}
.login-sub{font-size:13px;color:var(--g500);margin-bottom:32px;line-height:1.7}
.form-label{font-size:11px;font-weight:500;color:var(--g500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:block}
.form-input{
  width:100%;padding:12px 14px;border:1.5px solid var(--g200);border-radius:9px;
  font-size:14px;font-family:var(--fb);background:var(--white);color:var(--black);
  outline:none;transition:all .2s;margin-bottom:16px;
}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(27,58,107,.08)}
.form-input::placeholder{color:var(--g300)}
.btn-login{
  width:100%;padding:14px;background:var(--black);color:var(--white);
  border:none;border-radius:10px;font-size:14px;font-weight:500;
  cursor:pointer;font-family:var(--fb);transition:all .15s;margin-top:4px;
}
.btn-login:hover{opacity:.88;transform:translateY(-1px)}
.btn-login:disabled{opacity:.4;cursor:default;transform:none}
.login-msg{font-size:12px;text-align:center;margin-top:16px;line-height:1.6;min-height:20px}
.login-msg.ok{color:var(--green)}
.login-msg.err{color:var(--red)}
.login-divider{display:flex;align-items:center;gap:12px;margin:24px 0}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--g200)}
.login-divider span{font-size:11px;color:var(--g400)}
.btn-demo{
  width:100%;padding:12px;background:transparent;color:var(--g500);
  border:1.5px solid var(--g200);border-radius:10px;font-size:13px;
  cursor:pointer;font-family:var(--fb);transition:all .15s;
}
.btn-demo:hover{border-color:var(--g300);color:var(--black);background:var(--g100)}
.login-roles{display:flex;gap:8px;margin-top:10px}
.btn-demo-role{
  flex:1;padding:10px;background:transparent;color:var(--g500);
  border:1.5px solid var(--g200);border-radius:9px;font-size:12px;
  cursor:pointer;font-family:var(--fb);transition:all .15s;text-align:center;
}
.btn-demo-role:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-l)}
.btn-demo-role .role-icon{font-size:18px;display:block;margin-bottom:4px}
.btn-demo-role .role-name{font-weight:500;display:block}
.btn-demo-role .role-desc{font-size:10px;color:var(--g400);display:block;margin-top:2px}

/* ══════════ APP SHELL ══════════ */
#app-shell{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--black);color:var(--white);
  display:flex;flex-direction:column;
  overflow-y:auto;
  transition:transform .3s;
}
.sidebar-header{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-logo{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.sidebar-brand{font-size:13px;font-weight:500;color:rgba(255,255,255,.85)}
.sidebar-role{font-size:10px;color:rgba(255,255,255,.3);margin-top:2px;padding-left:38px}
.sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.sidebar-section{font-size:9px;font-weight:500;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:.1em;padding:12px 10px 6px}
.sidebar-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:8px;cursor:pointer;color:rgba(255,255,255,.5);
  font-size:12px;font-weight:400;transition:all .12s;border:none;
  background:transparent;font-family:var(--fb);width:100%;text-align:left;
}
.sidebar-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.8)}
.sidebar-item.active{background:rgba(255,255,255,.1);color:var(--white);font-weight:500}
.sidebar-item-icon{width:18px;text-align:center;font-size:14px;flex-shrink:0}
.sidebar-item-badge{
  margin-left:auto;font-size:9px;padding:2px 6px;border-radius:99px;
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.4);font-family:var(--fm);
}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.06)}
.sidebar-user{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sidebar-avatar{
  width:32px;height:32px;border-radius:8px;
  background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;color:rgba(255,255,255,.6);
}
.sidebar-user-info{flex:1;min-width:0}
.sidebar-user-name{font-size:12px;font-weight:500;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user-email{font-size:10px;color:rgba(255,255,255,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-logout{
  width:100%;padding:8px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.4);
  border:none;border-radius:7px;font-size:11px;cursor:pointer;font-family:var(--fb);transition:all .12s;
}
.btn-logout:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)}

/* MAIN CONTENT AREA */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  height:var(--topbar-h);background:var(--white);border-bottom:1px solid var(--g200);
  display:flex;align-items:center;justify-content:space-between;padding:0 28px;
  flex-shrink:0;
}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar-title{font-size:14px;font-weight:500}
.topbar-sub{font-size:11px;color:var(--g400)}
.topbar-breadcrumb{font-size:11px;color:var(--g400)}
.topbar-breadcrumb span{color:var(--black);font-weight:500}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-btn{
  padding:7px 14px;border:1px solid var(--g200);border-radius:7px;
  font-size:12px;cursor:pointer;background:var(--white);font-family:var(--fb);
  color:var(--g500);transition:all .12s;
}
.topbar-btn:hover{border-color:var(--g300);color:var(--black)}
.topbar-btn.primary{background:var(--black);color:var(--white);border-color:var(--black)}
.topbar-btn.primary:hover{opacity:.85}

.content{flex:1;overflow-y:auto;padding:0}
.content-inner{max-width:900px;margin:0 auto;padding:28px 32px 60px}

/* ══════════ CARDS ══════════ */
.card{background:var(--white);border:1px solid var(--g200);border-radius:var(--r);padding:20px 24px;margin-bottom:16px}
.card-title{font-size:9px;font-weight:500;color:var(--g400);text-transform:uppercase;letter-spacing:.09em;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--g200)}

/* ══════════ HUB VIEW (ADMIN) ══════════ */
.hub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px}
.hub-card{
  background:var(--white);border:1px solid var(--g200);border-radius:14px;
  padding:24px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;
}
.hub-card:hover{border-color:var(--g300);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.06)}
.hub-card-icon{font-size:28px;margin-bottom:14px}
.hub-card-title{font-size:15px;font-weight:500;color:var(--black);margin-bottom:4px}
.hub-card-desc{font-size:12px;color:var(--g500);line-height:1.6}
.hub-card-arrow{position:absolute;top:24px;right:24px;font-size:14px;color:var(--g300);transition:all .15s}
.hub-card:hover .hub-card-arrow{color:var(--accent);transform:translateX(3px)}
.hub-card.highlight{border-color:var(--accent);background:linear-gradient(135deg,var(--white) 0%,var(--accent-l) 100%)}
.hub-card.highlight .hub-card-title{color:var(--accent)}
.hub-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.hub-stat{padding:16px;background:var(--white);border:1px solid var(--g200);border-radius:10px;text-align:center}
.hub-stat-val{font-family:var(--fm);font-size:24px;font-weight:500;color:var(--black);margin-bottom:2px}
.hub-stat-lbl{font-size:10px;color:var(--g400);text-transform:uppercase;letter-spacing:.06em}

/* ══════════ CLIENT PORTAL VIEW ══════════ */
.portal-hello{margin-bottom:28px}
.portal-hello-eye{font-size:10px;font-weight:500;color:var(--g400);text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px}
.portal-hello-name{font-family:var(--fd);font-size:30px;font-weight:400;letter-spacing:-.3px;margin-bottom:4px}
.portal-hello-sub{font-size:13px;color:var(--g500)}
.score-hero{
  background:var(--black);border-radius:var(--r);padding:24px 28px;margin-bottom:16px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;
}
.score-left{}
.score-arquetip-eye{font-size:9px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px}
.score-arquetip{font-family:var(--fd);font-size:24px;font-weight:400;color:var(--white);margin-bottom:3px}
.score-cartera{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:12px}
.score-right{text-align:right}
.score-num{font-family:var(--fm);font-size:44px;font-weight:500;line-height:1}
.score-denom{font-size:14px;opacity:.35;margin-left:2px}
.perfil-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.perfil-item{padding:10px 12px;background:var(--g100);border-radius:8px}
.perfil-lbl{font-size:9px;font-weight:500;color:var(--g400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.perfil-val{font-size:13px;font-weight:500;color:var(--black)}
.alloc-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--g100)}
.alloc-row:last-child{border-bottom:none}
.alloc-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.alloc-nom{font-size:12px;color:var(--black);flex:1}
.alloc-bar-wrap{width:100px;height:4px;background:var(--g200);border-radius:99px;overflow:hidden}
.alloc-bar{height:100%;border-radius:99px}
.alloc-pct{font-family:var(--fm);font-size:11px;color:var(--accent);min-width:32px;text-align:right}
.dims-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px}
.dim-item{text-align:center;padding:8px 3px;background:var(--g100);border-radius:7px}
.dim-val{font-family:var(--fm);font-size:13px;font-weight:500}
.dim-lbl{font-size:8px;color:var(--g400);margin-top:2px;line-height:1.2}
.proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.proj-card{padding:12px;border-radius:8px;text-align:center}
.proj-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.proj-val{font-family:var(--fm);font-size:16px;font-weight:500}
.nota-box{background:var(--g100);border-radius:8px;padding:14px 16px;font-size:13px;color:var(--g600);line-height:1.7;border-left:3px solid var(--g300);font-style:italic}
.hist-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--g100)}
.hist-item:last-child{border-bottom:none}
.hist-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.hist-titol{font-size:12px;font-weight:500;color:var(--black);margin-bottom:2px}
.hist-data{font-size:10px;color:var(--g400)}
.hist-desc{font-size:11px;color:var(--g500);margin-top:2px;line-height:1.5}
.radar-wrap{max-width:260px;height:220px;margin:0 auto}
.disc{font-size:10px;color:var(--g400);line-height:1.6;margin-top:24px;padding-top:14px;border-top:1px solid var(--g200)}

/* Portal tabs */
.portal-tabs{display:flex;gap:2px;background:var(--g100);padding:4px;border-radius:10px;margin-bottom:28px;overflow-x:auto}
.portal-tab{
  padding:8px 16px;border-radius:8px;font-size:12px;font-weight:500;
  cursor:pointer;color:var(--g500);border:none;background:transparent;
  font-family:var(--fb);white-space:nowrap;transition:all .15s;
}
.portal-tab.active{background:var(--white);color:var(--black);box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* Carteres model */
.pc-card{background:var(--white);border:1px solid var(--g200);border-radius:12px;overflow:hidden;margin-bottom:14px}
.pc-header{padding:16px 20px;border-bottom:1px solid var(--g100)}
.pc-nom{font-family:var(--fd);font-size:18px;font-weight:400;color:var(--black);margin-bottom:3px}
.pc-desc{font-size:12px;color:var(--g500);line-height:1.5}
.pc-body{padding:14px 20px}
.pc-alloc-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--g100)}
.pc-alloc-row:last-child{border-bottom:none}

/* Anàlisi portal */
.pa-card{
  background:var(--white);border:1px solid var(--g200);border-radius:12px;
  padding:18px 20px;margin-bottom:12px;cursor:pointer;transition:border-color .15s;
}
.pa-card:hover{border-color:var(--g300)}

/* ══════════ PREVIEW BANNER ══════════ */
.preview-banner{
  background:var(--accent);color:var(--white);text-align:center;padding:8px 16px;
  font-size:12px;display:flex;align-items:center;justify-content:center;gap:12px;
  flex-shrink:0;
}
.preview-banner button{
  background:rgba(255,255,255,.2);border:none;color:var(--white);padding:3px 10px;
  border-radius:5px;cursor:pointer;font-size:11px;font-family:var(--fb);
}
.preview-banner button:hover{background:rgba(255,255,255,.3)}

/* ══════════ IFRAME VIEWS ══════════ */
.iframe-wrap{flex:1;width:100%;border:none;display:flex;flex-direction:column}
.iframe-wrap iframe{flex:1;border:none;width:100%}

/* ══════════ SETTINGS ══════════ */
.settings-section{margin-bottom:28px}
.settings-title{font-size:14px;font-weight:500;margin-bottom:4px}
.settings-desc{font-size:12px;color:var(--g500);margin-bottom:16px;line-height:1.6}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--g200)}
.settings-row:last-child{border-bottom:none}
.settings-row-left{}
.settings-row-label{font-size:13px;font-weight:500;color:var(--black)}
.settings-row-desc{font-size:11px;color:var(--g400);margin-top:2px}

/* ══════════ RESPONSIVE ══════════ */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:200;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199;display:none}
  .sidebar-overlay.show{display:block}
  .hub-grid{grid-template-columns:1fr}
  .hub-stats{grid-template-columns:repeat(2,1fr)}
  .perfil-grid{grid-template-columns:1fr}
  .dims-grid{grid-template-columns:repeat(4,1fr)}
  .proj-grid{grid-template-columns:1fr}
  .score-hero{flex-direction:column}
  .score-right{text-align:left}
  .topbar-mobile-menu{display:block!important}
}
@media(min-width:769px){
  .topbar-mobile-menu{display:none!important}
}

/* ══════════ ANIMATIONS ══════════ */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.slide-in{animation:slideIn .25s ease-out}

/* ══════════ CARTERA RATIONALE ══════════ */
.rationale-box{
  background:var(--g100);border-radius:10px;padding:16px 18px;
  font-size:13px;color:var(--g600);line-height:1.7;
  border-left:3px solid var(--accent);margin-bottom:16px;
}
.rationale-box .rationale-label{
  font-size:9px;font-weight:600;color:var(--accent);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:6px;
}
.diff-box-portal{
  border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.6;margin-top:12px;
}
.diff-green{background:#EAF3DE;color:#1A5C3A}
.diff-amber{background:#FEF5E7;color:#7A4A00}
.diff-red{background:#FDF0F0;color:#8B1A1A}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi-item{background:var(--g100);border-radius:8px;padding:10px;text-align:center}
.kpi-label{font-size:9px;color:var(--g400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.kpi-value{font-family:var(--fm);font-size:14px;font-weight:500;color:var(--black)}

/* ══════════ CARTERES GRID (all 8) ══════════ */
.cg-card{
  background:var(--white);border:1.5px solid var(--g200);border-radius:12px;
  overflow:hidden;margin-bottom:14px;transition:all .15s;
}
.cg-card:hover{border-color:var(--g300)}
.cg-card.is-mine{border-color:var(--accent);box-shadow:0 2px 12px rgba(27,58,107,.1)}
.cg-mine-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:600;color:var(--accent);
  background:var(--accent-l);padding:3px 10px;border-radius:99px;
  margin-bottom:6px;
}
.cg-header{padding:16px 20px;cursor:pointer;display:flex;align-items:center;gap:14px}
.cg-num{
  width:36px;height:36px;border-radius:10px;background:var(--g100);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fm);font-size:12px;font-weight:500;color:var(--g500);flex-shrink:0;
}
.cg-card.is-mine .cg-num{background:var(--accent-l);color:var(--accent)}
.cg-header-text{flex:1;min-width:0}
.cg-cart-nom{font-family:var(--fd);font-size:16px;font-weight:400;color:var(--black);margin-bottom:2px}
.cg-arq-nom{font-size:11px;color:var(--g400)}
.cg-chevron{color:var(--g300);font-size:14px;transition:transform .2s}
.cg-card.open .cg-chevron{transform:rotate(90deg)}
.cg-body{display:none;padding:0 20px 18px;border-top:1px solid var(--g100)}

// AUTH
// ══════════════════════════════════════════════════
async function doLogin() {
  var email = document.getElementById('login-email').value.trim();
  var password = document.getElementById('login-password').value;
  var msg = document.getElementById('login-msg');
  var btn = document.getElementById('btn-login');

  if (!email || !email.includes('@')) {
    msg.className = 'login-msg err'; msg.textContent = 'Introdueix un email vàlid.'; return;
  }
  if (!password || password.length < 4) {
    msg.className = 'login-msg err'; msg.textContent = 'Introdueix la contrasenya.'; return;
  }

  btn.disabled = true; btn.textContent = 'Accedint...'; msg.textContent = '';

  if (sb) {
    try {
      var res = await sb.auth.signInWithPassword({ email: email, password: password });
      if (res.error) throw res.error;
      var role = ADMIN_EMAILS.indexOf(email.toLowerCase()) >= 0 ? 'admin' : 'client';
      enterApp(role, email, false);
      return;
    } catch(e) {
      msg.className = 'login-msg err';
      msg.textContent = 'Error: ' + (e.message || 'No s\'ha pogut connectar');
      btn.disabled = false; btn.textContent = 'Accedir →';
      return;
    }
  }

  // Fallback: demo mode if Supabase not available
  msg.className = 'login-msg err';
  msg.textContent = 'Connexió no disponible. Usa el mode demo.';
  btn.disabled = false; btn.textContent = 'Accedir →';
}

function demoLogin(role) {
  enterApp(role, role === 'admin' ? 'guillem@theboringinvestor.com' : 'maria.garcia@example.com', true);
}

function enterApp(role, email, isDemo) {
  APP.role = role;
  APP.isDemo = isDemo;
  APP.user = {
    email: email,
    name: role === 'admin' ? 'Guillem Puig' : DEMO_CLIENT.nom,
    initials: role === 'admin' ? 'GP' : 'MG',
  };

  // Store session
  localStorage.setItem('tbi_session', JSON.stringify({ role: role, email: email, isDemo: isDemo }));

  // Hide login, show app
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-shell').classList.remove('hidden');

  // Setup app
  setupSidebar();
  navigateTo(role === 'admin' ? 'hub' : 'portal-perfil');
}

async function doLogout() {
  if (sb) { try { await sb.auth.signOut(); } catch(e) {} }
  localStorage.removeItem('tbi_session');
  APP = { role: null, user: null, view: null, isDemo: false, isPreview: false };
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app-shell').classList.add('hidden');
  document.getElementById('login-email').value = '';
  document.getElementById('login-password').value = '';
  document.getElementById('login-msg').textContent = '';
  document.getElementById('btn-login').disabled = false;
  document.getElementById('btn-login').textContent = 'Accedir →';
}

// Check for existing session on load
function checkSession() {
  var s = localStorage.getItem('tbi_session');
  if (s) {
    try {
      s = JSON.parse(s);
      if (s.role && s.email) {
        enterApp(s.role, s.email, s.isDemo || false);
        return true;
      }
    } catch(e) {}
  }
  return false;
}

function setupSidebar() {
  var nav = document.getElementById('sidebar-nav');
  var items = APP.role === 'admin' ? ADMIN_NAV : CLIENT_NAV;
  var roleLabel = APP.role === 'admin' ? 'Assessor · Administrador' : 'Client';
  if (APP.isDemo) roleLabel += ' · Demo';

  document.getElementById('sidebar-role').textContent = roleLabel;
  document.getElementById('sidebar-avatar').textContent = APP.user.initials;
  document.getElementById('sidebar-user-name').textContent = APP.user.name;
  document.getElementById('sidebar-user-email').textContent = APP.user.email;

  var html = '';
  items.forEach(function(item) {
    if (item.section) {
      html += '<div class="sidebar-section">' + item.section + '</div>';
    } else if (item.external) {
      html += '<button class="sidebar-item" onclick="openExternal(\'' + item.external + '\')">'
        + '<span class="sidebar-item-icon">' + item.icon + '</span>'
        + item.label
        + '<span class="sidebar-item-badge">↗</span>'
        + '</button>';
    } else {
      html += '<button class="sidebar-item" data-view="' + item.id + '" onclick="navigateTo(\'' + item.id + '\')">'
        + '<span class="sidebar-item-icon">' + item.icon + '</span>'
        + item.label
        + (item.badge ? '<span class="sidebar-item-badge">' + item.badge + '</span>' : '')
        + '</button>';
    }
  });
  nav.innerHTML = html;
}

function navigateTo(viewId) {
  APP.view = viewId;

  // Update sidebar active state
  document.querySelectorAll('.sidebar-item').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.view === viewId);
  });

  // Update topbar
  var titles = {
    'hub': ['Hub de l\'assessor', 'Vista general de la plataforma'],
    'admin-clients': ['Clients', 'Llistat i gestió de clients'],
    'portal-perfil': APP.role === 'admin' ? ['Portal Client · Perfil', '👁 Previsualització'] : ['El meu perfil', 'El teu perfil inversor'],
    'portal-assessoria': APP.role === 'admin' ? ['Portal Client · Assessoria', '👁 Previsualització'] : ['Assessoria', 'Anàlisi i informació financera'],
    'portal-carteres': APP.role === 'admin' ? ['Portal Client · Les 8 Carteres', '👁 Previsualització'] : ['Les 8 Carteres', '8 arquetips, 8 carteres personalitzades'],
    'settings': ['Configuració', 'Gestió del sistema'],
  };
  var t = titles[viewId] || [viewId, ''];
  document.getElementById('topbar-title').textContent = t[0];
  document.getElementById('topbar-sub').textContent = t[1];

  // Show preview banner for admin viewing client portal
  var isPortalView = viewId.startsWith('portal-');
  document.getElementById('preview-banner').classList.toggle('hidden', !(isPortalView && APP.role === 'admin'));

  // Render content
  renderView(viewId);

  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('show');
}

function renderView(viewId) {
  var content = document.getElementById('content');
  switch(viewId) {
    case 'hub': renderHub(content); break;
    case 'admin-clients': renderClientsList(content); break;
    case 'portal-perfil': renderPortalPerfil(content); break;
    case 'portal-assessoria': renderPortalAssessoria(content); break;
    case 'portal-carteres': renderPortalCarteres(content); break;
    case 'settings': renderSettings(content); break;
    default: content.innerHTML = '<div class="content-inner"><div style="text-align:center;padding:60px;color:var(--g400)">Vista no disponible</div></div>';
  }
}

function openExternal(file) {
  window.open(file, '_blank');
}

function exitPreview() {
  navigateTo('hub');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('show');
}

  html += '<div class="card"><div class="card-title">Perfil de les 7 dimensions</div><div class="dims-grid">';

        plugins:{legend:{display:false}},
        scales:{r:{
          min:0, max:12,
          ticks:{stepSize:4, color:'rgba(0,0,0,.25)', backdropColor:'transparent', font:{size:9}},
          grid:{color:'rgba(0,0,0,0.06)'},
          pointLabels:{color:'#6B6762', font:{size:9}},
          angleLines:{color:'rgba(0,0,0,0.06)'}
        }}
      }
    });
  }, 200);
}

    html += '<div class="pa-card">'
      + '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">'
        + '<span style="font-size:10px;font-weight:600;padding:3px 8px;border-radius:99px;background:' + cat.bg + ';color:' + cat.tc + '">' + cat.lbl + '</span>'
        + '<span style="font-size:11px;color:var(--g400)">' + data + '</span>'
        + (a.destacat ? '<span style="font-size:10px;color:var(--accent)">⭐</span>' : '')
      + '</div>'
      + '<div style="font-size:14px;font-weight:500;color:var(--black);margin-bottom:4px">' + a.titol + '</div>'
      + (a.subtitol ? '<div style="font-size:12px;color:var(--g400);font-style:italic;margin-bottom:8px">' + a.subtitol + '</div>' : '')
      + '<div style="font-size:12px;color:var(--g500);line-height:1.6">' + a.resum + '</div>'
      + (a.tags ? '<div style="display:flex;gap:4px;margin-top:8px;flex-wrap:wrap">' + a.tags.map(function(t){return '<span style="font-size:10px;padding:2px 7px;background:var(--g100);border-radius:99px;color:var(--g500)">' + t + '</span>';}).join('') + '</div>' : '')
    + '</div>';
  });

  html += '</div>';
  el.innerHTML = html;
}

// ══════════════════════════════════════════════════
// VIEW: PORTAL CARTERES
// ══════════════════════════════════════════════════
function renderPortalCarteres(el) {
  var myId = DEMO_CLIENT.arquetipId;
  var html = '<div class="content-inner fade-in">';

  // Tabs
  html += '<div class="portal-tabs">'
    + '<button class="portal-tab" onclick="navigateTo(\'portal-perfil\')">📊 El meu perfil</button>'
    + '<button class="portal-tab" onclick="navigateTo(\'portal-assessoria\')">📈 Assessoria</button>'
    + '<button class="portal-tab active" onclick="navigateTo(\'portal-carteres\')">🗂 Les 8 Carteres</button>'
  + '</div>';

  html += '<div style="margin-bottom:24px">'
    + '<div style="font-family:var(--fd);font-size:22px;font-weight:400;color:var(--black);margin-bottom:6px">8 Arquetips, 8 Carteres</div>'
    + '<div style="font-size:12px;color:var(--g500);line-height:1.7;max-width:600px">'
      + 'Cada inversor té un comportament real diferent. No n\'hi ha prou amb el risc declarat — cada cartera està dissenyada per al comportament real, no per al teòric. '
      + 'La teva cartera és la <strong style="color:var(--accent)">' + getArquetip(myId).cartNom + '</strong>.'
    + '</div>'
  + '</div>';

  // Render all 8 carteres as collapsible cards
  ARQUETIPS_CARTERES.forEach(function(arq, idx) {
    var isMine = arq.id === myId;
    var isOpen = isMine; // Auto-open the client's own cartera
    var diffClass = arq.riscClass === 'green' ? 'diff-green' : arq.riscClass === 'red' ? 'diff-red' : 'diff-amber';
    var romanNums = ['I','II','III','IV','V','VI','VII','VIII'];

    html += '<div class="cg-card' + (isMine?' is-mine':'') + (isOpen?' open':'') + '" id="cg-' + arq.id + '">';

    // Header (clickable)
    html += '<div class="cg-header" onclick="toggleCartera(\'' + arq.id + '\')">'
      + '<div class="cg-num">' + romanNums[idx] + '</div>'
      + '<div class="cg-header-text">'
        + (isMine ? '<div class="cg-mine-badge">✦ La teva cartera</div>' : '')
        + '<div class="cg-cart-nom">' + arq.cartNom + '</div>'
        + '<div class="cg-arq-nom">' + arq.nom + ' — ' + arq.ep.split('·')[0].trim() + ' · ' + arq.cartSub + '</div>'
      + '</div>'
      + '<div class="cg-chevron">›</div>'
    + '</div>';

    // Body (expandable)
    html += '<div class="cg-body">';

    // Rationale
    html += '<div class="rationale-box" style="margin-top:14px">'
      + '<div class="rationale-label">Per què aquesta cartera per a ' + arq.nom + '?</div>'
      + arq.rationale
    + '</div>';

    // Asset allocation
    arq.actius.forEach(function(a){
      html += '<div class="alloc-row">'
        + '<div class="alloc-dot" style="background:' + a.color + '"></div>'
        + '<div class="alloc-nom">' + a.nom + '</div>'
        + '<div class="alloc-bar-wrap"><div class="alloc-bar" style="width:' + a.pct + '%;background:' + a.color + '"></div></div>'
        + '<div class="alloc-pct">' + a.pct + '%</div>'
      + '</div>';
    });

    // KPIs
    html += '<div class="kpi-grid" style="margin-top:14px">'
      + '<div class="kpi-item"><div class="kpi-label">TER estimat</div><div class="kpi-value">' + arq.ter + '</div></div>'
      + '<div class="kpi-item"><div class="kpi-label">Retorn esperat</div><div class="kpi-value">' + arq.retorn + '</div></div>'
      + '<div class="kpi-item"><div class="kpi-label">Nivell de risc</div><div class="kpi-value">' + arq.risc + '</div></div>'
    + '</div>';

    // Warning/diff box
    html += '<div class="diff-box-portal ' + diffClass + '">'
      + '<strong style="font-size:10px;text-transform:uppercase;letter-spacing:.05em">⚠ Clau:</strong> '
      + arq.diff
    + '</div>';

    html += '</div>'; // close body
    html += '</div>'; // close card
  });

  html += '</div>';
  el.innerHTML = html;

  // Scroll to own cartera if needed
  if (myId) {
    var myCard = document.getElementById('cg-' + myId);
    if (myCard) setTimeout(function(){ myCard.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 100);
  }
}

function toggleCartera(id) {
  var card = document.getElementById('cg-' + id);
  if (card) card.classList.toggle('open');
}
