<style>
:root{
  --navy:#16233A; --navy2:#24395C; --cream:#F7F5F0; --gold:#C8A54A;
  --ink:#16233A; --ink-2:#24395C;
  --sh-1:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.05);
  --sh-2:0 4px 8px rgba(16,24,40,.05),0 12px 28px rgba(16,24,40,.09);
  --sh-3:0 8px 16px rgba(16,24,40,.07),0 24px 56px rgba(16,24,40,.14);
  --black:#16233A; --g700:#3A3A3A; --g500:#6B6762; --g400:#9A9690;
  --g200:#D9D6D0; --g100:#ECEAE6; --g50:#F4F3F0;
  --green:#1A5C3A; --red:#C0392B;
  --fd:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --fb:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --fm:'IBM Plex Mono','SF Mono',Menlo,monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--fb);background:var(--cream);color:var(--black);
  font-size:15px;line-height:1.5;overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none !important}
button{font-family:var(--fb);cursor:pointer;border:none}
input,textarea{font-family:var(--fb);font-size:16px}/* 16px evita zoom a iOS */

/* ── LOADING ── */
#splash{
  position:fixed;inset:0;background:linear-gradient(160deg,var(--ink-2) 0%,var(--ink) 55%,#080F1A 100%);display:flex;
  flex-direction:column;align-items:center;justify-content:center;z-index:1000;
}
#splash .logo{font-family:var(--fd);color:#fff;font-size:30px;letter-spacing:1px}
#splash .tag{color:rgba(255,255,255,.6);font-size:12px;margin-top:8px;letter-spacing:.05em}
.spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-top:24px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── LOGIN ── */
#login{position:fixed;inset:0;background:var(--cream);display:flex;flex-direction:column;justify-content:center;padding:32px 26px;padding-top:calc(32px + var(--safe-top));z-index:900}
#login .brand{font-family:var(--fd);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:6px}
#login h1{font-family:var(--fd);font-size:30px;font-weight:500;text-align:center;color:var(--navy);margin-bottom:6px;letter-spacing:-.5px}
#login .sub{text-align:center;color:var(--g500);font-size:13px;margin-bottom:32px;line-height:1.6}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--g500);margin-bottom:6px;font-weight:500}
.field input{width:100%;padding:13px 14px;border:1.5px solid var(--g200);border-radius:11px;background:#fff;transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--navy)}
.btn-primary{width:100%;padding:14px;background:var(--navy);color:#fff;border-radius:11px;font-size:15px;font-weight:600;transition:opacity .15s}
.btn-primary:active{opacity:.85}
.btn-primary:disabled{opacity:.5}
#login-msg{min-height:20px;font-size:12px;text-align:center;margin:12px 0}

/* ── APP SHELL ── */
#app{display:none;flex-direction:column;height:100%}
#app.show{display:flex}
.topbar{
  background:linear-gradient(180deg,var(--ink-2) 0%,var(--ink) 100%);color:#fff;padding:calc(14px + var(--safe-top)) 20px 14px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.topbar .ttl{font-family:var(--fd);font-size:18px;font-weight:500}
.topbar .out{background:rgba(255,255,255,.12);color:#fff;font-size:11px;padding:7px 12px;border-radius:8px;font-weight:500}
.topbar .out:active{background:rgba(255,255,255,.22)}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px;padding-bottom:90px}

/* ── BOTTOM NAV ── */
.nav{
  position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--g100);
  display:flex;padding-bottom:var(--safe-bottom);z-index:100;
  box-shadow:0 -8px 24px rgba(16,24,40,.06);
}
.nav button{flex:1;padding:10px 2px 8px;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--g400);font-size:10px;font-weight:500;white-space:nowrap}
.nav button.active{color:var(--navy)}
.nav button .ic{font-size:20px;line-height:1}

/* ── CARDS ── */
.card{background:#fff;border:1px solid var(--g100);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--sh-1)}
.card-lbl{font-size:11px;color:var(--g400);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:4px}
.kpi-big{font-family:var(--fm);font-size:32px;font-weight:500;color:var(--navy);letter-spacing:-1px}
.kpi-sub{font-size:13px;margin-top:4px;font-family:var(--fm)}
.pos-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--g50)}
.pos-row:last-child{border-bottom:none}
.pos-emoji{font-size:20px;flex-shrink:0}
.pos-nom{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos-meta{font-size:10px;color:var(--g400);margin-top:1px}
.pos-val{font-family:var(--fm);font-size:14px;font-weight:500;text-align:right;flex-shrink:0}
.pos-pnl{font-size:10px;font-family:var(--fm);text-align:right}

.section-h{font-family:var(--fd);font-size:20px;font-weight:500;color:var(--navy);margin:4px 4px 12px}

/* ── MODAL ── */
.modal{position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:500;display:flex;align-items:flex-end;justify-content:center}
.modal-inner{background:#fff;border-radius:18px 18px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:22px 18px;padding-bottom:calc(22px + var(--safe-bottom));box-shadow:var(--sh-3)}
.modal-inner::before{content:'';display:block;width:36px;height:4px;border-radius:99px;background:var(--g200);margin:0 auto 14px}
.modal-h{font-family:var(--fd);font-size:20px;font-weight:500;color:var(--navy);margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--g500);margin-bottom:18px;line-height:1.5}
.upd-row{padding:14px 0;border-bottom:1px solid var(--g50)}
.upd-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.upd-input{width:100%;padding:12px 14px;border:1.5px solid var(--g200);border-radius:10px;font-family:var(--fm);text-align:right;font-size:16px}
.upd-input:focus{outline:none;border-color:var(--navy)}

/* ── CHAT ── */
/* Sub-tabs dins Missatges */
.subtabs{display:flex;gap:4px;background:var(--g50);border-radius:11px;padding:4px;margin-bottom:14px;flex-shrink:0}
.subtabs button{flex:1;padding:9px 6px;background:none;border:none;border-radius:8px;font-size:13px;font-weight:600;color:var(--g500);cursor:pointer;font-family:inherit;position:relative}
.subtabs button.active{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(10,10,10,.08)}
.subtabs .dot{position:absolute;top:6px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
/* Targetes de comunicat */
.com-card{background:#fff;border:1px solid var(--g100);border-radius:13px;padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:border-color .15s,box-shadow .15s;box-shadow:var(--sh-1)}
.com-card:active{border-color:var(--navy)}
.com-eyebrow{font-size:10px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.com-titol{font-family:var(--fd);font-size:17px;font-weight:500;color:var(--navy);line-height:1.25;margin-bottom:3px}
.com-subtitol{font-size:13px;color:var(--g500);line-height:1.4;margin-bottom:8px}
.com-meta{font-size:11px;color:var(--g400);display:flex;align-items:center;gap:8px}
.com-new-badge{background:var(--gold);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em}
.com-body{font-size:14px;line-height:1.65;color:var(--g700);white-space:pre-line}
.chat-wrap{display:flex;flex-direction:column;height:100%}
.chat-thread{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px 12px}
.bubble{max-width:82%;padding:11px 15px;font-size:14px;line-height:1.55;white-space:pre-line;border-radius:14px}
.bubble.mine{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.bubble.theirs{align-self:flex-start;background:#fff;border:1px solid var(--g100);color:var(--black);border-bottom-left-radius:4px}
.bubble-meta{font-size:9px;color:var(--g400);margin-top:3px;padding:0 4px}
.chat-input-bar{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--g100)}
.chat-input-bar textarea{flex:1;padding:11px 13px;border:1.5px solid var(--g200);border-radius:12px;resize:none;max-height:90px;line-height:1.4}
.chat-input-bar textarea:focus{outline:none;border-color:var(--navy)}
.chat-send{background:var(--navy);color:#fff;border-radius:12px;padding:0 18px;font-weight:600;font-size:14px}
.chat-send:disabled{opacity:.5}

.empty{text-align:center;color:var(--g400);font-size:13px;padding:48px 20px;line-height:1.6}
.toast{position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:var(--black);color:#fff;font-size:13px;padding:11px 18px;border-radius:10px;z-index:800;opacity:0;transition:opacity .2s;max-width:88%;text-align:center}
.toast.show{opacity:1}
.banner-upd{background:#FEF7E8;border:1px solid #E8C988;border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.banner-upd .txt{flex:1;font-size:12px;color:#7A4A00;line-height:1.5}
.banner-upd button{background:var(--gold);color:#fff;font-size:12px;font-weight:600;padding:9px 14px;border-radius:9px;flex-shrink:0}

/* ══ POLISH GLOBAL · mateix llenguatge que la plataforma ══ */
::selection{background:var(--navy);color:#fff}
button{transition:transform .1s ease,opacity .15s ease,background-color .15s ease,color .15s ease}
button:not(:disabled):active{transform:translateY(1px)}
:focus-visible{outline:2px solid var(--navy2);outline-offset:2px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy)!important;box-shadow:0 0 0 3px rgba(27,58,107,.10)}
.nav button.active .ic{transform:translateY(-1px)}
.nav button .ic{transition:transform .15s ease}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>

// ── Helpers ──
function $(id){ return document.getElementById(id); }
function esc(s){
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function eur(n){ return (Math.round((n||0)*100)/100).toLocaleString('ca-ES') + '€'; }

function mesActual(){ return new Date().toISOString().slice(0,10).slice(0,7); }
function avui(){ return new Date().toISOString().slice(0,10); }
function nomMesCA(yyyymm){
  var noms = ['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
  var m = parseInt((yyyymm||'').slice(5,7),10);
  return (m>=1 && m<=12) ? noms[m-1] : '';
}
function mesAbrevCA(yyyymm){
  var noms = ['gen','feb','mar','abr','mai','jun','jul','ago','set','oct','nov','des'];
  var m = parseInt((yyyymm||'').slice(5,7),10);
  return (m>=1 && m<=12) ? noms[m-1] : '';
}
// Data ISO (YYYY-MM-DD) -> format humà curt: "15 jun" o "fa X dies"
function dataHumana(iso){
  if (!iso) return 'sense data';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  var dies = Math.floor((new Date() - d) / 86400000);
  if (dies <= 0) return 'avui';
  if (dies === 1) return 'ahir';
  if (dies < 30) return 'fa ' + dies + ' dies';
  var mesos = ['gen','feb','mar','abr','mai','jun','jul','ago','set','oct','nov','des'];
  return d.getDate() + ' ' + mesos[d.getMonth()] + ' ' + d.getFullYear();
}
// Paleta de fallback per a categories sense color al target
var CAT_PALETTE = ['#1B3A6B','#2E5FA3','#4A7CC7','#B8902E','#1A5C3A','#8C6BAA','#C0743A','#5B8A72','#A0526B','#3A7A8C','#9A9690','#6B6762'];
// Retorna {nom, color} d'una categoria, fent servir el target del client si hi és
function catInfo(catId){
  var target = getTarget();
  for (var i=0;i<target.length;i++){
    var t = target[i];
    if ((t.id || t.nom) === catId) return { nom: t.nom || catId, color: t.color || CAT_PALETTE[i % CAT_PALETTE.length] };
  }
  // fallback: nom llegible des de CAT_NOM, o l'id net si no hi és
  var nom = CAT_NOM[catId] || String(catId||'altres').replace(/_/g,' ');
  var h = 0; for (var k=0;k<nom.length;k++){ h = (h*31 + nom.charCodeAt(k)) & 0xffff; }
  return { nom: nom, color: CAT_PALETTE[h % CAT_PALETTE.length] };
}
function parseNumCA(s){
  if (s == null) return NaN;
  s = String(s).trim().replace(/\s|€/g,'').replace(/\./g,'').replace(/,/g,'.');
  return parseFloat(s);
}
function novaId(prefix){
  return (prefix||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

var _toastTimer = null;
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

// ── Lectura de posicions ──
function getPosicions(){
  var c = APP.client;
  return (c && Array.isArray(c.posicions)) ? c.posicions : [];
}
function getMoviments(){
  var c = APP.client;
  return (c && Array.isArray(c.moviments_posicions)) ? c.moviments_posicions : [];
}
function getSnapshots(){
  var c = APP.client;
  return (c && Array.isArray(c.snapshots_cartera)) ? c.snapshots_cartera : [];
}

// Dies des de l'última actualització de valors. null=sense cartera, Infinity=mai.
function diesDesActualitzacio(){
  var pos = getPosicions();
  if (!pos.length) return null;
  var dates = pos.map(function(p){ return p.valor_data; }).filter(Boolean);
  if (!dates.length) return Infinity;
  dates.sort();
  var u = new Date(dates[dates.length-1]);
  if (isNaN(u.getTime())) return Infinity;
  return Math.floor((new Date() - u) / 86400000);
}
function carteraActualitzadaAquestMes(){
  var pos = getPosicions();
  var mes = mesActual();
  for (var i=0;i<pos.length;i++){
    if (pos[i].valor_data && String(pos[i].valor_data).slice(0,7) === mes) return true;
  }
  return false;
}

// Calcula valor, cost i P&L d'una posició a partir dels moviments
function aggPosicio(p){
  var movs = getMoviments().filter(function(m){ return m.posicio_id === p.id; });
  var cost = 0;
  movs.forEach(function(m){
    var im = parseFloat(m.import)||0;
    if (m.tipus === 'compra') cost += im;
    else if (m.tipus === 'venda') cost -= im;
  });
  var valor = parseFloat(p.valor_actual)||0;
  var pnl = valor - cost;
  var pnlPct = cost > 0 ? (pnl/cost*100) : 0;
  return { cost:cost, valor:valor, pnl:pnl, pnlPct:pnlPct };
}

async function doLogin(){
  var email = ($('in-email').value||'').trim().toLowerCase();
  var pwd = $('in-pwd').value || '';
  var msg = $('login-msg');
  var btn = $('btn-login');
  msg.style.color = 'var(--red)';
  if (!email || email.indexOf('@') === -1){ msg.textContent = 'Introdueix un correu vàlid.'; return; }
  if (!pwd){ msg.textContent = 'Introdueix la contrasenya.'; return; }
  if (!sb){ msg.textContent = 'Sense connexió amb el servidor.'; return; }

  btn.disabled = true; btn.textContent = 'Entrant...'; msg.textContent = '';
  try {
    var res = await sb.auth.signInWithPassword({ email: email, password: pwd });
    if (res.error) throw res.error;

    msg.style.color = 'var(--red)';
    msg.textContent = 'No s\'ha pogut entrar. Comprova el correu i la contrasenya.';
    btn.disabled = false; btn.textContent = 'Entrar →';

// Genera un donut SVG a partir de segments [{nom,color,valor}]. Retorna {svg, total}
function donutSVG(segments){
  var total = segments.reduce(function(s,x){ return s + (x.valor||0); }, 0);
  if (total <= 0) return { svg:'', total:0 };
  var size = 180, cx = size/2, cy = size/2, r = 62, sw = 26;
  var circ = 2 * Math.PI * r;
  var offset = 0;
  var arcs = '';
  segments.forEach(function(seg){
    var frac = seg.valor / total;
    if (frac <= 0) return;
    var len = frac * circ;
    // dasharray: tram pintat + buit; rotem amb dashoffset acumulat
    arcs += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" '
      + 'stroke="'+seg.color+'" stroke-width="'+sw+'" '
      + 'stroke-dasharray="'+len.toFixed(2)+' '+(circ-len).toFixed(2)+'" '
      + 'stroke-dashoffset="'+(-offset).toFixed(2)+'" '
      + 'transform="rotate(-90 '+cx+' '+cy+')"/>';
    offset += len;
  });
  var svg = '<svg viewBox="0 0 '+size+' '+size+'" style="width:170px;height:170px;display:block;margin:0 auto">'
    + arcs
    + '<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="11" fill="#9A9690" font-family="DM Sans,sans-serif">Total</text>'
    + '<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="17" fill="#1B3A6B" font-weight="600" font-family="DM Mono,monospace">'+eurRound(total)+'</text>'
    + '</svg>';
  return { svg:svg, total:total };
}

// Agrupa el valor de les posicions per categoria -> [{cat,nom,color,valor}] ordenat desc
function segmentsPerCategoria(){
  var per = {};
  getPosicions().forEach(function(p){
    var cat = p.cat || 'altres';
    per[cat] = (per[cat]||0) + (parseFloat(p.valor_actual)||0);
  });
  var segs = Object.keys(per).map(function(cat){
    var info = catInfo(cat);
    return { cat:cat, nom:info.nom, color:info.color, valor:per[cat] };
  });
  segs.sort(function(a,b){ return b.valor - a.valor; });
  return segs;
}

function renderCartera(){
  var pos = getPosicions();
  var el = $('view');

  if (!pos.length){
    el.innerHTML = '<div class="empty">Encara no tens posicions registrades.<br><br>El teu assessor les afegirà aviat.</div>';
    return;
  }

  var valorTotal = 0, costTotal = 0;
  pos.forEach(function(p){ var a = aggPosicio(p); valorTotal += a.valor; costTotal += a.cost; });
  var guany = valorTotal - costTotal;              // revaloració real (no inclou que aportis més)
  var guanyPct = costTotal > 0 ? (guany/costTotal*100) : 0;

  var html = '';

  // KPI principal: valor total
  html += '<div class="card">'
    + '<div class="card-lbl">Valor total de la cartera</div>'
    + '<div class="kpi-big">'+eurRound(valorTotal)+'</div>';
  // Separació clara: aportat vs guany
  var colG = guany >= 0 ? 'var(--green)' : 'var(--red)';
  html += '<div style="display:flex;gap:18px;margin-top:12px">'
    + '<div><div style="font-size:10px;color:var(--g400);text-transform:uppercase;letter-spacing:.05em;font-weight:600">Has aportat</div>'
      + '<div style="font-family:var(--fm);font-size:15px;color:var(--g700);margin-top:2px">'+eurRound(costTotal)+'</div></div>'
    + '<div><div style="font-size:10px;color:var(--g400);text-transform:uppercase;letter-spacing:.05em;font-weight:600">Guany/pèrdua</div>'
      + '<div style="font-family:var(--fm);font-size:15px;color:'+colG+';margin-top:2px">'+(guany>=0?'+':'')+eurRound(guany)+' · '+pct(guanyPct)+'</div></div>'
    + '</div>'
    + '<div style="font-size:11px;color:var(--g400);margin-top:10px;line-height:1.4">El guany és la revaloració de la teva inversió. Les aportacions noves no compten com a guany.</div>'
    + '</div>';

  // Botó actualitzar (acció principal única — sense banner duplicat)
  var dies = diesDesActualitzacio();
  var necessitaUpd = !carteraActualitzadaAquestMes() && dies !== null;
  var btnTxt = necessitaUpd
    ? (dies === Infinity ? '💱 Posa els valors al dia' : '💱 Actualitzar (fa '+dies+' dies)')
    : '💱 Actualitzar valors';
  html += '<button class="btn-primary" style="margin-bottom:16px" onclick="obrirActualitzar()">'+btnTxt+'</button>';

  // ── DONUT: proporció per família d'actius ──
  var segs = segmentsPerCategoria();
  var donut = donutSVG(segs);
  if (donut.svg){
    html += '<div class="card">'
      + '<div class="card-lbl" style="margin-bottom:10px">Distribució per família d\'actius</div>'
      + donut.svg
      + '<div style="margin-top:14px">';
    segs.forEach(function(seg){
      var p = donut.total > 0 ? (seg.valor/donut.total*100) : 0;
      html += '<div style="display:flex;align-items:center;gap:10px;padding:6px 0">'
        + '<span style="width:11px;height:11px;border-radius:3px;flex-shrink:0;background:'+seg.color+'"></span>'
        + '<div style="flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(seg.nom)+'</div>'
        + '<div style="font-family:var(--fm);font-size:13px;color:var(--g700)">'+p.toFixed(0)+'%</div>'
      + '</div>';
    });
    html += '</div></div>';
  }

  // Llista de posicions
  html += '<div class="card"><div class="card-lbl" style="margin-bottom:8px">Posicions</div>';
  pos.forEach(function(p){
    var a = aggPosicio(p);
    var colP = a.pnl >= 0 ? 'var(--green)' : 'var(--red)';
    var dataTxt = p.valor_data ? ('Actualitzat ' + dataHumana(p.valor_data)) : 'Sense valor';
    var catNom = catInfo(p.cat).nom;
    var sub = [];
    if (p.nom && p.nom !== catNom) sub.push(esc(p.nom));
    if (p.broker) sub.push(esc(p.broker));
    sub.push(dataTxt);
    html += '<div class="pos-row">'
      + '<span class="pos-emoji">'+emojiFor(p)+'</span>'
      + '<div style="flex:1;min-width:0">'
        + '<div class="pos-nom">'+esc(catNom)+'</div>'
        + '<div class="pos-meta">'+sub.join(' · ')+'</div>'
      + '</div>'
      + '<div>'
        + '<div class="pos-val">'+eurRound(a.valor)+'</div>'
        + '<div class="pos-pnl" style="color:'+colP+'">'+pct(a.pnlPct)+'</div>'
      + '</div>'
    + '</div>';
  });
  html += '</div>';

  el.innerHTML = html;
}

// ── Modal actualitzar valors ──
function obrirActualitzar(){
  var pos = getPosicions();
  if (!pos.length){ toast('Encara no hi ha posicions'); return; }

  var rows = pos.map(function(p){
    var oldv = parseFloat(p.valor_actual)||0;
    var dataTxt = p.valor_data ? ('anterior: '+eurRound(oldv)+' · '+dataHumana(p.valor_data)) : 'sense valor previ';
    var catNom = catInfo(p.cat).nom;
    var subNom = (p.nom && p.nom !== catNom) ? (esc(p.nom)+' · ') : '';
    return '<div class="upd-row">'
      + '<div class="upd-top">'
        + '<span class="pos-emoji">'+emojiFor(p)+'</span>'
        + '<div style="flex:1;min-width:0">'
          + '<div class="pos-nom">'+esc(catNom)+'</div>'
          + '<div class="pos-meta">'+subNom+dataTxt+'</div>'
        + '</div>'
      + '</div>'
      + '<input class="upd-input" inputmode="decimal" data-pos-id="'+esc(p.id)+'" data-old="'+oldv+'" '
        + 'value="'+(oldv>0?oldv.toLocaleString('ca-ES'):'')+'" placeholder="Valor actual €">'
    + '</div>';
  }).join('');

  var modal = document.createElement('div');
  modal.className = 'modal';
  modal.id = 'modal-upd';
  modal.innerHTML = '<div class="modal-inner">'
    + '<div class="modal-h">Actualitzar valors</div>'
    + '<div class="modal-sub">Posa el valor de mercat actual de cada posició. El trobaràs al teu bróker. Mes: '+nomMesCA(mesActual())+'.</div>'
    + rows
    + '<div style="display:flex;gap:10px;margin-top:18px">'
      + '<button onclick="tancarModal()" style="flex:1;padding:13px;background:var(--g50);color:var(--g700);border-radius:11px;font-weight:500">Cancel·lar</button>'
      + '<button class="btn-primary" style="flex:2" id="btn-upd-save" onclick="guardarActualitzacio()">Desar</button>'
    + '</div>'
  + '</div>';
  document.body.appendChild(modal);
  modal.addEventListener('click', function(ev){ if (ev.target === modal) tancarModal(); });
}
function tancarModal(){
  var m = $('modal-upd'); if (m) m.parentNode.removeChild(m);
}

async function guardarActualitzacio(){
  var data = avui();
  var mes = data.slice(0,7);
  var pos = getPosicions().slice();
  var btn = $('btn-upd-save');

  var suspects = [];
  var pendents = [];
  var inputs = document.querySelectorAll('.upd-input');
  for (var i=0;i<inputs.length;i++){
    var inp = inputs[i];
    var id = inp.getAttribute('data-pos-id');
    var oldv = parseFloat(inp.getAttribute('data-old'))||0;
    var v = parseNumCA(inp.value);
    if (isNaN(v) || v < 0) v = oldv;
    if (oldv > 0 && Math.abs(v-oldv)/oldv > 0.4){
      var pp = pos.find(function(x){ return x.id === id; });
      suspects.push((pp&&pp.nom?pp.nom:'Posició')+': '+eurRound(oldv)+' → '+eurRound(v));
    }
    pendents.push({ id:id, v:v });
  }
  if (suspects.length){
    if (!confirm('Alguns valors canvien molt:\n\n'+suspects.join('\n')+'\n\nVols desar-los igualment?')) return;
  }
  pendents.forEach(function(x){
    var p = pos.find(function(y){ return y.id === x.id; });
    if (p){ p.valor_actual = x.v; p.valor_data = data; }
  });

  // Snapshot mensual
  var valorTotal = pos.reduce(function(s,p){ return s + (parseFloat(p.valor_actual)||0); }, 0);
  var movs = getMoviments();
  var invertit = 0;
  movs.forEach(function(m){ var im=parseFloat(m.import)||0; if(m.tipus==='compra')invertit+=im; if(m.tipus==='venda')invertit-=im; });

  var snaps = getSnapshots().slice();
  var idx = snaps.findIndex(function(s){ return s.mes === mes; });
  var nou = { mes:mes, data:data, valor:valorTotal, invertit:invertit };
  if (idx >= 0) snaps[idx] = nou; else snaps.push(nou);
  snaps.sort(function(a,b){ return a.mes.localeCompare(b.mes); });

  if (btn){ btn.disabled = true; btn.textContent = 'Desant...'; }
  try {
    var res = await sb.from('clients')
      .update({ posicions: pos, snapshots_cartera: snaps })
      .eq('email', APP.email);
    if (res.error) throw res.error;
    APP.client.posicions = pos;
    APP.client.snapshots_cartera = snaps;
    tancarModal();
    toast('✓ Cartera actualitzada · '+eurRound(valorTotal));
    renderCartera();
  } catch(e){
    if (btn){ btn.disabled = false; btn.textContent = 'Desar'; }
    toast('Error: '+(e.message||e));
  }
}

function renderEvolucio(){
  var el = $('view');
  var snaps = getSnapshots().slice().sort(function(a,b){ return a.mes.localeCompare(b.mes); });

  if (snaps.length < 2){
    el.innerHTML = '<div class="empty">Encara no hi ha prou històric per dibuixar l\'evolució.<br><br>Actualitza la cartera i registra les aportacions cada mes; aquí veuràs com creix.</div>';
    return;
  }

  var valors = snaps.map(function(s){ return parseFloat(s.valor)||0; });
  var aports = snaps.map(function(s){ return parseFloat(s.invertit)||0; });

  // Escala comuna per a les dues sèries
  var allv = valors.concat(aports);
  var minV = Math.min.apply(null, allv);
  var maxV = Math.max.apply(null, allv);
  var range = (maxV - minV) || 1;
  var pad = range * 0.12;
  var lo = Math.max(0, minV - pad);
  var hi = maxV + pad;
  var rng = (hi - lo) || 1;

  var W = 320, H = 190, padL = 8, padR = 8, padT = 14, padB = 26;
  var plotW = W - padL - padR;
  var plotH = H - padT - padB;
  var n = snaps.length;

  function ptsFor(arr){
    return arr.map(function(v, i){
      var x = padL + (n === 1 ? plotW/2 : (i/(n-1))*plotW);
      var y = padT + plotH - ((v - lo)/rng)*plotH;
      return { x:x, y:y, v:v };
    });
  }
  var ptsVal = ptsFor(valors);
  var ptsApt = ptsFor(aports);

  function pathOf(pts){ return pts.map(function(p,i){ return (i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1); }).join(' '); }
  var lineVal = pathOf(ptsVal);
  var lineApt = pathOf(ptsApt);
  var areaVal = lineVal + ' L'+ptsVal[n-1].x.toFixed(1)+' '+(padT+plotH)+' L'+ptsVal[0].x.toFixed(1)+' '+(padT+plotH)+' Z';

  var lastVal = valors[n-1], firstVal = valors[0];
  var lastApt = aports[n-1];
  var delta = lastVal - firstVal;
  var deltaPct = firstVal > 0 ? (delta/firstVal*100) : 0;
  var guanyAbs = lastVal - lastApt; // valor menys aportat = revaloració acumulada
  var colD = delta >= 0 ? 'var(--green)' : 'var(--red)';

  var svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'
    + '<defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0%" stop-color="#1B3A6B" stop-opacity="0.16"/>'
      + '<stop offset="100%" stop-color="#1B3A6B" stop-opacity="0"/>'
    + '</linearGradient></defs>'
    + '<path d="'+areaVal+'" fill="url(#grad)"/>'
    // línia aportat (puntejada, daurada)
    + '<path d="'+lineApt+'" fill="none" stroke="#B8902E" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="round" stroke-linecap="round"/>'
    // línia valor (sòlida, navy)
    + '<path d="'+lineVal+'" fill="none" stroke="#1B3A6B" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  ptsVal.forEach(function(p){ svg += '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3" fill="#1B3A6B"/>'; });
  svg += '<text x="'+ptsVal[0].x.toFixed(1)+'" y="'+(H-8)+'" font-size="9" fill="#9A9690" text-anchor="start">'+mesAbrevCA(snaps[0].mes)+'</text>';
  svg += '<text x="'+ptsVal[n-1].x.toFixed(1)+'" y="'+(H-8)+'" font-size="9" fill="#9A9690" text-anchor="end">'+mesAbrevCA(snaps[n-1].mes)+'</text>';
  svg += '</svg>';

  var html = '<div class="card">'
    + '<div class="card-lbl">Evolució de la cartera</div>'
    + '<div class="kpi-big" style="font-size:26px">'+eurRound(lastVal)+'</div>'

// Extreu text net d'un HTML d'email (sense renderitzar HTML cru: més segur al mòbil)
function htmlAText(html){
  if (!html) return '';
  var s = String(html);
  // eliminar blocs no visibles
  s = s.replace(/<style[\s\S]*?<\/style>/gi, ' ');
  s = s.replace(/<script[\s\S]*?<\/script>/gi, ' ');
  s = s.replace(/<head[\s\S]*?<\/head>/gi, ' ');
  // salts de línia per a blocs i <br>
  s = s.replace(/<\s*br\s*\/?>/gi, '\n');
  s = s.replace(/<\/\s*(p|div|tr|h[1-6]|li)\s*>/gi, '\n');
  s = s.replace(/<\s*li[^>]*>/gi, '• ');
  // treure la resta d'etiquetes
  s = s.replace(/<[^>]+>/g, ' ');
  // decodificar entitats bàsiques
  s = s.replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&lt;/gi,'<')
       .replace(/&gt;/gi,'>').replace(/&quot;/gi,'"').replace(/&#39;/gi,"'").replace(/&euro;/gi,'€');
  // normalitzar espais i salts
  s = s.replace(/[ \t]+/g, ' ');
  s = s.replace(/\n[ \t]+/g, '\n').replace(/[ \t]+\n/g, '\n');
  s = s.replace(/\n{3,}/g, '\n\n');
  return s.trim();
}

  if (!input || !input.value.trim()) return;

  if (esPlaSenyal()){

      toast('Has arribat al límit de '+SENYAL_MSG_LIMIT+' missatges aquest mes (pla Senyal).');

    }
  }

  input.disabled = true; if (btn) btn.disabled = true;
  try {
    var res = await sb.from('messages').insert({
      client_email: APP.email,
      from_email: APP.email,
      from_role: 'client',

      read_by_admin: false,

// VISTA: APORTAR
// Mostra quant i on toca aportar aquest mes (segons cartera target i
// desviació real, com fa platform.html) i permet REGISTRAR l'aportació
// feta com a moviments de tipus 'compra' (queda historial i compta al P&L).
// ════════════════════════════════════════════

// Cartera target del client (array {id,nom,pct,color}); buida si no n'hi ha.
function getTarget(){
  var c = APP.client;
  return (c && Array.isArray(c.cartera_target_custom)) ? c.cartera_target_custom : [];
}

// Aportació mensual configurada (de perfil.aportacioMensual). 0 si no n'hi ha.
function getAportacioMensual(){
  var c = APP.client;
  if (c && c.perfil && c.perfil.aportacioMensual != null){
    var v = parseFloat(String(c.perfil.aportacioMensual).replace(/[^0-9.,]/g,'').replace(',','.'));
    return isNaN(v) ? 0 : v;
  }
  return 0;
}

// Distribució real per categoria: {cat: valor_sumat}
function distribucioRealPerCat(){
  var per = {};
  getPosicions().forEach(function(p){
    var cat = p.cat || 'altres';
    var v = parseFloat(p.valor_actual)||0;
    per[cat] = (per[cat]||0) + v;
  });
  return per;
}

// Algoritme idèntic a calcMatchingITactic de platform.html, però usant
// cartera_target_custom (que ja porta nom i color per categoria).
// Retorna { rows:[...], recomanacio:[{cat,nom,color,import,motiu}], valorActual, valorPost, aport }
function calcAportacio(aport){
  var target = getTarget();
  if (!target.length) return null;
  var real = distribucioRealPerCat();
  var valorActual = 0;
  Object.keys(real).forEach(function(k){ valorActual += real[k]; });
  aport = parseFloat(aport)||0;
  var valorPost = valorActual + aport;

  var rows = target.map(function(t){
    var catId = t.id || t.nom;
    var realEur = real[catId] || 0;
    var targetPct = parseFloat(t.pct)||0;
    var targetEur = targetPct/100 * valorPost;
    var gapEur = targetEur - realEur; // positiu = infraponderat
    return {
      cat: catId,
      nom: t.nom || catId,
      color: t.color || '#888',
      targetPct: targetPct,
      realEur: realEur,
      realPct: valorPost > 0 ? (realEur/valorPost*100) : 0,
      gapEur: gapEur
    };
  });

  var ordenat = rows.slice().sort(function(a,b){ return b.gapEur - a.gapEur; });
  var recomanacio = [];
  if (aport > 0){
    var top2 = ordenat.filter(function(r){ return r.gapEur > 0; }).slice(0,2);
    if (top2.length === 0){
      // cartera equilibrada -> DCA als 2 pesos target més grans
      var t2 = rows.slice().sort(function(a,b){ return b.targetPct - a.targetPct; }).slice(0,2);
      var sumP = t2.reduce(function(s,r){ return s+r.targetPct; }, 0);
      recomanacio = t2.map(function(r){
        var pct = sumP > 0 ? r.targetPct/sumP : 0.5;
        return { cat:r.cat, nom:r.nom, color:r.color, import:Math.round(aport*pct), motiu:'DCA equilibrat' };
      });
    } else {
      var sumG = top2.reduce(function(s,r){ return s+r.gapEur; }, 0);
      recomanacio = top2.map(function(r){
        var pct = sumG > 0 ? r.gapEur/sumG : 1/top2.length;
        return { cat:r.cat, nom:r.nom, color:r.color, import:Math.round(aport*pct), motiu:'Infraponderat' };
      });
    }
  }
  return { rows:rows, recomanacio:recomanacio, valorActual:valorActual, valorPost:valorPost, aport:aport };
}

// Quantes aportacions s'han registrat aquest mes (per avisar si ja s'ha fet)
function aportacionsAquestMes(){
  var mes = mesActual();
  return getMoviments().filter(function(m){
    return m.tipus === 'compra' && m.data && String(m.data).slice(0,7) === mes && m.nota && m.nota.indexOf('Aportació') === 0;
  });
}

function renderAportar(){
  var el = $('view');
  var target = getTarget();
  var pos = getPosicions();

  if (!pos.length || !target.length){
    el.innerHTML = '<div class="empty">Encara no tens cartera configurada.<br><br>Quan el teu assessor defineixi la teva cartera, aquí veuràs quant i on aportar cada mes.</div>';
    return;
  }

  var aport = getAportacioMensual();
  var html = '';

  // Cas: sense aportació configurada -> permetre definir-la
  if (aport <= 0){
    html += '<div class="card" style="text-align:center">'
      + '<div style="font-size:30px;margin-bottom:6px">📅</div>'
      + '<div class="section-h" style="margin:0 0 6px">Quant vols aportar cada mes?</div>'
      + '<div style="font-size:13px;color:var(--g500);line-height:1.6;margin-bottom:16px">Defineix la teva aportació mensual i et direm a quines categories posar-la per acostar-te a la teva cartera objectiu.</div>'
      + '<input class="upd-input" id="inp-aport-mens" inputmode="decimal" placeholder="Ex: 300" style="text-align:center;margin-bottom:12px">'
      + '<button class="btn-primary" onclick="desarAportacioMensual()">Desar aportació mensual</button>'
      + '</div>';
    el.innerHTML = html;
    return;
  }

  var calc = calcAportacio(aport);
  var jaFet = aportacionsAquestMes();

  // Capçalera: import mensual
  html += '<div class="card">'
    + '<div class="card-lbl">Aportació d\'aquest mes</div>'
    + '<div class="kpi-big">'+eurRound(aport)+'</div>'
    + '<div class="kpi-sub" style="color:var(--g500)">Mes de '+nomMesCA(mesActual())+'</div>'
    + '<button onclick="editarAportMensual()" style="margin-top:10px;background:none;color:var(--navy);font-size:12px;text-decoration:underline">Canviar import</button>'
    + '</div>';

  // Banner si ja s'ha registrat aquest mes
  if (jaFet.length){
    var totalFet = jaFet.reduce(function(s,m){ return s + (parseFloat(m.import)||0); }, 0);
    html += '<div class="banner-upd" style="background:#EEF3EE;border-color:#A8CDB5">'
      + '<div class="txt" style="color:#1A5C3A">✓ Aquest mes ja has registrat '+eurRound(totalFet)+' en aportacions.</div></div>';
  }

  // On toca aportar (recomanació per categoria)
  html += '<div class="section-h">On aportar aquest mes</div>';
  html += '<div class="card">';
  if (calc && calc.recomanacio.length){
    calc.recomanacio.forEach(function(r){
      html += '<div class="pos-row">'
        + '<span style="width:10px;height:10px;border-radius:3px;flex-shrink:0;background:'+r.color+'"></span>'
        + '<div style="flex:1;min-width:0">'
          + '<div class="pos-nom">'+esc(r.nom)+'</div>'
          + '<div class="pos-meta">'+esc(r.motiu)+'</div>'
        + '</div>'
        + '<div class="pos-val">'+eurRound(r.import)+'</div>'
      + '</div>';
    });
    html += '<div style="font-size:11px;color:var(--g400);margin-top:10px;line-height:1.5">'
      + 'Suggerit per acostar la teva cartera a l\'objectiu. Reforça les categories per sota del seu pes ideal.</div>';
  } else {
    html += '<div class="empty" style="padding:20px">La teva cartera ja està equilibrada. Pots aportar repartint segons la teva distribució objectiu.</div>';
  }
  html += '</div>';

  // Botó registrar
  html += '<button class="btn-primary" style="margin-bottom:14px" onclick="obrirRegistrarAportacio()">➕ Registrar aportació feta</button>';

  // Distribució objectiu vs real (context)
  html += '<div class="section-h">La teva cartera objectiu</div><div class="card">';
  calc.rows.forEach(function(r){
    var diff = r.targetPct - r.realPct;
    var diffTxt = (Math.abs(diff) < 0.5) ? 'al punt' : ((diff>0?'+':'')+diff.toFixed(1)+'% per '+(diff>0?'sota':'sobre'));
    var diffCol = (Math.abs(diff) < 0.5) ? 'var(--g400)' : (diff>0 ? 'var(--gold)' : 'var(--g500)');
    html += '<div class="pos-row">'

// ── Modal: registrar aportació feta (per categoria) ──
function obrirRegistrarAportacio(){
  var target = getTarget();
  var calc = calcAportacio(getAportacioMensual());
  // Pre-omplir amb la recomanació
  var pre = {};
  if (calc && calc.recomanacio){
    calc.recomanacio.forEach(function(r){ pre[r.cat] = r.import; });
  }

  var rows = target.map(function(t){
    var cat = t.id || t.nom;
    var val = pre[cat] || '';
    return '<div class="upd-row">'
      + '<div class="upd-top">'
        + '<span style="width:12px;height:12px;border-radius:3px;flex-shrink:0;background:'+(t.color||'#888')+'"></span>'
        + '<div style="flex:1;min-width:0"><div class="pos-nom">'+esc(t.nom||cat)+'</div></div>'
      + '</div>'
      + '<input class="upd-input" inputmode="decimal" data-cat="'+esc(cat)+'" data-nom="'+esc(t.nom||cat)+'" '
        + 'value="'+val+'" placeholder="0 €">'
    + '</div>';
  }).join('');

  var modal = document.createElement('div');
  modal.className = 'modal';
  modal.id = 'modal-aport';
  modal.innerHTML = '<div class="modal-inner">'
    + '<div class="modal-h">Registrar aportació</div>'
    + '<div class="modal-sub">Posa quant has aportat a cada categoria aquest mes. Ho hem pre-omplert amb la recomanació; ajusta el que calgui.</div>'
    + rows
    + '<div id="aport-total" style="text-align:right;font-family:var(--fm);font-size:14px;font-weight:500;color:var(--navy);margin-top:10px"></div>'
    + '<div style="display:flex;gap:10px;margin-top:14px">'
      + '<button onclick="tancarModalAport()" style="flex:1;padding:13px;background:var(--g50);color:var(--g700);border-radius:11px;font-weight:500">Cancel·lar</button>'
      + '<button class="btn-primary" style="flex:2" id="btn-aport-save" onclick="guardarRegistreAportacio()">Registrar</button>'
    + '</div>'
  + '</div>';
  document.body.appendChild(modal);
  modal.addEventListener('click', function(ev){ if (ev.target === modal) tancarModalAport(); });
  // total dinàmic
  var inps = modal.querySelectorAll('.upd-input');
  function recalc(){
    var t = 0;
    for (var i=0;i<inps.length;i++){ var v = parseNumCA(inps[i].value); if(!isNaN(v)) t += v; }
    $('aport-total').textContent = 'Total: ' + eurRound(t);
  }
  for (var i=0;i<inps.length;i++){ inps[i].addEventListener('input', recalc); }
  recalc();
}
function tancarModalAport(){
  var m = $('modal-aport'); if (m) m.parentNode.removeChild(m);
}

async function guardarRegistreAportacio(){
  var data = avui();
  var mes = mesActual();
  var btn = $('btn-aport-save');
  var pos = getPosicions();
  var movs = getMoviments().slice();

  var inputs = document.querySelectorAll('#modal-aport .upd-input');
  var nous = [];
  var totalAport = 0;
  for (var i=0;i<inputs.length;i++){
    var inp = inputs[i];
    var cat = inp.getAttribute('data-cat');
    var v = parseNumCA(inp.value);
    if (isNaN(v) || v <= 0) continue;
    // Buscar una posició d'aquesta categoria per vincular el moviment
    var posCat = pos.find(function(p){ return (p.cat||'') === cat; });
    if (!posCat){
      // No hi ha posició d'aquesta categoria encara: registrem igualment
      // vinculant a la primera posició (l'import compta al cost global).
      posCat = pos[0];
    }
    if (!posCat) continue;
    totalAport += v;
    nous.push({
      id: novaId('mov'),
      posicio_id: posCat.id,
      data: data,
      tipus: 'compra',
      import: v,
      unitats: null,
      preu_unitat: null,
      nota: 'Aportació ' + nomMesCA(mes) + ' · ' + (inp.getAttribute('data-nom')||cat)
    });
  }

  if (!nous.length){ toast('Posa almenys un import'); return; }

  // Afegir el valor aportat al valor_actual de la posició corresponent
  // (l'aportació augmenta tant el cost com el valor de mercat de partida).
  var posAct = pos.slice();
  nous.forEach(function(m){
    var p = posAct.find(function(x){ return x.id === m.posicio_id; });
    if (p){ p.valor_actual = (parseFloat(p.valor_actual)||0) + (parseFloat(m.import)||0); p.valor_data = data; }
  });

  var allMovs = movs.concat(nous);

  // Actualitzar snapshot del mes
  var valorTotal = posAct.reduce(function(s,p){ return s+(parseFloat(p.valor_actual)||0); }, 0);
  var invertit = 0;
  allMovs.forEach(function(m){ var im=parseFloat(m.import)||0; if(m.tipus==='compra')invertit+=im; if(m.tipus==='venda')invertit-=im; });
  var snaps = getSnapshots().slice();
  var idx = snaps.findIndex(function(s){ return s.mes === mes; });
  var nou = { mes:mes, data:data, valor:valorTotal, invertit:invertit };
  if (idx >= 0) snaps[idx] = nou; else snaps.push(nou);
  snaps.sort(function(a,b){ return a.mes.localeCompare(b.mes); });

  if (btn){ btn.disabled = true; btn.textContent = 'Registrant...'; }
  try {
    var res = await sb.from('clients')
      .update({ posicions: posAct, moviments_posicions: allMovs, snapshots_cartera: snaps })
      .eq('email', APP.email);
    if (res.error) throw res.error;
    APP.client.posicions = posAct;
    APP.client.moviments_posicions = allMovs;
    APP.client.snapshots_cartera = snaps;
    tancarModalAport();
    toast('✓ Aportació registrada · '+eurRound(totalAport));
    renderAportar();
  } catch(e){
    if (btn){ btn.disabled = false; btn.textContent = 'Registrar'; }
    toast('Error: '+(e.message||e));
  }
}

// NOTIFICACIONS PUSH (subscripció del client)
// ════════════════════════════════════════════
var VAPID_PUBLIC_KEY = 'BE_IX5vXaarMOkrMIvNvWeWllqDJokveWIRJsFoYysWeHnisc4xRSovp0-BFPo1m3j3Eo-0th_-w6ID57UhLRaU';

// Converteix la clau VAPID base64url a Uint8Array (format que demana l'API)
function urlBase64ToUint8Array(base64String){
  var padding = '='.repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  var raw = atob(base64);
  var arr = new Uint8Array(raw.length);
  for (var i=0;i<raw.length;i++){ arr[i] = raw.charCodeAt(i); }
  return arr;
}

function pushSuportat(){
  return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
}
function esIOSpush(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}

// Estat actual: 'no-suportat' | 'instal-cal' | 'desactivat' | 'activat' | 'denegat'
async function estatPush(){
  if (!pushSuportat()) return 'no-suportat';
  // iOS només permet push si l'app està instal·lada (standalone)
  if (esIOSpush() && !appEstaInstalada()) return 'instal-cal';
  if (Notification.permission === 'denied') return 'denegat';
  try {
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    return sub ? 'activat' : 'desactivat';
  } catch(e){ return 'desactivat'; }
}

// Activa les notificacions: demana permís, subscriu i desa a Supabase
async function activarPush(){
  if (!pushSuportat()){ toast('El teu navegador no suporta notificacions'); return false; }
  if (esIOSpush() && !appEstaInstalada()){
    mostrarInstruccionsIOS();
    return false;
  }
  try {
    var perm = await Notification.requestPermission();
    if (perm !== 'granted'){ toast('Permís de notificacions denegat'); return false; }

    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    if (!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    var raw = sub.toJSON();
    var keys = raw.keys || {};
    // Desar/actualitzar a Supabase (upsert per endpoint)
    var res = await sb.from('push_subscriptions').upsert({
      client_email: APP.email,
      endpoint: raw.endpoint,
      p256dh: keys.p256dh,
      auth: keys.auth,
      user_agent: navigator.userAgent,
      last_used_at: new Date().toISOString()
    }, { onConflict: 'endpoint' });
    if (res.error) throw res.error;
    toast('✓ Notificacions activades');
    return true;
  } catch(e){
    toast('No s\'han pogut activar: ' + (e.message||e));
    return false;
  }
}

// Desactiva: cancel·la la subscripció i l'esborra de Supabase
async function desactivarPush(){
  try {
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    if (sub){
      var endpoint = sub.endpoint;
      await sub.unsubscribe();
      try { await sb.from('push_subscriptions').delete().eq('endpoint', endpoint); } catch(e){}
    }
    toast('Notificacions desactivades');
    return true;
  } catch(e){ toast('Error: '+(e.message||e)); return false; }
}

// Toggle des de la UI d'ajuda/configuració
async function togglePush(){
  var estat = await estatPush();
  if (estat === 'activat'){ await desactivarPush(); }
  else { await activarPush(); }
  // refrescar la fila de configuració si està oberta
  try { actualitzarFilaPush(); } catch(e){}
}

// Actualitza el text del botó de push allà on es mostri
async function actualitzarFilaPush(){
  var cont = document.getElementById('push-config-row');

  if (estat === 'no-suportat'){

  } else if (estat === 'instal-cal'){
    html = '<div style="font-size:12px;color:var(--g500);line-height:1.5">Per rebre notificacions a l\'iPhone, primer instal\·la l\'app a la pantalla d\'inici.</div>';
  } else if (estat === 'denegat'){
    html = '<div style="font-size:12px;color:var(--red);line-height:1.5">Has bloquejat les notificacions. Activa-les des dels ajustos del navegador per a aquesta web.</div>';
  } else {
    var actiu = (estat === 'activat');
    html = '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">'
      + '<div style="font-size:13px;color:var(--g700)">' + (actiu ? '🔔 Notificacions activades' : '🔕 Notificacions desactivades') + '</div>'
      + '<button onclick="togglePush()" style="background:'+(actiu?'var(--g50)':'var(--navy)')+';color:'+(actiu?'var(--g700)':'#fff')+';border:'+(actiu?'1px solid var(--g200)':'none')+';border-radius:9px;font-size:12px;font-weight:600;padding:9px 14px;cursor:pointer;font-family:inherit">'+(actiu?'Desactivar':'Activar')+'</button>'
    + '</div>';
  }
  cont.innerHTML = html;
}

// INSTAL·LACIÓ DE L'APP (PWA)
// Botó/banner per instal·lar a la pantalla d'inici.
//  - Android/Chrome: captura beforeinstallprompt i dispara el diàleg natiu.
//  - iPhone/Safari: mostra instruccions (no hi ha API d'instal·lació a iOS).
//  - Si ja s'executa instal·lada (standalone): no mostra res.
// ════════════════════════════════════════════
var _deferredPrompt = null;

function appEstaInstalada(){
  // standalone display-mode (Android/desktop) o navigator.standalone (iOS)
  var mq = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  return !!(mq || window.navigator.standalone === true);
}
function esIOS(){
  return /iphone|ipad|ipod/i.test(window.navigator.userAgent) && !window.MSStream;
}

// Capturar l'esdeveniment d'instal·lació (Android)
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  _deferredPrompt = e;
  mostrarBotonsInstall();
});

// Quan s'instal·la, amaguem tot
window.addEventListener('appinstalled', function(){
  _deferredPrompt = null;
  var b = document.getElementById('install-login');
  if (b) b.style.display = 'none';
});

// Mostra els botons d'instal·lació si escau
function mostrarBotonsInstall(){
  if (appEstaInstalada()) return;
  var b = document.getElementById('install-login');
  // Mostrem el botó si tenim prompt (Android) o si és iOS (instruccions)
  if (b && (_deferredPrompt || esIOS())) b.style.display = 'block';
}

// Acció del botó "Instal·lar app"
async function instalarApp(){
  if (appEstaInstalada()) { toast('L\'app ja està instal·lada'); return; }
  if (_deferredPrompt){
    _deferredPrompt.prompt();
    try {
      var choice = await _deferredPrompt.userChoice;
      _deferredPrompt = null;
      if (choice && choice.outcome === 'accepted'){ toast('✓ Instal·lant l\'app...'); }
    } catch(e){}
    return;
  }
  if (esIOS()){ mostrarInstruccionsIOS(); return; }
  // Fallback (alguns Android que no han disparat l'esdeveniment encara)
  mostrarInstruccionsGeneriques();
}

function mostrarInstruccionsIOS(){
  var modal = document.createElement('div');
  modal.className = 'modal';
  modal.id = 'modal-ios';
  modal.innerHTML = '<div class="modal-inner">'
    + '<div class="modal-h">Instal·lar a l\'iPhone</div>'

    + '<div style="display:flex;flex-direction:column;gap:16px;margin-bottom:8px">'

    + '<button class="btn-primary" style="margin-top:14px" onclick="tancarModalIOS()">Entesos</button>'

  document.body.appendChild(modal);
  modal.addEventListener('click', function(ev){ if (ev.target === modal) tancarModalIOS(); });
}
function tancarModalIOS(){ var m = document.getElementById('modal-ios'); if (m) m.parentNode.removeChild(m); }

function mostrarInstruccionsGeneriques(){
  var modal = document.createElement('div');
  modal.className = 'modal';
  modal.id = 'modal-ios';

    var session = res && res.data && res.data.session;
    if (session && session.user && session.user.email){
      await carregarClient(session.user.email.toLowerCase());
    } else {
      showSplash(false); showLogin(true);
    }
  } catch(e){

})();
