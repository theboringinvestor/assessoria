<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16233A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TBI">
<title>The Boring Investor</title>

<!-- PWA manifest embegut com a data URI (fitxer únic, sense fitxers externs) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{
  --navy:#16233A; --navy2:#24395C; --cream:#F7F5F0; --gold:#C8A54A;
  --ink:#16233A; --ink-2:#24395C;
  --sh-1:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.05);
  --sh-2:0 4px 8px rgba(16,24,40,.05),0 12px 28px rgba(16,24,40,.09);
  --sh-3:0 8px 16px rgba(16,24,40,.07),0 24px 56px rgba(16,24,40,.14);
  --black:#16233A; --g700:#3A3A3A; --g500:#6B6762; --g400:#9A9690;
  --g200:#D9D6D0; --g100:#ECEAE6; --g50:#F4F3F0;
  --green:#1A5C3A; --red:#C0392B;
  --gold-dark:#8A6F28;
  --green-bg:#EAF3DE; --red-bg:#FBEDED; --gold-bg:#FDF8EC;
  --fd:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --fb:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --fm:'IBM Plex Mono','SF Mono',Menlo,monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--fb);background:var(--cream);color:var(--black);
  font-size:15px;line-height:1.5;overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none !important}
button{font-family:var(--fb);cursor:pointer;border:none}
input,textarea{font-family:var(--fb);font-size:16px}/* 16px evita zoom a iOS */

/* ── LOADING ── */
#splash{
  position:fixed;inset:0;background:linear-gradient(160deg,var(--ink-2) 0%,var(--ink) 55%,#080F1A 100%);display:flex;
  flex-direction:column;align-items:center;justify-content:center;z-index:1000;
}
#splash .logo{font-family:var(--fd);color:#fff;font-size:30px;letter-spacing:1px}
#splash .tag{color:rgba(255,255,255,.6);font-size:12px;margin-top:8px;letter-spacing:.05em}
.spinner{width:28px;height:28px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-top:24px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── LOGIN ── */
#login{position:fixed;inset:0;background:var(--cream);display:flex;flex-direction:column;justify-content:center;padding:32px 26px;padding-top:calc(32px + var(--safe-top));z-index:900}
#login .brand{font-family:var(--fd);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:6px}
#login h1{font-family:var(--fd);font-size:30px;font-weight:500;text-align:center;color:var(--navy);margin-bottom:6px;letter-spacing:-.5px}
#login .sub{text-align:center;color:var(--g500);font-size:13px;margin-bottom:32px;line-height:1.6}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--g500);margin-bottom:6px;font-weight:500}
.field input{width:100%;padding:13px 14px;border:1.5px solid var(--g200);border-radius:11px;background:#fff;transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--navy)}
.btn-primary{width:100%;padding:14px;background:var(--navy);color:#fff;border-radius:11px;font-size:15px;font-weight:600;transition:opacity .15s}
.btn-primary:active{opacity:.85}
.btn-primary:disabled{opacity:.5}
#login-msg{min-height:20px;font-size:12px;text-align:center;margin:12px 0}

/* ── APP SHELL ── */
#app{display:none;flex-direction:column;height:100%}
#app.show{display:flex}
.topbar{
  background:linear-gradient(180deg,var(--ink-2) 0%,var(--ink) 100%);color:#fff;padding:calc(14px + var(--safe-top)) 20px 14px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.topbar .ttl{font-family:var(--fd);font-size:18px;font-weight:500}
.topbar .out{background:rgba(255,255,255,.12);color:#fff;font-size:11px;padding:7px 12px;border-radius:8px;font-weight:500}
.topbar .out:active{background:rgba(255,255,255,.22)}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px;padding-bottom:90px}

/* ── BOTTOM NAV ── */
.nav{
  position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--g100);
  display:flex;padding-bottom:var(--safe-bottom);z-index:100;
  box-shadow:0 -8px 24px rgba(16,24,40,.06);
}
.nav button{flex:1;padding:10px 2px 8px;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--g400);font-size:10px;font-weight:500;white-space:nowrap}
.nav button.active{color:var(--navy)}
.nav button .ic{font-size:20px;line-height:1}

/* ── CARDS ── */
.card{background:#fff;border:1px solid var(--g100);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--sh-1)}
.card-lbl{font-size:11px;color:var(--g400);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:4px}
.kpi-big{font-family:var(--fm);font-size:32px;font-weight:500;color:var(--navy);letter-spacing:-1px}
.kpi-sub{font-size:13px;margin-top:4px;font-family:var(--fm)}
.pos-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--g50)}
.pos-row:last-child{border-bottom:none}
.pos-emoji{font-size:20px;flex-shrink:0}
.pos-nom{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos-meta{font-size:10px;color:var(--g400);margin-top:1px}
.pos-val{font-family:var(--fm);font-size:14px;font-weight:500;text-align:right;flex-shrink:0}
.pos-pnl{font-size:10px;font-family:var(--fm);text-align:right}

.section-h{font-family:var(--fd);font-size:20px;font-weight:500;color:var(--navy);margin:4px 4px 12px}

/* ── MODAL ── */
.modal{position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:500;display:flex;align-items:flex-end;justify-content:center}
.modal-inner{background:#fff;border-radius:18px 18px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:22px 18px;padding-bottom:calc(22px + var(--safe-bottom));box-shadow:var(--sh-3)}
.modal-inner::before{content:'';display:block;width:36px;height:4px;border-radius:99px;background:var(--g200);margin:0 auto 14px}
.modal-h{font-family:var(--fd);font-size:20px;font-weight:500;color:var(--navy);margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--g500);margin-bottom:18px;line-height:1.5}
.upd-row{padding:14px 0;border-bottom:1px solid var(--g50)}
.upd-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.upd-input{width:100%;padding:12px 14px;border:1.5px solid var(--g200);border-radius:10px;font-family:var(--fm);text-align:right;font-size:16px}
.upd-input:focus{outline:none;border-color:var(--navy)}

/* ── CHAT ── */
/* Sub-tabs dins Missatges */
.subtabs{display:flex;gap:4px;background:var(--g50);border-radius:11px;padding:4px;margin-bottom:14px;flex-shrink:0}
.subtabs button{flex:1;padding:9px 6px;background:none;border:none;border-radius:8px;font-size:13px;font-weight:600;color:var(--g500);cursor:pointer;font-family:inherit;position:relative}
.subtabs button.active{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(10,10,10,.08)}
.subtabs .dot{position:absolute;top:6px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
/* Targetes de comunicat */
.com-card{background:#fff;border:1px solid var(--g100);border-radius:13px;padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:border-color .15s,box-shadow .15s;box-shadow:var(--sh-1)}
.com-card:active{border-color:var(--navy)}
.com-eyebrow{font-size:10px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.com-titol{font-family:var(--fd);font-size:17px;font-weight:500;color:var(--navy);line-height:1.25;margin-bottom:3px}
.com-subtitol{font-size:13px;color:var(--g500);line-height:1.4;margin-bottom:8px}
.com-meta{font-size:11px;color:var(--g400);display:flex;align-items:center;gap:8px}
.com-new-badge{background:var(--gold);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em}
.com-body{font-size:14px;line-height:1.65;color:var(--g700);white-space:pre-line}
.chat-wrap{display:flex;flex-direction:column;height:100%}
.chat-thread{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px 12px}
.bubble{max-width:82%;padding:11px 15px;font-size:14px;line-height:1.55;white-space:pre-line;border-radius:14px}
.bubble.mine{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.bubble.theirs{align-self:flex-start;background:#fff;border:1px solid var(--g100);color:var(--black);border-bottom-left-radius:4px}
.bubble-meta{font-size:9px;color:var(--g400);margin-top:3px;padding:0 4px}
.chat-input-bar{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--g100)}
.chat-input-bar textarea{flex:1;padding:11px 13px;border:1.5px solid var(--g200);border-radius:12px;resize:none;max-height:90px;line-height:1.4}
.chat-input-bar textarea:focus{outline:none;border-color:var(--navy)}
.chat-send{background:var(--navy);color:#fff;border-radius:12px;padding:0 18px;font-weight:600;font-size:14px}
.chat-send:disabled{opacity:.5}

.empty{text-align:center;color:var(--g400);font-size:13px;padding:48px 20px;line-height:1.6}
/* ── EVOLUCIÓ ── */
.evo-wrap{margin:18px -2px 0;min-height:196px}
.evo-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.evo-band{animation:evoFade .55s ease-out both}
.evo-line-a{animation:evoFade .55s .1s ease-out both}
.evo-line-v{animation:evoDraw 1s cubic-bezier(.33,0,.15,1) both}
.evo-dot{transform-box:fill-box;transform-origin:center;animation:evoPop .34s .78s cubic-bezier(.34,1.4,.5,1) both}
.evo-halo{transform-box:fill-box;transform-origin:center;animation:evoHalo 2.6s 1.1s ease-out infinite}
@keyframes evoFade{from{opacity:0}to{opacity:1}}
@keyframes evoDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes evoPop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes evoHalo{0%{opacity:.5;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.6)}}
.evo-leg{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin-top:14px}
.evo-leg span{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--g500);font-weight:500}
.evo-sw{width:11px;height:11px;border-radius:3px;flex:none}
.evo-sw-l{width:15px;height:3px;border-radius:2px;flex:none}
.evo-stats{display:flex;gap:9px}
.evo-stat{flex:1;background:var(--g50);border:1px solid var(--g100);border-radius:11px;padding:11px 12px;min-width:0}
.evo-stat .l{font-size:9.5px;color:var(--g400);text-transform:uppercase;letter-spacing:.05em;font-weight:600;white-space:nowrap}
.evo-stat .v{font-family:var(--fm);font-size:15px;font-weight:500;margin-top:5px;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evo-mix{display:flex;height:9px;border-radius:5px;overflow:hidden;margin-top:16px;background:var(--g100)}
.evo-mix i{display:block;height:100%;transition:width .5s ease}
.evo-mix-lbl{font-size:11.5px;color:var(--g500);margin-top:9px;line-height:1.55}
.evo-sub-lbl{font-size:9.5px;color:var(--g400);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-top:20px;padding-top:15px;border-top:1px solid var(--g50)}
.evo-nota{font-size:11.5px;color:var(--g400);line-height:1.6;margin-top:14px;padding-top:13px;border-top:1px solid var(--g50)}
.evo-hd{display:flex;font-size:9.5px;color:var(--g400);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--g100)}
.evo-hd div+div,.evo-tr div+div{text-align:right}
.evo-tr{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--g50);font-size:13px}
.evo-tr:last-child{border-bottom:none}
.evo-tr .m{flex:1;font-weight:500;color:var(--ink)}
.evo-num{font-family:var(--fm);font-size:12.5px;letter-spacing:-.2px}
@media (prefers-reduced-motion:reduce){.evo-band,.evo-line-a,.evo-line-v,.evo-dot,.evo-halo{animation:none}}

.toast{position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;transform:translateX(-50%);background:var(--black);color:#fff;font-size:13px;padding:11px 18px;border-radius:10px;z-index:800;opacity:0;transition:opacity .2s;max-width:88%;text-align:center}
.toast.show{opacity:1}
.banner-upd{background:#FEF7E8;border:1px solid #E8C988;border-radius:12px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.banner-upd .txt{flex:1;font-size:12px;color:#7A4A00;line-height:1.5}
.banner-upd button{background:var(--gold);color:#fff;font-size:12px;font-weight:600;padding:9px 14px;border-radius:9px;flex-shrink:0}

/* ══ POLISH GLOBAL · mateix llenguatge que la plataforma ══ */
::selection{background:var(--navy);color:#fff}
button{transition:transform .1s ease,opacity .15s ease,background-color .15s ease,color .15s ease}
button:not(:disabled):active{transform:translateY(1px)}
:focus-visible{outline:2px solid var(--navy2);outline-offset:2px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy)!important;box-shadow:0 0 0 3px rgba(27,58,107,.10)}
.nav button.active .ic{transform:translateY(-1px)}
.nav button .ic{transition:transform .15s ease}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ── Hero de cartera ── */
.hero{position:relative;overflow:hidden}
.hero .spark{position:absolute;left:0;right:0;bottom:0;width:100%;height:48px;pointer-events:none}
.hero-pnl{font-family:var(--fm);font-size:15px;font-weight:600;margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero-pill{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.hero-grid{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--g100);position:relative}
.hero-nota{font-size:11px;color:var(--g400);margin-top:10px;line-height:1.5;position:relative}
.mini-lbl{font-size:10px;color:var(--g400);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.mini-val{font-family:var(--fm);font-size:15px;color:var(--g700);margin-top:2px}
.mini-sub{font-size:10px;color:var(--g400);margin-top:1px}

/* ── Semàfor de coherència ── */
.salut{display:flex;align-items:center;gap:16px;padding:15px 17px;border-radius:14px;margin-bottom:14px}
.salut-num{font-family:var(--fm);font-size:26px;font-weight:700;line-height:1;flex-shrink:0}
.salut-num span{font-size:13px;opacity:.55;font-weight:500}
.salut-txt{font-size:12px;color:var(--g700);line-height:1.55}

/* ── Cost real ── */
.ter-row{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px}
.ter-big{font-family:var(--fm);font-size:19px;font-weight:600;margin-top:3px}

/* ── Llegenda del donut ── */
.leg-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.leg-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.leg-nom{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg-pct{font-family:var(--fm);font-size:13px;color:var(--g700)}

/* ── Estats buits amb acció ── */
.empty-rich{text-align:center;padding:44px 26px}
.empty-ico{font-size:42px;margin-bottom:12px}
.empty-tit{font-size:19px;font-weight:600;color:var(--ink);margin-bottom:8px}
.empty-sub{font-size:13.5px;color:var(--g500);line-height:1.65;margin-bottom:22px;max-width:340px;margin-left:auto;margin-right:auto}

/* ── Esquelets de càrrega ── */
.skel{background:linear-gradient(90deg,var(--g100) 25%,var(--g50) 37%,var(--g100) 63%);
  background-size:400% 100%;animation:skel 1.3s ease infinite;border-radius:8px}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}
.skel-card{height:118px;margin-bottom:14px}
.skel-row{height:52px;margin-bottom:9px}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* ── Badge de deriva a la llista de l'objectiu ── */
.badge{display:inline-block;padding:1px 7px;border-radius:99px;font-size:9.5px;font-weight:700;letter-spacing:.02em}
.badge-ok{background:var(--green-bg);color:var(--green)}
.badge-infra{background:var(--gold-bg);color:var(--gold-dark)}
.badge-sobre{background:var(--red-bg);color:var(--red)}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="logo">The Boring Investor</div>
  <div class="tag">Avorreix-te invertint i dorm tranquil</div>
  <div class="spinner"></div>
</div>

<!-- LOGIN -->
<div id="login" class="hidden">
  <div class="brand">The Boring Investor</div>
  <h1>El teu espai</h1>
  <div class="sub">Entra un cop i l'app et recordarà.<br>Després s'obrirà sense demanar res.</div>
  <div class="field">
    <label>Correu electrònic</label>
    <input type="email" id="in-email" inputmode="email" autocomplete="email" autocapitalize="off" placeholder="el-teu-correu@exemple.com">
  </div>
  <div class="field">
    <label>Contrasenya</label>
    <input type="password" id="in-pwd" autocomplete="current-password" placeholder="La teva contrasenya">
  </div>
  <div id="login-msg"></div>
  <button class="btn-primary" id="btn-login" onclick="doLogin()">Entrar →</button>
  <div style="text-align:center;margin-top:16px;display:flex;gap:18px;justify-content:center">
    <button onclick="doReset()" style="background:none;color:var(--g500);font-size:12px;text-decoration:underline">He oblidat la contrasenya</button>
    <button onclick="obrirAjuda()" style="background:none;color:var(--g500);font-size:12px;text-decoration:underline">Com funciona?</button>
  </div>
  <div id="install-login" style="display:none;margin-top:28px;padding-top:20px;border-top:1px solid var(--g200)">
    <button onclick="instalarApp()" style="width:100%;padding:13px;background:#fff;color:var(--navy);border:1.5px solid var(--navy);border-radius:11px;font-size:14px;font-weight:600">📲 Instal·lar l'app al mòbil</button>
    <div style="text-align:center;font-size:11px;color:var(--g400);margin-top:8px">Entra més ràpid: instal·la-la a la pantalla d'inici.</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="ttl" id="topbar-ttl">La meva cartera</div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="out" onclick="obrirAjuda()" aria-label="Ajuda" style="padding:7px 11px">?</button>
      <button class="out" onclick="doLogout()">Sortir</button>
    </div>
  </div>
  <div class="scroll" id="view"></div>
  <div class="nav">
    <button id="nav-cartera" class="active" onclick="go('cartera')"><span class="ic">📊</span>Cartera</button>
    <button id="nav-evolucio" onclick="go('evolucio')"><span class="ic">📈</span>Evolució</button>
    <button id="nav-aportar" onclick="go('aportar')"><span class="ic">➕</span>Aportar</button>
    <button id="nav-missatges" onclick="go('missatges')"><span class="ic">💬</span>Missatges</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="tbi-cartera.js"></script>
<script src="tbi-fiscal.js"></script>
<script src="tbi-fire.js"></script>

}
// Data ISO (YYYY-MM-DD) -> format humà curt: "15 jun" o "fa X dies"
function dataHumana(iso){
  if (!iso) return 'sense data';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  var dies = Math.floor((new Date() - d) / 86400000);
  if (dies <= 0) return 'avui';
  if (dies === 1) return 'ahir';
  if (dies < 30) return 'fa ' + dies + ' dies';
  var mesos = ['gen','feb','mar','abr','mai','jun','jul','ago','set','oct','nov','des'];
  return d.getDate() + ' ' + mesos[d.getMonth()] + ' ' + d.getFullYear();
}

// Dies des de l'última actualització de valors. null=sense cartera, Infinity=mai.
function diesDesActualitzacio(){
  var pos = getPosicions();
  if (!pos.length) return null;
  var dates = pos.map(function(p){ return p.valor_data; }).filter(Boolean);
  if (!dates.length) return Infinity;
  dates.sort();
  var u = new Date(dates[dates.length-1]);
  if (isNaN(u.getTime())) return Infinity;
  return Math.floor((new Date() - u) / 86400000);
}
function carteraActualitzadaAquestMes(){
  var pos = getPosicions();
  var mes = mesActual();
  for (var i=0;i<pos.length;i++){
    if (pos[i].valor_data && String(pos[i].valor_data).slice(0,7) === mes) return true;
  }
  return false;
}

// Genera un donut SVG a partir de segments [{nom,color,valor}]. Retorna {svg, total}
function donutSVG(segments){
  var total = segments.reduce(function(s,x){ return s + (x.valor||0); }, 0);
  if (total <= 0) return { svg:'', total:0 };
  var size = 180, cx = size/2, cy = size/2, r = 62, sw = 26;
  var circ = 2 * Math.PI * r;
  var offset = 0;
  var arcs = '';
  segments.forEach(function(seg){
    var frac = seg.valor / total;
    if (frac <= 0) return;
    var len = frac * circ;
    // dasharray: tram pintat + buit; rotem amb dashoffset acumulat
    arcs += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" '
      + 'stroke="'+seg.color+'" stroke-width="'+sw+'" '
      + 'stroke-dasharray="'+len.toFixed(2)+' '+(circ-len).toFixed(2)+'" '
      + 'stroke-dashoffset="'+(-offset).toFixed(2)+'" '
      + 'transform="rotate(-90 '+cx+' '+cy+')"/>';
    offset += len;
  });
  var svg = '<svg viewBox="0 0 '+size+' '+size+'" style="width:170px;height:170px;display:block;margin:0 auto">'
    + arcs
    + '<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="11" fill="#9A9690" font-family="DM Sans,sans-serif">Total</text>'
    + '<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="17" fill="#1B3A6B" font-weight="600" font-family="DM Mono,monospace">'+eurRound(total)+'</text>'
    + '</svg>';
  return { svg:svg, total:total };
}

// Agrupa el valor de les posicions per categoria -> [{cat,nom,color,valor}] ordenat desc
function segmentsPerCategoria(){
  var per = {};
  getPosicions().forEach(function(p){
    var cat = p.cat || 'altres';
    per[cat] = (per[cat]||0) + (parseFloat(p.valor_actual)||0);
  });
  var segs = Object.keys(per).map(function(cat){
    var info = catInfo(cat);
    return { cat:cat, nom:info.nom, color:info.color, valor:per[cat] };
  });
  segs.sort(function(a,b){ return b.valor - a.valor; });
  return segs;
}

// ── Sparkline del valor de la cartera ───────────────────────────────────
// Fa servir els snapshots mensuals reals. Sense prou història no dibuixa
// res: una línia inventada de dos punts no informa de res.
function sparklineSVG(){
  var snaps = getSnapshots().slice().sort(function(a,b){ return String(a.mes).localeCompare(String(b.mes)); });
  var k = kpisCartera();
  var mesAra = mesActual();
  var serie = snaps.map(function(s){ return { mes:String(s.mes), valor:parseFloat(s.valor)||0 }; });
  var idx = -1;
  for (var i=0;i<serie.length;i++) if (serie[i].mes === mesAra) idx = i;
  if (k.valor_total > 0){
    if (idx >= 0) serie[idx] = { mes:mesAra, valor:k.valor_total };
    else serie.push({ mes:mesAra, valor:k.valor_total });
  }
  if (serie.length < 3) return '';

  var vals = serie.map(function(s){ return s.valor; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (max <= min) return '';
  var W = 300, H = 48;
  var pts = vals.map(function(v,i){
    var x = (i/(vals.length-1))*W;
    var y = H - ((v-min)/(max-min))*(H-6) - 3;
    return x.toFixed(1)+','+y.toFixed(1);
  });
  var puja = vals[vals.length-1] >= vals[0];
  var col = puja ? 'var(--green)' : 'var(--red)';
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'
    + '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2" '
      + 'stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>'
    + '<circle cx="'+W+'" cy="'+pts[pts.length-1].split(',')[1]+'" r="3" fill="'+col+'"/>'
    + '</svg>';
}

// ── Semàfor de bandes ───────────────────────────────────────────────────
function bandesHTML(){
  var calc = calcAportacio(0);
  if (!calc || !calc.resum || calc.resum.coherencia === null) return '';
  var r = calc.resum;
  var col = r.coherencia >= 90 ? 'var(--green)' : (r.coherencia >= 75 ? 'var(--gold-dark)' : 'var(--red)');
  var bg  = r.coherencia >= 90 ? 'var(--green-bg)' : (r.coherencia >= 75 ? 'var(--gold-bg)' : 'var(--red-bg)');
  var fora = calc.rows.filter(function(x){ return x.foraBanda; });
  var txt = r.cal_rebalanceig
    ? (fora.length === 1
        ? esc(fora[0].nom) + ' està fora de banda. La propera aportació hi anirà.'
        : fora.length + ' categories fora de banda. Les properes aportacions les corregiran.')
    : 'Tot dins de banda. No cal tocar res: aporta i prou.';
  return '<div class="salut" style="background:'+bg+'">'
    + '<div class="salut-num" style="color:'+col+'">'+r.coherencia+'<span>/100</span></div>'
    + '<div class="salut-txt"><strong>Coherència amb el teu pla</strong><br>'+txt+'</div>'
  + '</div>';
}

function renderCartera(){
  var pos = getPosicions();
  var el = $('view');

  if (!pos.length){
    el.innerHTML = '<div class="empty-rich">'
      + '<div class="empty-ico">📊</div>'
      + '<div class="empty-tit">Encara no tens posicions</div>'
      + '<div class="empty-sub">Quan el teu assessor configuri la teva cartera, aquí veuràs el valor, el rendiment real i si estàs alineat amb el teu pla.</div>'
      + '<button class="btn-primary" onclick="go(\'missatges\')">Escriure a l\'assessor</button>'
      + '</div>';
    return;
  }

  var k = kpisCartera();
  var html = '';

  // ── HERO ──
  var colG = k.pnl_eur >= 0 ? 'var(--green)' : 'var(--red)';
  var fletxa = k.pnl_eur >= 0 ? '▲' : '▼';
  html += '<div class="card hero">'
    + sparklineSVG()
    + '<div class="card-lbl">Valor total de la cartera</div>'
    + '<div class="kpi-big">'+eurRound(k.valor_total)+'</div>'
    + '<div class="hero-pnl" style="color:'+colG+'">'+fletxa+' '+(k.pnl_eur>=0?'+':'')+eurRound(k.pnl_eur)
      + ' <span class="hero-pill" style="background:'+(k.pnl_eur>=0?'var(--green-bg)':'var(--red-bg)')+'">'+pct(k.pnl_pct)+'</span></div>'
    + '<div class="hero-grid">';

  // Rendiment anualitzat: TIR si l'històric dona, acumulat si no
  var rendLbl, rendVal, rendCol;
  if (k.xirr !== null && k.xirr_fiable){
    rendLbl = 'Rendiment anual'; rendVal = pct(k.xirr);
    rendCol = k.xirr >= 0 ? 'var(--green)' : 'var(--red)';
  } else {
    rendLbl = 'Rendiment acumulat'; rendVal = pct(k.pnl_pct);
    rendCol = k.pnl_pct >= 0 ? 'var(--green)' : 'var(--red)';
  }
  html += '<div><div class="mini-lbl">Has aportat</div><div class="mini-val">'+eurRound(k.cost_total)+'</div></div>'
    + '<div><div class="mini-lbl">'+rendLbl+'</div><div class="mini-val" style="color:'+rendCol+'">'+rendVal+'</div></div>';
  var tw = twrCartera();
  if (tw && tw.fiable){
    html += '<div><div class="mini-lbl">TWR anual</div><div class="mini-val">'+pct(tw.anual)+'</div></div>';
  }
  html += '</div>';
  if (k.xirr !== null && k.xirr_fiable){
    html += '<div class="hero-nota">El rendiment anual és la TIR: té en compte quan vas posar cada euro, no només quant.</div>';
  } else {
    html += '<div class="hero-nota">Amb menys de 6 mesos d\'històric, anualitzar el rendiment enganya. T\'ensenyem l\'acumulat.</div>';
  }
  html += '</div>';

  // ── Acció principal ──
  var dies = diesDesActualitzacio();
  var necessitaUpd = !carteraActualitzadaAquestMes() && dies !== null;
  var btnTxt = necessitaUpd
    ? (dies === Infinity ? '💱 Posa els valors al dia' : '💱 Actualitzar (fa '+dies+' dies)')
    : '💱 Actualitzar valors';
  html += '<button class="btn-primary" style="margin-bottom:14px" onclick="obrirActualitzar()">'+btnTxt+'</button>';

  // ── Semàfor de bandes ──
  html += bandesHTML();

  // ── Cost real ──
  var t = terCartera();
  if (t){
    html += '<div class="card">'
      + '<div class="card-lbl">Cost real de la teva cartera</div>'
      + '<div class="ter-row">'
        + '<div><div class="mini-lbl">TER ponderat</div><div class="ter-big">'+t.ter_real.toFixed(2).replace('.',',')+'%</div>'
          + '<div class="mini-sub">'+eurRound(t.cost_anual_eur)+'/any</div></div>'
        + '<div><div class="mini-lbl">Banca tradicional</div><div class="ter-big" style="color:var(--g400)">'+t.ter_banc.toFixed(2).replace('.',',')+'%</div>'
          + '<div class="mini-sub">'+eurRound(t.cost_banc_eur)+'/any</div></div>'
        + '<div><div class="mini-lbl">T\'estalvies</div><div class="ter-big" style="color:var(--green)">'+eurRound(t.estalvi_anual_eur)+'</div>'
          + '<div class="mini-sub">cada any</div></div>'
      + '</div></div>';
  }

  // ── Donut ──
  var segs = segmentsPerCategoria();
  var donut = donutSVG(segs);
  if (donut.svg){
    html += '<div class="card">'
      + '<div class="card-lbl" style="margin-bottom:10px">Distribució per família d\'actius</div>'
      + donut.svg + '<div style="margin-top:14px">';
    segs.forEach(function(seg){
      var p = donut.total > 0 ? (seg.valor/donut.total*100) : 0;
      html += '<div class="leg-row">'
        + '<span class="leg-dot" style="background:'+seg.color+'"></span>'
        + '<div class="leg-nom">'+esc(seg.nom)+'</div>'
        + '<div class="leg-pct">'+p.toFixed(0)+'%</div>'
      + '</div>';
    });
    html += '</div></div>';
  }

  // ── Posicions ──
  html += '<div class="card"><div class="card-lbl" style="margin-bottom:8px">Posicions</div>';
  TBI_CARTERA.agregats(pos, getMoviments()).forEach(function(p){
    var valor = parseFloat(p.valor_actual)||0;
    var colP = p.pnl_eur >= 0 ? 'var(--green)' : 'var(--red)';
    var catNom = catInfo(p.cat).nom;
    var sub = [];
    if (p.nom && p.nom !== catNom) sub.push(esc(p.nom));
    if (p.broker) sub.push(esc(p.broker));
    sub.push(p.valor_data ? ('Actualitzat ' + dataHumana(p.valor_data)) : 'Sense valor');
    html += '<div class="pos-row">'
      + '<span class="pos-emoji">'+emojiFor(p)+'</span>'
      + '<div style="flex:1;min-width:0">'
        + '<div class="pos-nom">'+esc(catNom)+'</div>'
        + '<div class="pos-meta">'+sub.join(' · ')+'</div>'
      + '</div>'
      + '<div><div class="pos-val">'+eurRound(valor)+'</div>'
        + '<div class="pos-pnl" style="color:'+colP+'">'+pct(p.pnl_pct)+'</div></div>'
    + '</div>';
  });
  html += '</div>';

  el.innerHTML = html;
}

// ── Modal actualitzar valors ──
function obrirActualitzar(){
  var pos = getPosicions();
  if (!pos.length){ toast('Encara no hi ha posicions'); return; }

  var rows = pos.map(function(p){
    var oldv = parseFloat(p.valor_actual)||0;
    var dataTxt = p.valor_data ? ('anterior: '+eurRound(oldv)+' · '+dataHumana(p.valor_data)) : 'sense valor previ';
    var catNom = catInfo(p.cat).nom;
    var subNom = (p.nom && p.nom !== catNom) ? (esc(p.nom)+' · ') : '';
    return '<div class="upd-row">'
      + '<div class="upd-top">'
        + '<span class="pos-emoji">'+emojiFor(p)+'</span>'
        + '<div style="flex:1;min-width:0">'
          + '<div class="pos-nom">'+esc(catNom)+'</div>'
          + '<div class="pos-meta">'+subNom+dataTxt+'</div>'
        + '</div>'
      + '</div>'
      + '<input class="upd-input" inputmode="decimal" data-pos-id="'+esc(p.id)+'" data-old="'+oldv+'" '
        + 'value="'+(oldv>0?oldv.toLocaleString('ca-ES'):'')+'" placeholder="Valor actual €">'
    + '</div>';
  }).join('');

  var modal = document.createElement('div');
  modal.className = 'modal';
  modal.id = 'modal-upd';
  modal.innerHTML = '<div class="modal-inner">'
    + '<div class="modal-h">Actualitzar valors</div>'
    + '<div class="modal-sub">Posa el valor de mercat actual de cada posició. El trobaràs al teu bróker. Mes: '+nomMesCA(mesActual())+'.</div>'
    + rows
    + '<div style="display:flex;gap:10px;margin-top:18px">'
      + '<button onclick="tancarModal()" style="flex:1;padding:13px;background:var(--g50);color:var(--g700);border-radius:11px;font-weight:500">Cancel·lar</button>'
      + '<button class="btn-primary" style="flex:2" id="btn-upd-save" onclick="guardarActualitzacio()">Desar</button>'
    + '</div>'
  + '</div>';
  document.body.appendChild(modal);
  modal.addEventListener('click', function(ev){ if (ev.target === modal) tancarModal(); });
}
function tancarModal(){
  var m = $('modal-upd'); if (m) m.parentNode.removeChild(m);
}

async function guardarActualitzacio(){
  var data = avui();
  var mes = data.slice(0,7);
  var pos = getPosicions().slice();
  var btn = $('btn-upd-save');

  var suspects = [];
  var pendents = [];
  var inputs = document.querySelectorAll('.upd-input');
  for (var i=0;i<inputs.length;i++){
    var inp = inputs[i];
    var id = inp.getAttribute('data-pos-id');
    var oldv = parseFloat(inp.getAttribute('data-old'))||0;
    var v = parseNumCA(inp.value);
    if (isNaN(v) || v < 0) v = oldv;
    if (oldv > 0 && Math.abs(v-oldv)/oldv > 0.4){
      var pp = pos.find(function(x){ return x.id === id; });
      suspects.push((pp&&pp.nom?pp.nom:'Posició')+': '+eurRound(oldv)+' → '+eurRound(v));
    }
    pendents.push({ id:id, v:v });
  }
  if (suspects.length){
    if (!confirm('Alguns valors canvien molt:\n\n'+suspects.join('\n')+'\n\nVols desar-los igualment?')) return;
  }
  pendents.forEach(function(x){
    var p = pos.find(function(y){ return y.id === x.id; });
    if (p){ p.valor_actual = x.v; p.valor_data = data; }
  });

  // Snapshot mensual
  var valorTotal = pos.reduce(function(s,p){ return s + (parseFloat(p.valor_actual)||0); }, 0);
  var movs = getMoviments();
  var invertit = 0;
  movs.forEach(function(m){ var im=parseFloat(m.import)||0; if(m.tipus==='compra')invertit+=im; if(m.tipus==='venda')invertit-=im; });

  var snaps = getSnapshots().slice();
  var idx = snaps.findIndex(function(s){ return s.mes === mes; });
  var nou = { mes:mes, data:data, valor:valorTotal, invertit:invertit };
  if (idx >= 0) snaps[idx] = nou; else snaps.push(nou);
  snaps.sort(function(a,b){ return a.mes.localeCompare(b.mes); });

  if (btn){ btn.disabled = true; btn.textContent = 'Desant...'; }
  try {
    var res = await sb.from('clients')
      .update({ posicions: pos, snapshots_cartera: snaps })
      .eq('email', APP.email);
    if (res.error) throw res.error;
    APP.client.posicions = pos;
    APP.client.snapshots_cartera = snaps;
    tancarModal();
    toast('✓ Cartera actualitzada · '+eurRound(valorTotal));
    renderCartera();
  } catch(e){
    if (btn){ btn.disabled = false; btn.textContent = 'Desar'; }
    toast('Error: '+(e.message||e));
  }
}

// Sèrie ordenada: mes, aportat, valor, rendiment
function evoSeries(){
  var snaps = getSnapshots().slice().filter(function(s){ return s && s.mes; });
  snaps.sort(function(a,b){ return String(a.mes).localeCompare(String(b.mes)); });
  return snaps.map(function(s){
    var v = parseFloat(s.valor)||0, a = parseFloat(s.invertit)||0;
    return { mes:String(s.mes), valor:v, aportat:a, rend:(v-a) };
  });
}

// Pas "net" per a l'eix Y (1, 2, 2.5, 5, 10 × 10^n)
function evoNiceStep(v){
  if (!(v > 0)) return 100;
  var mag = Math.pow(10, Math.floor(Math.log(v)/Math.LN10));
  var norm = v/mag, step;
  if (norm <= 1) step = 1;
  else if (norm <= 2) step = 2;
  else if (norm <= 2.5) step = 2.5;
  else if (norm <= 5) step = 5;
  else step = 10;
  return step*mag;
}

// Escala amb base retallada: si la cartera és gran i el moviment petit, mantenir
// la base a 0 aplanaria el gràfic i el rendiment seria invisible.
function evoEscala(vals){
  var vmin = Infinity, vmax = -Infinity, i;
  for (i=0;i<vals.length;i++){ vmin = Math.min(vmin, vals[i]); vmax = Math.max(vmax, vals[i]); }
  if (!isFinite(vmin)) { vmin = 0; vmax = 1; }
  var span = (vmax - vmin) || Math.abs(vmax)*0.1 || 1;
  var lo = Math.max(0, vmin - span*0.55);
  var hi = vmax + span*0.30;
  var step = evoNiceStep((hi-lo)/4);
  var guard = 0;
  while (((hi-lo)/step) > 6 && guard++ < 6) step *= 2;
  lo = Math.max(0, Math.floor(lo/step)*step);
  hi = Math.ceil(hi/step)*step;
  if (hi <= lo) hi = lo + step;
  var ticks = [], t;
  for (t = lo; t <= hi + step*0.001; t += step) ticks.push(t);
  return { lo:lo, hi:hi, ticks:ticks };
}

// 12400 -> "12k" · 1250000 -> "1,3M"
function evoCurt(n){
  var a = Math.abs(n), s;
  if (a >= 1000000){ s = (n/1000000).toFixed(1).replace('.', ',')+'M'; }
  else if (a >= 10000){ s = Math.round(n/1000)+'k'; }
  else if (a >= 1000){ s = (n/1000).toFixed(1).replace('.', ',')+'k'; }
  else return String(Math.round(n));
  return s.replace(',0', '');
}

// Gràfic d'àrea apilada: base = capital aportat, capa superior = rendiment
function evoChartSVG(d, W){
  var n = d.length;
  if (n < 2) return '';
  var H = Math.max(184, Math.min(240, Math.round(W*0.60)));
  var padL = 6, padR = 46, padT = 14, padB = 26;
  var plotW = W - padL - padR, plotH = H - padT - padB;

  var vals = [], i;
  for (i=0;i<n;i++){ vals.push(d[i].valor); vals.push(d[i].aportat); }
  var sc = evoEscala(vals);
  var lo = sc.lo, hi = sc.hi, rng = (hi - lo) || 1;

  function X(k){ return padL + (n===1 ? plotW/2 : (k/(n-1))*plotW); }
  function Y(v){ var y = padT + plotH - ((v - lo)/rng)*plotH; return Math.max(padT, Math.min(padT+plotH, y)); }
  function f(x){ return (Math.round(x*10)/10); }

  // Punts amb creuaments interpolats (perquè guany i pèrdua no es barregin en un mateix polígon)
  var pts = [];
  for (i=0;i<n;i++){
    pts.push({ x:X(i), a:d[i].aportat, v:d[i].valor });
    if (i < n-1){
      var d0 = d[i].rend, d1 = d[i+1].rend;
      if ((d0 > 0 && d1 < 0) || (d0 < 0 && d1 > 0)){
        var t = d0/(d0-d1);
        var xc = X(i) + t*(X(i+1)-X(i));
        var ac = d[i].aportat + t*(d[i+1].aportat - d[i].aportat);
        pts.push({ x:xc, a:ac, v:ac });
      }
    }
  }

  var base = padT + plotH;
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Evolució del capital aportat i del rendiment">';

  // Definicions de degradats (userSpaceOnUse: els polígons contigus encaixen sense costures)
  svg += '<defs>'
    + '<linearGradient id="evoG-apt" gradientUnits="userSpaceOnUse" x1="0" y1="'+padT+'" x2="0" y2="'+base+'">'
      + '<stop offset="0%" stop-color="#C8A54A" stop-opacity=".30"/><stop offset="100%" stop-color="#C8A54A" stop-opacity=".07"/></linearGradient>'
    + '<linearGradient id="evoG-pos" gradientUnits="userSpaceOnUse" x1="0" y1="'+padT+'" x2="0" y2="'+base+'">'
      + '<stop offset="0%" stop-color="#1A5C3A" stop-opacity=".34"/><stop offset="100%" stop-color="#1A5C3A" stop-opacity=".12"/></linearGradient>'
    + '<linearGradient id="evoG-neg" gradientUnits="userSpaceOnUse" x1="0" y1="'+padT+'" x2="0" y2="'+base+'">'
      + '<stop offset="0%" stop-color="#C0392B" stop-opacity=".42"/><stop offset="100%" stop-color="#C0392B" stop-opacity=".22"/></linearGradient>'
    + '</defs>';

  // Graella + eix Y
  var k, gy, gv;
  for (k=0;k<sc.ticks.length;k++){
    gv = sc.ticks[k]; gy = f(Y(gv));
    var isBase = (k === 0);
    svg += '<line x1="'+padL+'" y1="'+gy+'" x2="'+f(padL+plotW)+'" y2="'+gy+'" stroke="'+(isBase?'#D9D6D0':'#ECEAE6')+'" stroke-width="1"'
        + (isBase ? '' : ' stroke-dasharray="2 4"')+'/>';
    svg += '<text x="'+f(padL+plotW+8)+'" y="'+f(gy+3.5)+'" font-family="\'IBM Plex Mono\',monospace" font-size="10" fill="#9A9690">'+evoCurt(gv)+'</text>';
  }

  // Banda base: capital viu (des de la base fins al menor dels dos) — mai se superposa
  // amb la banda de rendiment, així la pèrdua no queda tapada per l'or.
  var pmin = '';
  for (i=0;i<pts.length;i++){ pmin += (i===0?'M':'L')+f(pts[i].x)+' '+f(Y(Math.min(pts[i].a, pts[i].v))); }
  svg += '<path class="evo-band" d="'+pmin+' L'+f(pts[pts.length-1].x)+' '+f(base)+' L'+f(pts[0].x)+' '+f(base)+' Z" fill="url(#evoG-apt)"/>';

  // Banda de rendiment: trams consecutius del mateix signe en un sol polígon (sense costures)
  var runs = [], cur = null, sgn;
  for (i=0;i<pts.length-1;i++){
    sgn = ((pts[i].v-pts[i].a) + (pts[i+1].v-pts[i+1].a)) >= 0 ? 1 : -1;
    if (!cur || cur.s !== sgn){ cur = { s:sgn, from:i, to:i+1 }; runs.push(cur); }
    else cur.to = i+1;
  }
  for (var r=0;r<runs.length;r++){
    var run = runs[r], dd = '', kk;
    for (kk=run.from;kk<=run.to;kk++){ dd += (kk===run.from?'M':'L')+f(pts[kk].x)+' '+f(Y(Math.max(pts[kk].a, pts[kk].v))); }
    for (kk=run.to;kk>=run.from;kk--){ dd += 'L'+f(pts[kk].x)+' '+f(Y(Math.min(pts[kk].a, pts[kk].v))); }
    svg += '<path class="evo-band" d="'+dd+' Z" fill="'+(run.s>0?'url(#evoG-pos)':'url(#evoG-neg)')+'"/>';
  }

  // Línia del capital aportat (or, discontínua)
  var pa = '';
  for (i=0;i<pts.length;i++){ pa += (i===0?'M':'L')+f(pts[i].x)+' '+f(Y(pts[i].a)); }
  svg += '<path class="evo-line-a" d="'+pa+'" fill="none" stroke="#C8A54A" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>';

  // Línia del valor de mercat (navy, sòlida, animada)
  var pv = '';
  for (i=0;i<n;i++){ pv += (i===0?'M':'L')+f(X(i))+' '+f(Y(d[i].valor)); }
  svg += '<path class="evo-line-v" d="'+pv+'" fill="none" stroke="#16233A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"/>';

  // Punt final destacat
  var lx = f(X(n-1)), ly = f(Y(d[n-1].valor));
  var cLast = d[n-1].rend >= 0 ? '#1A5C3A' : '#C0392B';
  svg += '<circle class="evo-halo" cx="'+lx+'" cy="'+ly+'" r="4.5" fill="'+cLast+'"/>'
      + '<circle class="evo-dot" cx="'+lx+'" cy="'+ly+'" r="4.5" fill="#16233A" stroke="#fff" stroke-width="2"/>';

  // Etiquetes de mes (màxim 4, sense encavalcaments)
  var idx = [], want = Math.min(4, n);
  for (k=0;k<want;k++){ idx.push(Math.round(k*(n-1)/(want-1||1))); }
  var seen = {};
  for (k=0;k<idx.length;k++){
    var ix = idx[k];
    if (seen[ix]) continue;
    seen[ix] = 1;
    var anchor = ix===0 ? 'start' : (ix===n-1 ? 'end' : 'middle');
    var lab = mesAbrevCA(d[ix].mes);
    if (n <= 12 || ix===0 || ix===n-1) lab += ' ' + d[ix].mes.slice(2,4);
    svg += '<text x="'+f(X(ix))+'" y="'+(H-7)+'" font-size="10" fill="#9A9690" text-anchor="'+anchor+'">'+lab+'</text>';
  }

  svg += '</svg>';
  return svg;
}

// L'eix vertical comença per sobre de zero? (cal dir-ho: xifres nues)
function evoBaseRetallada(d){
  var vals = [], i;
  for (i=0;i<d.length;i++){ vals.push(d[i].valor); vals.push(d[i].aportat); }
  return evoEscala(vals).lo > 0;
}

// Mini-gràfic: només el rendiment acumulat, amb línia de zero. Aquí sí que es veu
// el detall encara que el rendiment sigui petit comparat amb el capital.
function evoRendSVG(d, W){
  var n = d.length;
  if (n < 2) return '';
  var H = 76, padL = 4, padR = 46, padT = 10, padB = 14;
  var plotW = W - padL - padR, plotH = H - padT - padB;

  var mx = 0, i;
  for (i=0;i<n;i++){ mx = Math.max(mx, Math.abs(d[i].rend)); }
  if (!(mx > 0)) mx = 1;
  var hasNeg = false;
  for (i=0;i<n;i++){ if (d[i].rend < 0) hasNeg = true; }
  var top = mx*1.20, bot = hasNeg ? -mx*1.20 : 0;
  var rng = (top - bot) || 1;

  function X(k){ return padL + (n===1 ? plotW/2 : (k/(n-1))*plotW); }
  function Y(v){ return padT + plotH - ((v - bot)/rng)*plotH; }
  function f(x){ return Math.round(x*10)/10; }

  var y0 = f(Y(0));
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Rendiment acumulat mes a mes">'
    + '<defs>'
      + '<linearGradient id="evoR-pos" gradientUnits="userSpaceOnUse" x1="0" y1="'+padT+'" x2="0" y2="'+y0+'">'
        + '<stop offset="0%" stop-color="#1A5C3A" stop-opacity=".30"/><stop offset="100%" stop-color="#1A5C3A" stop-opacity=".04"/></linearGradient>'
      + '<linearGradient id="evoR-neg" gradientUnits="userSpaceOnUse" x1="0" y1="'+y0+'" x2="0" y2="'+f(padT+plotH)+'">'
        + '<stop offset="0%" stop-color="#C0392B" stop-opacity=".04"/><stop offset="100%" stop-color="#C0392B" stop-opacity=".26"/></linearGradient>'
      + '<clipPath id="evoR-cUp"><rect x="0" y="0" width="'+W+'" height="'+y0+'"/></clipPath>'
      + '<clipPath id="evoR-cDn"><rect x="0" y="'+y0+'" width="'+W+'" height="'+f(H-y0)+'"/></clipPath>'
    + '</defs>';

  var line = '', area;
  for (i=0;i<n;i++){ line += (i===0?'M':'L')+f(X(i))+' '+f(Y(d[i].rend)); }
  area = line + ' L'+f(X(n-1))+' '+y0+' L'+f(X(0))+' '+y0+' Z';

  svg += '<path class="evo-band" d="'+area+'" fill="url(#evoR-pos)" clip-path="url(#evoR-cUp)"/>'
      + '<path class="evo-band" d="'+area+'" fill="url(#evoR-neg)" clip-path="url(#evoR-cDn)"/>'
      + '<line x1="'+padL+'" y1="'+y0+'" x2="'+f(padL+plotW)+'" y2="'+y0+'" stroke="#D9D6D0" stroke-width="1" stroke-dasharray="2 3"/>'
      + '<text x="'+f(padL+plotW+8)+'" y="'+f(y0+3.5)+'" font-family="\'IBM Plex Mono\',monospace" font-size="9.5" fill="#9A9690">0€</text>';

  // Un tram per segment perquè el color segueixi el signe
  for (i=0;i<n-1;i++){
    var neg = (d[i].rend + d[i+1].rend) < 0;
    svg += '<path class="evo-line-v" d="M'+f(X(i))+' '+f(Y(d[i].rend))+' L'+f(X(i+1))+' '+f(Y(d[i+1].rend))+'"'
        + ' fill="none" stroke="'+(neg?'#C0392B':'#1A5C3A')+'" stroke-width="2" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>';
  }
  var cl = d[n-1].rend >= 0 ? '#1A5C3A' : '#C0392B';
  svg += '<circle class="evo-dot" cx="'+f(X(n-1))+'" cy="'+f(Y(d[n-1].rend))+'" r="3.6" fill="'+cl+'" stroke="#fff" stroke-width="1.8"/>';
  svg += '</svg>';
  return svg;
}

// Repinta el gràfic a l'amplada real del contenidor (evita text i traços deformats)
var _evoResizeT = null;
function evoPaint(){
  var host = $('evo-chart');
  if (!host) return;
  var d = evoSeries();
  var w = Math.round(host.clientWidth || 0);
  if (w < 220) w = 320;
  if (w > 640) w = 640;
  host.innerHTML = evoChartSVG(d, w);

  var mini = $('evo-rend');
  if (mini){
    var w2 = Math.round(mini.clientWidth || 0);
    if (w2 < 220) w2 = 320;
    if (w2 > 640) w2 = 640;
    mini.innerHTML = evoRendSVG(d, w2);
  }
}

    + '<div class="evo-wrap" id="evo-chart"></div>'
    + '<div class="evo-leg">'
      + '<span><i class="evo-sw" style="background:#C8A54A;opacity:.55"></i>Capital aportat</span>'
      + '<span><i class="evo-sw" style="background:'+hexR+';opacity:.5"></i>Rendiment</span>'

    + '</div>'
    + '<div class="evo-nota">L\'àrea daurada és el que hi has posat tu. La franja de sobre és el que ha fet el mercat. La suma de les dues és el valor de la cartera.'
      + (evoBaseRetallada(d) ? ' <span style="color:var(--g400)">L\'eix vertical no comença a zero: està ajustat al rang real per veure el moviment.</span>' : '')
    + '</div>'
    + '</div>';

  // ── Desglossament + composició ──
  var baseMix = Math.max(last.valor, last.aportat) || 1;
  var wApt, wRend, mixLbl;
  if (rend >= 0){
    wApt = last.aportat/baseMix*100;
    wRend = rend/baseMix*100;
    mixLbl = '<b style="color:var(--ink);font-weight:600">'+Math.round(wApt)+'%</b> del valor actual és capital teu · '
           + '<b style="color:var(--green);font-weight:600">'+Math.round(wRend)+'%</b> l\'ha generat el mercat.';
  } else {
    wApt = last.valor/baseMix*100;
    wRend = (-rend)/baseMix*100;
    mixLbl = 'La cartera val avui un <b style="color:var(--ink);font-weight:600">'+Math.round(wApt)+'%</b> del que hi has aportat. '
           + 'Les caigudes formen part del camí: el que compta és el pla, no el mes.';
  }

  html += '<div class="card">'
    + '<div class="card-lbl" style="margin-bottom:12px">Desglossament</div>'
    + '<div class="evo-stats">'
      + '<div class="evo-stat"><div class="l">Aportat</div><div class="v" style="color:var(--gold-dark)">'+eurRound(last.aportat)+'</div></div>'
      + '<div class="evo-stat"><div class="l">Rendiment</div><div class="v" style="color:'+colR+'">'+(rend>=0?'+':'')+eurRound(rend)+'</div></div>'
      + '<div class="evo-stat"><div class="l">Valor</div><div class="v" style="color:var(--navy)">'+eurRound(last.valor)+'</div></div>'
    + '</div>'
    + '<div class="evo-mix">'
      + '<i style="width:'+wApt.toFixed(1)+'%;background:#C8A54A"></i>'
      + '<i style="width:'+wRend.toFixed(1)+'%;background:'+hexR+'"></i>'
    + '</div>'
    + '<div class="evo-mix-lbl">'+mixLbl+'</div>'
    + '<div class="evo-sub-lbl">Rendiment acumulat mes a mes</div>'
    + '<div class="evo-wrap" id="evo-rend" style="margin-top:6px;min-height:76px"></div>'
    + '</div>';

  // ── Històric mensual ──
  html += '<div class="card"><div class="card-lbl" style="margin-bottom:10px">Històric mensual</div>'
    + '<div class="evo-hd"><div style="flex:1">Mes</div><div style="width:78px">Aportat</div>'
    + '<div style="width:78px">Valor</div><div style="width:74px">Rendiment</div></div>';

  for (var j=n-1;j>=0;j--){
    var s = d[j];
    var cR = s.rend >= 0 ? 'var(--green)' : 'var(--red)';
    html += '<div class="evo-tr">'
      + '<div class="m">'+nomMesCA(s.mes)+' <span style="color:var(--g400);font-weight:400">'+s.mes.slice(0,4)+'</span></div>'
      + '<div class="evo-num" style="width:78px;color:var(--gold-dark)">'+eurRound(s.aportat)+'</div>'
      + '<div class="evo-num" style="width:78px;color:var(--navy)">'+eurRound(s.valor)+'</div>'
      + '<div class="evo-num" style="width:74px;color:'+cR+'">'+(s.rend>=0?'+':'')+eurRound(s.rend)+'</div>'
    + '</div>';
  }
  html += '</div>';

  el.innerHTML = html;
  evoPaint();

  if (!window._evoResizeBound){
    window._evoResizeBound = true;
    window.addEventListener('resize', function(){
      if (APP.view !== 'evolucio') return;
      if (_evoResizeT) clearTimeout(_evoResizeT);
      _evoResizeT = setTimeout(evoPaint, 140);
    });
  }
}

// Extreu text net d'un HTML d'email (sense renderitzar HTML cru: més segur al mòbil)
function htmlAText(html){
  if (!html) return '';
  var s = String(html);
  // eliminar blocs no visibles
  s = s.replace(/<style[\s\S]*?<\/style>/gi, ' ');
  s = s.replace(/<script[\s\S]*?<\/script>/gi, ' ');
  s = s.replace(/<head[\s\S]*?<\/head>/gi, ' ');
  // salts de línia per a blocs i <br>
  s = s.replace(/<\s*br\s*\/?>/gi, '\n');
  s = s.replace(/<\/\s*(p|div|tr|h[1-6]|li)\s*>/gi, '\n');
  s = s.replace(/<\s*li[^>]*>/gi, '• ');
  // treure la resta d'etiquetes
  s = s.replace(/<[^>]+>/g, ' ');
  // decodificar entitats bàsiques
  s = s.replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&lt;/gi,'<')
       .replace(/&gt;/gi,'>').replace(/&quot;/gi,'"').replace(/&#39;/gi,"'").replace(/&euro;/gi,'€');
  // normalitzar espais i salts
  s = s.replace(/[ \t]+/g, ' ');
  s = s.replace(/\n[ \t]+/g, '\n').replace(/[ \t]+\n/g, '\n');
  s = s.replace(/\n{3,}/g, '\n\n');
  return s.trim();
}

// localStorage: id de l'últim comunicat llegit (per marcar nous)

async function carregarThread(){
  var thread = $('chat-thread');
  if (!thread) return;

async function comptarMissatgesMes(){
  try {
    var first = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString();
    var res = await sb.from('messages').select('id',{count:'exact',head:true})
      .eq('client_email', APP.email).eq('from_role','client').gte('created_at', first);

    return res.count || 0;

function esPlaSenyal(){
  var pla = (APP.client && APP.client.pla) || 'senyal';
  if (pla === 'essencial') pla = 'senyal';
  return pla === 'senyal';
}

async function enviarMissatge(){
  var input = $('msg-input');
  var btn = $('msg-send');
  if (!input || !input.value.trim()) return;
  var txt = input.value.trim();

  if (esPlaSenyal()){
    var used = await comptarMissatgesMes();
    if (used >= SENYAL_MSG_LIMIT){
      toast('Has arribat al límit de '+SENYAL_MSG_LIMIT+' missatges aquest mes (pla Senyal).');
      return;
    }
  }

  input.disabled = true; if (btn) btn.disabled = true;
  try {
    var res = await sb.from('messages').insert({
      client_email: APP.email,
      from_email: APP.email,
      from_role: 'client',
      content: txt,
      read_by_admin: false,
      read_by_client: true
    });
    if (res.error) throw res.error;
    input.value = ''; autoGrow(input);
    input.disabled = false; if (btn) btn.disabled = false;
    input.focus();
    await carregarThread();
  } catch(e){
    input.disabled = false; if (btn) btn.disabled = false;
    input.value = txt;
    toast('Error enviant: '+(e.message||e));
  }
}

// VISTA: APORTAR
// Mostra quant i on toca aportar aquest mes (segons cartera target i
// desviació real, com fa platform.html) i permet REGISTRAR l'aportació
// feta com a moviments de tipus 'compra' (queda historial i compta al P&L).
// ════════════════════════════════════════════

// Cartera target del client (array {id,nom,pct,color}); buida si no n'hi ha.
function getTarget(){
  var c = APP.client;
  return (c && Array.isArray(c.cartera_target_custom)) ? c.cartera_target_custom : [];
}

// Aportació mensual configurada (de perfil.aportacioMensual). 0 si no n'hi ha.
function getAportacioMensual(){
  var c = APP.client;
  if (c && c.perfil && c.perfil.aportacioMensual != null){
    var v = parseFloat(String(c.perfil.aportacioMensual).replace(/[^0-9.,]/g,'').replace(',','.'));
    return isNaN(v) ? 0 : v;
  }
  return 0;
}

// Distribució real per categoria: {cat: valor_sumat}
function distribucioRealPerCat(){
  var per = {};
  getPosicions().forEach(function(p){
    var cat = p.cat || 'altres';
    var v = parseFloat(p.valor_actual)||0;
    per[cat] = (per[cat]||0) + v;
  });
  return per;
}

// Algoritme idèntic a calcMatchingITactic de platform.html, però usant
// cartera_target_custom (que ja porta nom i color per categoria).
// Retorna { rows:[...], recomanacio:[{cat,nom,color,import,motiu}], valorActual, valorPost, aport }
// El calcul d'aportacio viu a TBI_CARTERA. Abans l'app en tenia una copia
// amb l'algoritme antic (top-2, sense bandes ni minim per ordre): amb la
// mateixa cartera i 500 euros, l'app deia "RF Corp 499 + Or 1" i la
// plataforma "RF Corp 500". Ara nomes hi ha una implementacio.
function ctxCartera(){
  return { posicions: getPosicions(), moviments: getMoviments(), target: getTarget() };
}
function calcAportacio(aport){
  var target = getTarget();
  if (!target.length) return null;
  var m = TBI_CARTERA.matching(ctxCartera(), aport);
  if (!m) return null;
  // Forma que espera el render de l'app
  return {
    rows: m.rows.map(function(r){
      return { cat:r.id, nom:r.nom, color:r.color, targetPct:r.target_pct,
               realEur:r.real_eur, realPct:r.real_pct, gapEur:r.gap_eur,
               gapPct:r.gap_pct, banda:r.banda_pp, foraBanda:r.fora_banda,
               estat:r.estat, foraPla:r.fora_pla };
    }),
    recomanacio: m.recomanacio.map(function(l){
      return { cat:l.cat, nom:l.nom, color:l.color, import:l.import, motiu:l.motiu, prioritat:l.prioritat };
    }),
    resum: m.resum,
    valorActual: m.valor_actual, valorPost: m.valor_post, aport: m.aportacio
  };
}

// Quantes aportacions s'han registrat aquest mes (per avisar si ja s'ha fet)
function aportacionsAquestMes(){
  var mes = mesActual();
  return getMoviments().filter(function(m){
    return m.tipus === 'compra' && m.data && String(m.data).slice(0,7) === mes && m.nota && m.nota.indexOf('Aportació') === 0;
  });
}

function renderAportar(){
  var el = $('view');
  var target = getTarget();
  var pos = getPosicions();

  if (!pos.length || !target.length){
    el.innerHTML = '<div class="empty-rich">'
      + '<div class="empty-ico">📅</div>'
      + '<div class="empty-tit">Encara no tens cartera objectiu</div>'
      + '<div class="empty-sub">Quan el teu assessor defineixi la teva cartera, aquí veuràs cada mes quant aportar i a quina categoria exactament.</div>'
      + '<button class="btn-primary" onclick="go(\'missatges\')">Escriure a l\'assessor</button>'
      + '</div>';
    return;
  }

  var aport = getAportacioMensual();
  var html = '';

  // Cas: sense aportació configurada -> permetre definir-la
  if (aport <= 0){
    html += '<div class="card" style="text-align:center">'
      + '<div style="font-size:30px;margin-bottom:6px">📅</div>'
      + '<div class="section-h" style="margin:0 0 6px">Quant vols aportar cada mes?</div>'
      + '<div style="font-size:13px;color:var(--g500);line-height:1.6;margin-bottom:16px">Defineix la teva aportació mensual i et direm a quines categories posar-la per acostar-te a la teva cartera objectiu.</div>'
      + '<input class="upd-input" id="inp-aport-mens" inputmode="decimal" placeholder="Ex: 300" style="text-align:center;margin-bottom:12px">'
      + '<button class="btn-primary" onclick="desarAportacioMensual()">Desar aportació mensual</button>'
      + '</div>';
    el.innerHTML = html;
    return;
  }

  var calc = calcAportacio(aport);
  var jaFet = aportacionsAquestMes();

  // Capçalera: import mensual
  html += '<div class="card">'
    + '<div class="card-lbl">Aportació d\'aquest mes</div>'
    + '<div class="kpi-big">'+eurRound(aport)+'</div>'
    + '<div class="kpi-sub" style="color:var(--g500)">Mes de '+nomMesCA(mesActual())+'</div>'
    + '<button onclick="editarAportMensual()" style="margin-top:10px;background:none;color:var(--navy);font-size:12px;text-decoration:underline">Canviar import</button>'
    + '</div>';

  // Banner si ja s'ha registrat aquest mes
  if (jaFet.length){
    var totalFet = jaFet.reduce(function(s,m){ return s + (parseFloat(m.import)||0); }, 0);
    html += '<div class="banner-upd" style="background:#EEF3EE;border-color:#A8CDB5">'
      + '<div class="txt" style="color:#1A5C3A">✓ Aquest mes ja has registrat '+eurRound(totalFet)+' en aportacions.</div></div>';
  }

  // On toca aportar (recomanació per categoria)
  html += '<div class="section-h">On aportar aquest mes</div>';
  html += '<div class="card">';
  if (calc && calc.recomanacio.length){
    calc.recomanacio.forEach(function(r){
      html += '<div class="pos-row">'
        + '<span style="width:10px;height:10px;border-radius:3px;flex-shrink:0;background:'+r.color+'"></span>'
        + '<div style="flex:1;min-width:0">'
          + '<div class="pos-nom">'+esc(r.nom)+'</div>'
          + '<div class="pos-meta">'+esc(r.motiu)+'</div>'
        + '</div>'
        + '<div class="pos-val">'+eurRound(r.import)+'</div>'
      + '</div>';
    });
    html += '<div style="font-size:11px;color:var(--g400);margin-top:10px;line-height:1.5">'
      + 'Calculat amb bandes 5/25: primer el que està fora de banda, mai més enllà del seu forat i amb un mínim de '
      + TBI_CARTERA.PARAMS.import_min_ordre + '€ per ordre. És exactament el mateix càlcul que veu el teu assessor.</div>';
  } else {
    html += '<div class="empty" style="padding:20px">La teva cartera ja està equilibrada. Pots aportar repartint segons la teva distribució objectiu.</div>';
  }
  html += '</div>';

  // Botó registrar
  html += '<button class="btn-primary" style="margin-bottom:14px" onclick="obrirRegistrarAportacio()">➕ Registrar aportació feta</button>';

  // Distribució objectiu vs real (context)
  html += '<div class="section-h">La teva cartera objectiu</div><div class="card">';
  calc.rows.forEach(function(r){
    // La referencia ja no es un llindar arbitrari sino la banda 5/25 real
    var diff = r.gapPct;
    var dins = !r.foraBanda;
    var diffTxt = dins ? 'dins de banda' : ((diff>0?'+':'')+diff.toFixed(1)+'pp per '+(diff>0?'sota':'sobre'));

function obrirRegistrarAportacio(){

  var pre = {};

  modal.id = 'modal-aport';

    + '<div class="modal-h">Registrar aportació</div>'
    + '<div class="modal-sub">Posa quant has aportat a cada categoria aquest mes. Ho hem pre-omplert amb la recomanació; ajusta el que calgui.</div>'
    + rows
    + '<div id="aport-total" style="text-align:right;font-family:var(--fm);font-size:14px;font-weight:500;color:var(--navy);margin-top:10px"></div>'

      + '<button class="btn-primary" style="flex:2" id="btn-aport-save" onclick="guardarRegistreAportacio()">Registrar</button>'
    + '</div>'
  + '</div>';

  var inps = modal.querySelectorAll('.upd-input');

    var t = 0;

    $('aport-total').textContent = 'Total: ' + eurRound(t);

  recalc();
}
function tancarModalAport(){

}

async function guardarRegistreAportacio(){
  var data = avui();
  var mes = mesActual();
  var btn = $('btn-aport-save');
  var pos = getPosicions();
  var movs = getMoviments().slice();

  var inputs = document.querySelectorAll('#modal-aport .upd-input');
  var nous = [];
  var totalAport = 0;
  for (var i=0;i<inputs.length;i++){
    var inp = inputs[i];
    var cat = inp.getAttribute('data-cat');
    var v = parseNumCA(inp.value);
    if (isNaN(v) || v <= 0) continue;
    // Buscar una posició d'aquesta categoria per vincular el moviment
    var posCat = pos.find(function(p){ return (p.cat||'') === cat; });
    if (!posCat){
      // No hi ha posició d'aquesta categoria encara: registrem igualment
      // vinculant a la primera posició (l'import compta al cost global).
      posCat = pos[0];
    }
    if (!posCat) continue;
    totalAport += v;
    nous.push({
      id: novaId('mov'),
      posicio_id: posCat.id,
      data: data,
      tipus: 'compra',
      import: v,
      unitats: null,
      preu_unitat: null,
      nota: 'Aportació ' + nomMesCA(mes) + ' · ' + (inp.getAttribute('data-nom')||cat)
    });
  }

  if (!nous.length){ toast('Posa almenys un import'); return; }

  // Afegir el valor aportat al valor_actual de la posició corresponent
  // (l'aportació augmenta tant el cost com el valor de mercat de partida).
  var posAct = pos.slice();
  nous.forEach(function(m){
    var p = posAct.find(function(x){ return x.id === m.posicio_id; });
    if (p){ p.valor_actual = (parseFloat(p.valor_actual)||0) + (parseFloat(m.import)||0); p.valor_data = data; }
  });

  var allMovs = movs.concat(nous);

  // Actualitzar snapshot del mes
  var valorTotal = posAct.reduce(function(s,p){ return s+(parseFloat(p.valor_actual)||0); }, 0);
  var invertit = 0;
  allMovs.forEach(function(m){ var im=parseFloat(m.import)||0; if(m.tipus==='compra')invertit+=im; if(m.tipus==='venda')invertit-=im; });
  var snaps = getSnapshots().slice();
  var idx = snaps.findIndex(function(s){ return s.mes === mes; });
  var nou = { mes:mes, data:data, valor:valorTotal, invertit:invertit };
  if (idx >= 0) snaps[idx] = nou; else snaps.push(nou);
  snaps.sort(function(a,b){ return a.mes.localeCompare(b.mes); });

  if (btn){ btn.disabled = true; btn.textContent = 'Registrant...'; }
  try {
    var res = await sb.from('clients')
      .update({ posicions: posAct, moviments_posicions: allMovs, snapshots_cartera: snaps })
      .eq('email', APP.email);
    if (res.error) throw res.error;
    APP.client.posicions = posAct;
    APP.client.moviments_posicions = allMovs;
    APP.client.snapshots_cartera = snaps;
    tancarModalAport();
    toast('✓ Aportació registrada · '+eurRound(totalAport));
    renderAportar();
  } catch(e){
    if (btn){ btn.disabled = false; btn.textContent = 'Registrar'; }
    toast('Error: '+(e.message||e));
  }
}

var VAPID_PUBLIC_KEY = 'BE_IX5vXaarMOkrMIvNvWeWllqDJokveWIRJsFoYysWeHnisc4xRSovp0-BFPo1m3j3Eo-0th_-w6ID57UhLRaU';

// Converteix la clau VAPID base64url a Uint8Array (format que demana l'API)
function urlBase64ToUint8Array(base64String){
  var padding = '='.repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  var raw = atob(base64);
  var arr = new Uint8Array(raw.length);
  for (var i=0;i<raw.length;i++){ arr[i] = raw.charCodeAt(i); }
  return arr;
}

function pushSuportat(){
  return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
}
function esIOSpush(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}

// Estat actual: 'no-suportat' | 'instal-cal' | 'desactivat' | 'activat' | 'denegat'
async function estatPush(){
  if (!pushSuportat()) return 'no-suportat';
  // iOS només permet push si l'app està instal·lada (standalone)
  if (esIOSpush() && !appEstaInstalada()) return 'instal-cal';
  if (Notification.permission === 'denied') return 'denegat';
  try {
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    return sub ? 'activat' : 'desactivat';
  } catch(e){ return 'desactivat'; }
}

// Activa les notificacions: demana permís, subscriu i desa a Supabase
async function activarPush(){
  if (!pushSuportat()){ toast('El teu navegador no suporta notificacions'); return false; }
  if (esIOSpush() && !appEstaInstalada()){
    mostrarInstruccionsIOS();
    return false;
  }
  try {
    var perm = await Notification.requestPermission();
    if (perm !== 'granted'){ toast('Permís de notificacions denegat'); return false; }

    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    if (!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    var raw = sub.toJSON();
    var keys = raw.keys || {};
    // Desar/actualitzar a Supabase (upsert per endpoint)
    var res = await sb.from('push_subscriptions').upsert({
      client_email: APP.email,
      endpoint: raw.endpoint,
      p256dh: keys.p256dh,
      auth: keys.auth,
      user_agent: navigator.userAgent,
      last_used_at: new Date().toISOString()
    }, { onConflict: 'endpoint' });
    if (res.error) throw res.error;
    toast('✓ Notificacions activades');
    return true;
  } catch(e){
    toast('No s\'han pogut activar: ' + (e.message||e));
    return false;
  }
}

// Desactiva: cancel·la la subscripció i l'esborra de Supabase
async function desactivarPush(){
  try {
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    if (sub){
      var endpoint = sub.endpoint;
      await sub.unsubscribe();
      try { await sb.from('push_subscriptions').delete().eq('endpoint', endpoint); } catch(e){}
    }
    toast('Notificacions desactivades');
    return true;
  } catch(e){ toast('Error: '+(e.message||e)); return false; }
}

// Toggle des de la UI d'ajuda/configuració
async function togglePush(){
  var estat = await estatPush();
  if (estat === 'activat'){ await desactivarPush(); }
  else { await activarPush(); }

  try { actualitzarFilaPush(); } catch(e){}

var _deferredPrompt = null;

function appEstaInstalada(){
  // standalone display-mode (Android/desktop) o navigator.standalone (iOS)
  var mq = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  return !!(mq || window.navigator.standalone === true);
}
function esIOS(){
  return /iphone|ipad|ipod/i.test(window.navigator.userAgent) && !window.MSStream;
}

// Capturar l'esdeveniment d'instal·lació (Android)
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  _deferredPrompt = e;
  mostrarBotonsInstall();
});

// Quan s'instal·la, amaguem tot
window.addEventListener('appinstalled', function(){
  _deferredPrompt = null;
  var b = document.getElementById('install-login');
  if (b) b.style.display = 'none';
});

// Mostra els botons d'instal·lació si escau
function mostrarBotonsInstall(){
  if (appEstaInstalada()) return;
  var b = document.getElementById('install-login');
  // Mostrem el botó si tenim prompt (Android) o si és iOS (instruccions)
  if (b && (_deferredPrompt || esIOS())) b.style.display = 'block';
}

// Acció del botó "Instal·lar app"
async function instalarApp(){
  if (appEstaInstalada()) { toast('L\'app ja està instal·lada'); return; }
  if (_deferredPrompt){
    _deferredPrompt.prompt();
    try {
      var choice = await _deferredPrompt.userChoice;
      _deferredPrompt = null;
      if (choice && choice.outcome === 'accepted'){ toast('✓ Instal·lant l\'app...'); }
    } catch(e){}
    return;
  }
  if (esIOS()){ mostrarInstruccionsIOS(); return; }
  // Fallback (alguns Android que no han disparat l'esdeveniment encara)
  mostrarInstruccionsGeneriques();
}
