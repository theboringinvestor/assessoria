<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Boring Investor — El teu perfil</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black:#0A0A0A; --white:#FAFAF8;
  --g100:#F4F3F0; --g200:#E8E6E1; --g300:#C8C5BE; --g400:#9A9690; --g500:#6B6762; --g700:#3A3835;
  --fd:'Playfair Display',Georgia,serif;
  --fb:'DM Sans',system-ui,sans-serif;
  --fm:'DM Mono',monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{overflow-y:auto}
body{font-family:var(--fb);background:var(--black);color:var(--white);font-size:14px;-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(10,10,10,.9);backdrop-filter:blur(8px)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:50px}
.logo{display:flex;align-items:center;gap:9px}
.logo-box{width:26px;height:26px;border:1.5px solid rgba(255,255,255,.45);border-radius:3px;display:flex;align-items:center;justify-content:center}
.logo-face{position:relative;width:18px;height:14px}
.ld{width:3px;height:3px;border-radius:50%;background:var(--white);position:absolute;left:0}
.ld:first-child{top:1px}.ld:last-child{top:9px}
.ldash{width:6px;height:1.5px;background:var(--white);position:absolute;left:4px;top:6px}
.lpipe{width:1.5px;height:12px;background:var(--white);position:absolute;right:0;top:1px}
.logo-name{font-size:12px;font-weight:500;color:rgba(255,255,255,.75)}

.prog-info{display:flex;align-items:center;gap:12px}
.prog-pct{font-family:var(--fm);font-size:14px;font-weight:500;color:var(--white);min-width:36px;text-align:right}
.prog-label{font-size:11px;color:rgba(255,255,255,.3)}
.time-pill{font-size:11px;color:rgba(255,255,255,.3);font-family:var(--fm)}

/* Barra de progrés completa sota el header */
.prog-bar-wrap{height:3px;background:rgba(255,255,255,.08);position:relative}
.prog-bar-fill{height:100%;background:var(--white);border-radius:0 99px 99px 0;transition:width .5s var(--ease);min-width:0}
.prog-dim-marks{position:absolute;top:0;left:0;right:0;height:100%;display:flex}
.prog-dim-mark{flex:1;border-right:1px solid rgba(0,0,0,.4)}
.prog-dim-mark:last-child{border-right:none}

/* ── MAIN ── */
.main{height:100vh;padding-top:53px;display:flex;flex-direction:column;overflow:hidden}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 40px;overflow-y:auto;overflow-x:hidden}
.q-wrap{max-width:580px;width:100%;transition:transform .3s var(--ease),opacity .22s var(--ease)}
.q-wrap.out-l{transform:translateX(-44px);opacity:0}
.q-wrap.out-r{transform:translateX(44px);opacity:0}
.q-wrap.in-r{transform:translateX(44px);opacity:0}

/* ── PREGUNTA ── */
.dim-tag{font-size:10px;font-weight:500;color:rgba(255,255,255,.22);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.q-text{font-family:var(--fd);font-size:clamp(17px,2.8vw,25px);font-weight:400;line-height:1.45;color:var(--white);margin-bottom:26px;letter-spacing:-.3px}

/* ── OPCIONS ── */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:14px;cursor:pointer;transition:background .13s,border-color .13s,transform .1s;display:flex;align-items:flex-start;gap:11px;-webkit-tap-highlight-color:transparent;user-select:none}
.opt:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22)}
.opt:active{transform:scale(.98)}
.opt.sel{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.9)}
.opt-sym{width:34px;height:34px;border-radius:7px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;font-family:var(--fm);font-weight:500;color:rgba(255,255,255,.5);transition:background .13s,color .13s}
.opt.sel .opt-sym{background:rgba(255,255,255,.18);color:var(--white)}
.opt-lbl{font-size:9px;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px;transition:color .13s}
.opt.sel .opt-lbl{color:rgba(255,255,255,.5)}
.opt-txt{font-size:12px;color:rgba(255,255,255,.6);line-height:1.45;transition:color .13s}
.opt.sel .opt-txt{color:var(--white)}

/* ── SLIDER ── */
.slider-wrap{padding:4px 0 20px}
.slider-lbls{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.25);margin-bottom:12px}
input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:rgba(255,255,255,.15);border-radius:99px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--white);cursor:pointer;transition:transform .12s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18)}
.slider-readout{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.slider-num{font-family:var(--fm);font-size:32px;font-weight:500;color:var(--white)}
.slider-unit{font-size:14px;color:rgba(255,255,255,.4)}
.slider-desc{font-size:12px;color:rgba(255,255,255,.35);margin-top:4px;min-height:18px;transition:all .18s}

/* ── TEXT INPUT ── */
.form-inp{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:12px 16px;font-size:16px;font-family:var(--fb);color:var(--white);outline:none;transition:border-color .15s;width:100%;max-width:420px}
.form-inp::placeholder{color:rgba(255,255,255,.18)}
.form-inp:focus{border-color:rgba(255,255,255,.4)}
.form-sel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:11px 14px;font-size:14px;font-family:var(--fb);color:var(--white);outline:none;width:100%;-webkit-appearance:none}
.form-sel:focus{border-color:rgba(255,255,255,.4)}
.form-sel option{background:var(--black)}
.form-lbl{font-size:10px;font-weight:500;color:rgba(255,255,255,.28);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;display:block}
.personal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-field{display:flex;flex-direction:column}

/* ── CARTERA ── */
.actiu-hdr{display:grid;grid-template-columns:1fr 60px 1fr 32px;gap:8px;margin-bottom:5px}
.actiu-row{display:grid;grid-template-columns:1fr 60px 1fr 32px;gap:8px;margin-bottom:7px;align-items:center}
.inp-sm{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:8px 10px;font-size:13px;font-family:var(--fb);color:var(--white);outline:none;width:100%;transition:border-color .15s}
.inp-sm::placeholder{color:rgba(255,255,255,.18)}
.inp-sm:focus{border-color:rgba(255,255,255,.35)}
.inp-sm.center{text-align:center}
.btn-rm{background:transparent;border:none;color:rgba(255,255,255,.2);font-size:18px;cursor:pointer;padding:0 4px;transition:color .15s;line-height:1}
.btn-rm:hover{color:rgba(255,255,255,.6)}
.btn-add{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border:1px dashed rgba(255,255,255,.18);border-radius:8px;background:transparent;color:rgba(255,255,255,.3);font-size:12px;font-family:var(--fb);cursor:pointer;width:100%;margin-top:6px;transition:all .15s}
.btn-add:hover{border-color:rgba(255,255,255,.38);color:rgba(255,255,255,.6)}

/* ── NAV ── */
.nav{padding:18px 40px 26px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.btn-back{padding:8px 16px;border-radius:7px;font-size:13px;font-family:var(--fb);cursor:pointer;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(255,255,255,.4);transition:all .15s}
.btn-back:hover{border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.75)}
.btn-next{padding:10px 26px;border-radius:7px;font-size:13px;font-family:var(--fb);font-weight:500;cursor:pointer;border:1.5px solid var(--white);background:var(--white);color:var(--black);transition:all .15s}
.btn-next:hover:not(:disabled){background:var(--g100)}
.btn-next:disabled{opacity:.22;cursor:default}
.kb-hint{font-size:11px;color:rgba(255,255,255,.18)}

/* ── RESULTAT ── */
.result-outer{width:100%;max-width:620px;padding-bottom:80px}
.result-eyebrow{font-size:10px;font-weight:500;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.result-nom{font-family:var(--fd);font-size:clamp(32px,5vw,52px);font-weight:400;line-height:1.1;letter-spacing:-.5px;margin-bottom:4px}
.result-ep{font-family:var(--fd);font-size:14px;font-style:italic;color:rgba(255,255,255,.35);margin-bottom:6px}
.result-score-row{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.result-score-num{font-family:var(--fm);font-size:13px;color:rgba(255,255,255,.3)}
.result-score-track{flex:1;max-width:120px;height:3px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.result-score-fill{height:100%;background:rgba(255,255,255,.6);border-radius:99px}
.result-lema{border-left:2px solid rgba(255,255,255,.15);padding-left:14px;font-family:var(--fd);font-style:italic;font-size:14px;color:rgba(255,255,255,.4);line-height:1.6;margin-bottom:18px}
.result-desc{font-size:13px;color:rgba(255,255,255,.6);line-height:1.7;margin-bottom:20px}
.result-cartera-lbl{font-size:10px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.result-cartera-tag{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border:1px solid rgba(255,255,255,.28);border-radius:99px;font-size:13px;color:var(--white);margin-bottom:22px}
.result-dims{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:24px}
.rdim{text-align:center}
.rdim-bar{height:38px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;display:flex;align-items:flex-end;margin-bottom:3px}
.rdim-fill{width:100%;border-radius:3px;background:rgba(255,255,255,.45);transition:height 1s var(--ease)}
.rdim-lbl{font-size:9px;color:rgba(255,255,255,.25);line-height:1.3}
.result-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px;margin:0 auto}
.btn-dl{padding:14px 24px;border-radius:8px;font-size:14px;font-family:var(--fb);font-weight:600;cursor:pointer;border:none;background:var(--white);color:var(--black);transition:all .15s;width:100%;text-align:center}
.btn-dl:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(255,255,255,.15)}
.btn-dl:active{transform:translateY(0)}
.btn-dl.sent{background:rgba(255,255,255,.15);color:rgba(255,255,255,.6);cursor:default}
.btn-secondary{padding:13px 24px;border-radius:8px;font-size:13px;font-family:var(--fb);font-weight:500;cursor:pointer;border:1.5px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.8);transition:all .15s;width:100%;text-align:center}
.btn-secondary:hover{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.06)}
.btn-reset{padding:11px 24px;border-radius:8px;font-size:13px;font-family:var(--fb);cursor:pointer;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(255,255,255,.4);transition:all .15s;width:100%;text-align:center}
.btn-reset:hover{border-color:rgba(255,255,255,.25);color:rgba(255,255,255,.65)}
.result-note{font-size:11px;color:rgba(255,255,255,.2);margin-top:14px;line-height:1.6}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.14);backdrop-filter:blur(8px);color:var(--white);padding:9px 20px;border-radius:99px;font-size:12px;display:none;z-index:200;border:1px solid rgba(255,255,255,.18);white-space:nowrap}
.toast.show{display:block}

@media(max-width:640px){
  .opts{grid-template-columns:1fr}
  .personal-grid{grid-template-columns:1fr}
  .actiu-row,.actiu-hdr{grid-template-columns:1fr 52px 1fr 28px}
  .stage{padding:20px 20px}
  .nav{padding:14px 20px 22px}
  .kb-hint{display:none}
}







.result-img{width:180px;height:180px;border-radius:10px;object-fit:cover;filter:grayscale(100%) contrast(1.15) brightness(1.05);display:block;margin:0 auto 16px;border:1px solid rgba(255,255,255,.18);flex-shrink:0}
.result-img-wrap{width:180px;height:180px;margin:0 auto 16px;border-radius:10px;overflow:hidden;flex-shrink:0;}
.result-av{width:180px;height:180px;background:rgba(255,255,255,.12);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:300;color:rgba(255,255,255,.7);letter-spacing:-2px;}

.radar-section{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
.radar-lbl{font-size:10px;font-weight:500;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.radar-wrap{position:relative;width:100%;max-width:280px;height:260px;margin:0 auto}
.dim-bars{margin-top:14px;display:flex;flex-direction:column;gap:5px}
.dim-row{display:flex;align-items:center;gap:8px}
.dim-lbl-s{font-size:10px;color:rgba(255,255,255,.3);width:82px;flex-shrink:0;text-align:right}
.dim-track{flex:1;height:3px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.dim-fill-s{height:100%;border-radius:99px;background:rgba(255,255,255,.55)}
.dim-val-s{font-size:10px;color:rgba(255,255,255,.25);font-family:var(--fm);min-width:28px}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-top">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="24" height="24" rx="3" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
        <circle cx="8" cy="9" r="1.8" fill="white"/>
        <circle cx="8" cy="16" r="1.8" fill="white"/>
        <rect x="11" y="12" width="5.5" height="1.5" rx=".75" fill="white"/>
        <rect x="18.5" y="7" width="1.5" height="12" rx=".75" fill="white"/>
      </svg>
      <span class="logo-name">The Boring Investor</span>
    </div>
    <div style="display:flex;gap:4px;margin:0 auto 0 16px">
      <button id="onb-lang-ca" onclick="setOnbLang('ca')" style="padding:2px 8px;border-radius:4px;font-size:10px;font-weight:500;cursor:pointer;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:white;font-family:var(--fb);transition:all .12s">CA</button>
      <button id="onb-lang-es" onclick="setOnbLang('es')" style="padding:2px 8px;border-radius:4px;font-size:10px;font-weight:500;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:transparent;color:rgba(255,255,255,.4);font-family:var(--fb);transition:all .12s">ES</button>
    </div>
    <div class="prog-info">
      <span class="time-pill" id="time-pill">~5 min</span>
      <span class="prog-label" id="prog-label">0 de 23</span>
      <span class="prog-pct" id="prog-pct">0%</span>
    </div>
  </div>
  <div class="prog-bar-wrap">
    <div class="prog-bar-fill" id="prog-fill" style="width:0%"></div>
    <div class="prog-dim-marks">
      <div class="prog-dim-mark"></div><div class="prog-dim-mark"></div>
      <div class="prog-dim-mark"></div><div class="prog-dim-mark"></div>
      <div class="prog-dim-mark"></div><div class="prog-dim-mark"></div>
      <div class="prog-dim-mark"></div><div class="prog-dim-mark"></div>
    </div>
  </div>
</header>

<div class="main">
  <div class="stage" id="stage">
    <div class="q-wrap" id="q-wrap"></div>
  </div>
  <div class="nav">
    <button class="btn-back" id="btn-back" onclick="prev()">← Enrere</button>
    <span class="kb-hint" id="kb-hint"></span>
    <button class="btn-next" id="btn-next" onclick="next()" disabled>Continuar →</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

// Textos UI en castellà
const UI_ES = {

function setOnbLang(lang) {
  ONB_LANG = lang;
  localStorage.setItem('onb_lang', lang);
  // Actualitzar botons
  const ca = document.getElementById('onb-lang-ca');
  const es = document.getElementById('onb-lang-es');
  if (ca) {
    ca.style.background = lang==='ca' ? 'rgba(255,255,255,.15)' : 'transparent';
    ca.style.color      = lang==='ca' ? 'white' : 'rgba(255,255,255,.4)';
    ca.style.borderColor= lang==='ca' ? 'rgba(255,255,255,.3)' : 'rgba(255,255,255,.1)';
  }
  if (es) {
    es.style.background = lang==='es' ? 'rgba(255,255,255,.15)' : 'transparent';
    es.style.color      = lang==='es' ? 'white' : 'rgba(255,255,255,.4)';
    es.style.borderColor= lang==='es' ? 'rgba(255,255,255,.3)' : 'rgba(255,255,255,.1)';
  }
  // Re-renderitzar pregunta actual
  render('none');
}

      {sym:'—',lbl:'No prioritari',txt:'Prefereixo el millor retorn possible.',s:1},
      {sym:'~',lbl:'Una mica',txt:'Evitaria els sectors més controvertits.',s:2},
      {sym:'◕',lbl:'Important',txt:'Prefereixo ESG si el retorn és similar.',s:3},
      {sym:'●',lbl:'Fonamental',txt:'Molt important. Puc sacrificar retorn pels valors.',s:4},
    ]},

  {type:'cartera',id:'cartera',dim:'Cartera actual',dn:8,
    text:'Tens alguna inversió o estalvi en marxa? Afegeix el que tens (opcional).'},

  {type:'result',id:'result',dn:9},
];

const TOTAL = QS.length;

// ════════════════════════════════════════════
// ESTAT
// ════════════════════════════════════════════
let cur = 0;
let ans = {};
let txt = {};
let actius = [{nom:'',pct:'',plat:''}];
let going = false;
let _dadesEnviades = false;

function calcScore(){ return Object.keys(ans).filter(k=>!k.includes('_raw')).reduce((s,k)=>s+ans[k],0); }
function getArquetip(sc){ return ARQUETIPS.find(a=>sc>=a.min)||ARQUETIPS[ARQUETIPS.length-1]; }

// ════════════════════════════════════════════
// PROGRÉS
// ════════════════════════════════════════════
function updateProg(){
  const isResult = QS[cur] && QS[cur].type==='result';
  const pct = isResult ? 100 : Math.round(cur/(TOTAL-1)*100);
  const labelNum = isResult ? TOTAL : cur;
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-pct').textContent = pct+'%';
  document.getElementById('prog-label').textContent = labelNum+' '+uiT('de_label')+' '+TOTAL;
  const mins = Math.max(1, Math.ceil((TOTAL-cur)*0.18));
  document.getElementById('time-pill').textContent = isResult?'':cur===0?'~5 min':mins===1?'<1 min':mins+' min';
}

// ════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════
function render(dir){
  const wrap = document.getElementById('q-wrap');
  if(dir!=='none'){
    wrap.classList.add(dir==='fwd'?'out-l':'out-r');
    setTimeout(()=>{
      wrap.classList.remove('out-l','out-r');
      wrap.classList.add('in-r');
      wrap.innerHTML = buildQ(QS[cur]);
      requestAnimationFrame(()=>{ wrap.classList.remove('in-r'); });
      finish();
    },170);
  } else {
    wrap.innerHTML = buildQ(QS[cur]);
    finish();
  }
  function finish(){
    updateProg();
    updateNav();
    attachEv(QS[cur]);
    // Scroll al principi sempre que canvia de pantalla
    const stage = document.querySelector('.stage');
    if(stage) stage.scrollTop = 0;
    window.scrollTo(0,0);
    if(QS[cur].type==='result') setTimeout(initRadar, 150);
  }
}

function buildQ(q){
  if(q.type==='result') return buildResult();
  const d=`<div class="dim-tag">${q.dim}</div>`;

  if(q.type==='text') return `${d}
    <div class="q-text">${q.text}</div>
    <input class="form-inp" id="inp-${q.id}" type="${q.isEmail?'email':'text'}"
      placeholder="${q.ph}" value="${txt[q.id]||''}"
      autocomplete="${q.id==='nom'?'given-name':'email'}">`;

  if(q.type==='choice') return `${d}
    <div class="q-text">${q.text}</div>
    <div class="opts">${q.opts.map((o,i)=>`
      <div class="opt${ans[q.id]===o.s?' sel':''}" onclick="pick(this,'${q.id}',${o.s})">
        <div class="opt-sym">${o.sym}</div>
        <div><div class="opt-lbl">${getOptLbl(q,i)}</div><div class="opt-txt">${getOptTxt(q,i)}</div></div>
      </div>`).join('')}</div>`;

  if(q.type==='slider'){
    const raw = ans[q.id+'_raw']!==undefined ? ans[q.id+'_raw'] : q.min;
    return `${d}
      <div class="q-text">${q.text}</div>
      <div class="slider-wrap">
        <div class="slider-lbls">${q.lbls.map(l=>`<span>${l}</span>`).join('')}</div>
        <input type="range" min="${q.min}" max="${q.max}" step="${q.step}" value="${raw}" id="sl-${q.id}" oninput="onSl(this,'${q.id}')">
        <div class="slider-readout">
          <span class="slider-num" id="sv-${q.id}">${raw}</span>
          <span class="slider-unit">${q.unit}</span>
        </div>
        <div class="slider-desc" id="sd-${q.id}">${q.describe(raw)}</div>
      </div>`;
  }

  if(q.type==='cartera') return `${d}
    <div class="q-text">${q.text}</div>
    <div class="actiu-hdr">
      <span class="form-lbl" style="padding:0 2px">Producte</span>
      <span class="form-lbl" style="text-align:center">%</span>
      <span class="form-lbl" style="padding:0 2px">Plataforma</span>
      <span></span>
    </div>
    <div id="aw">${renderActius()}</div>
    <button class="btn-add" onclick="addA()">+ Afegir producte</button>
    <textarea class="inp-sm" id="obs" placeholder="Observacions sobre la teva cartera actual (opcional)..." style="margin-top:10px;min-height:58px;resize:none;width:100%;" oninput="txt.obs=this.value">${txt.obs||''}</textarea>`;

  return '';
}

function renderActius(){
  return actius.map((a,i)=>`
    <div class="actiu-row">
      <input class="inp-sm" placeholder="Ex: Fons MSCI World" value="${a.nom}" oninput="actius[${i}].nom=this.value">
      <input class="inp-sm center" type="number" placeholder="%" min="0" max="100" value="${a.pct}" oninput="actius[${i}].pct=this.value">
      <input class="inp-sm" placeholder="Ex: Finizens" value="${a.plat}" oninput="actius[${i}].plat=this.value">
      <button class='btn-rm' id='rm-${i}' onclick='rmA(${i})'>×</button>
    </div>`).join('');
}

const PORTRAITS={
  estoic:'https://theboringinvestor.github.io/assessoria/portraits/estoic.png',
  explorador:'https://theboringinvestor.github.io/assessoria/portraits/explorador.png',
  navegant:'https://theboringinvestor.github.io/assessoria/portraits/navegant.png',
  arquitecte:'https://theboringinvestor.github.io/assessoria/portraits/arquitecte.png',
  tresorer:'https://theboringinvestor.github.io/assessoria/portraits/tresorer.png',
  cronista:'https://theboringinvestor.github.io/assessoria/portraits/cronista.png',
  alquimista:'https://theboringinvestor.github.io/assessoria/portraits/alquimista.png',
  eremita:'https://theboringinvestor.github.io/assessoria/portraits/eremita.png'
};

function buildResult(){
  const sc = calcScore();
  const ar = getArquetip(sc);
  const pSrc = PORTRAITS[ar.id] || null;
  const maxSc = 84;
  const pct = Math.round(sc/maxSc*100);
  const dims=[1,2,3,4,5,6,7].map(dn=>{
    const qs=QS.filter(q=>q.dn===dn);
    const sum=qs.reduce((s,q)=>s+(ans[q.id]||0),0);
    const max=qs.length*4;
    return {sum,max,pct:max?Math.round(sum/max*100):0};
  });
  const dlbls=['Obj','Sit','Hor','Con','Risc F','Risc E','Pref'];
  const cd = CARTERES_DESC[ar.cartera]||'';
  return `<div class="result-outer">
    <div class="result-eyebrow">${uiT('result_eyebrow')}</div>
      <div class="result-img-wrap">
      ${pSrc?`<img class="result-img" src="${pSrc}" alt="${ar.nom}" onerror="this.parentElement.innerHTML='<div class=result-av>'+ar.nom.split(' ').map(w=>w[0]).join('').slice(0,2)+'</div>'"/>`:
      `<div class="result-av">${ar.nom.split(' ').map(w=>w[0]).join('').slice(0,2)}</div>`}
    </div>
    <div class="result-nom">${ar.nom}</div>
    <div class="result-ep">${ar.ep}</div>
    <div class="result-score-row">
      <span class="result-score-num">${sc} / ${maxSc} pts</span>
      <div class="result-score-track"><div class="result-score-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="result-lema">"${ar.lema}"</div>
    <div class="result-desc">${ar.desc}</div>
    <div class="result-cartera-lbl">Cartera recomanada</div>
    <div class="result-cartera-tag">
      <span style="font-family:var(--fm);font-size:11px;color:rgba(255,255,255,.45)">${ar.cartera}</span>
      <span style="width:1px;height:12px;background:rgba(255,255,255,.2)"></span>
      <span style="font-size:12px;color:rgba(255,255,255,.6)">${ar.cartDesc||cd}</span>
    </div>
    <div style="margin-bottom:18px">
      ${ar.alloc?ar.alloc.map(b=>`
        <div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06)">
          <div style="width:${b.p*0.8}px;max-width:80px;height:3px;background:rgba(255,255,255,.5);border-radius:99px;flex-shrink:0"></div>
          <span style="font-size:11px;color:rgba(255,255,255,.55);flex:1">${b.n}</span>
          <span style="font-family:var(--fm);font-size:11px;color:rgba(255,255,255,.4)">${b.p}%</span>
        </div>`).join(''):''}
      ${(ar.ter||ar.retorn)?'<div style="display:flex;gap:16px;margin-top:10px">'+(ar.ter?'<span style="font-size:10px;color:rgba(255,255,255,.3)">TER '+ar.ter+'</span>':'')+(ar.retorn?'<span style="font-size:10px;color:rgba(255,255,255,.3)">Retorn esperat '+ar.retorn+'</span>':'')+'</div>':''}
    </div>
    <div style="font-size:10px;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">${uiT('perf_de_7_dims')}</div>
    <div class="radar-section" style="padding-top:0;border-top:none">
      <div class="radar-wrap" style="max-width:320px;height:300px;margin:0 auto">
        <canvas id="radarChart"></canvas>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:14px">
        ${dims.map((d,i)=>'<div style="display:flex;align-items:center;gap:7px;padding:4px 0"><div style="width:'+(d.pct*0.5)+'px;max-width:50px;height:2px;background:rgba(255,255,255,0.45);border-radius:99px;flex-shrink:0"></div><span style="font-size:10px;color:rgba(255,255,255,.4);flex:1">'+dlbls[i]+'</span><span style="font-size:10px;color:rgba(255,255,255,.55);font-family:var(--fm)">'+d.sum+'/'+d.max+'</span></div>').join('')}
      </div>
    </div>
    <div class="result-btns">
      <button id="btn-enviar" class="btn-dl" onclick="enviarITancar()">
        ${uiT('send_btn')}
      </button>
      <button class="btn-secondary" onclick="nomesDL()">
        ${uiT('download_btn')}
      </button>
      <button class="btn-reset" onclick="reiniciar()">
        ${uiT('restart_btn')}
      </button>
    </div>

  </div>`;
}

// ════════════════════════════════════════════
// INTERACCIONS
// ════════════════════════════════════════════
function pick(el,qid,score){
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  ans[qid]=score;
  document.getElementById('btn-next').disabled=false;
  setTimeout(()=>{ if(ans[qid]===score) next(); },460);
}

function onSl(el,qid){
  const v=parseInt(el.value);
  const q=QS.find(x=>x.id===qid);
  if(!q) return;
  ans[qid]=q.toScore(v);
  ans[qid+'_raw']=v;
  document.getElementById('sv-'+qid).textContent=v;
  document.getElementById('sd-'+qid).textContent=q.describe(v);
  document.getElementById('btn-next').disabled=false;
}

function addA(){ actius.push({nom:'',pct:'',plat:''}); document.getElementById('aw').innerHTML=renderActius(); }
function rmA(i){ if(actius.length<=1) return; actius.splice(i,1); document.getElementById('aw').innerHTML=renderActius(); }

function attachEv(q){
  if(q.type==='text'){
    const inp=document.getElementById('inp-'+q.id);
    if(!inp) return;
    inp.focus();
    inp.addEventListener('input',()=>{
      txt[q.id]=inp.value.trim();
      document.getElementById('btn-next').disabled=(q.req&&!inp.value.trim());
    });
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') next(); });
  }
  if(q.type==='slider'){
    document.getElementById('btn-next').disabled=false;
    if(ans[q.id]===undefined){
      const sl=document.getElementById('sl-'+q.id);
      if(sl){ const v=parseInt(sl.value); ans[q.id]=q.toScore(v); ans[q.id+'_raw']=v; }
    }
  }
}

function updateNav(){
  const q=QS[cur];
  const nb=document.getElementById('btn-next');
  const bb=document.getElementById('btn-back');
  bb.style.visibility=cur===0?'hidden':'visible';
  if(q.type==='result'){ nb.textContent=uiT('back_web_btn'); nb.disabled=false; return; }
  nb.textContent=uiT('next_btn');
  if(q.type==='choice') nb.disabled=ans[q.id]===undefined;
  else if(q.type==='text') nb.disabled=(q.req&&!txt[q.id]);
  else nb.disabled=false;
  const kbh = document.getElementById('kb-hint');
  if(kbh) kbh.textContent = q.type==='result' ? '' : uiT('press_enter');
  const btnBack = document.getElementById('btn-back');
  if(btnBack) btnBack.textContent = uiT('back_btn');
}

// ════════════════════════════════════════════
// NAVEGACIÓ
// ════════════════════════════════════════════
function next(){
  if(going) return;
  const q=QS[cur];
  if(q.type==='text'){
    const v=txt[q.id]||'';
    if(q.req&&!v){ toast(uiT('obligatori')); return; }
    if(q.isEmail&&v&&!v.includes('@')){ toast(uiT('email_invalid')); return; }
  }
  if(q.type==='result'){
    // Si no s'ha enviat encara, enviar primer
    // El botó "Tornar a la web" al nav simplement redirigeix
    window.location.href = 'https://theboringinvestor.github.io/assessoria/';
    return;
  }
  going=true;
  cur++;
  render('fwd');
  setTimeout(()=>going=false,280);
}

function prev(){
  if(going||cur===0) return;
  going=true;
  cur--;
  render('bwd');
  setTimeout(()=>going=false,280);
}

// ════════════════════════════════════════════
// DESCÀRREGA
// ════════════════════════════════════════════
function enviarITancar(){
  // Envia al Google Sheets i redirigeix
  const btn = document.getElementById('btn-enviar');
  if(btn) { btn.textContent = uiT('sending'); btn.disabled = true; btn.classList.add('sent'); }
  descarregar(); // crida l'enviament a Sheets + descàrrega JSON
  setTimeout(() => {
    window.location.href = 'https://theboringinvestor.github.io/assessoria/';
  }, 2500);
}

function nomesDL(){
  // Només descarrega el JSON, sense enviar ni redirigir
  const sc = calcScore();
  const ar = getArquetip(sc);
  const dims = [1,2,3,4,5,6,7].map(dn => {
    const qs = QS.filter(q=>q.dn===dn);
    return {dimensio:dn, sum:qs.reduce((s,q)=>s+(ans[q.id]||0),0), max:qs.length*4};
  });
  const data = {
    versio:'3.0', tipus:'client_onboarding',
    data: new Date().toISOString(),
    app: 'The Boring Investor — Qüestionari v3',
    client:{nom:txt.nom||'—',email:txt.email||'—',capitalInicial:'—',aportacioMensual:'—',horitzo:'—',objectiu:'—'},
    perfil:{scoreTotal:sc,scoreMax:84,arquetip:ar.nom,carteraRecomanada:ar.perfil,cartLabel:ar.cartera,desc:ar.desc,lema:ar.lema,perDimensio:dims,respostesDetall:ans},
    carteraActual:{actius:actius.filter(a=>a.nom),observacions:txt.obs||'—'}
  };
  descarregarJSON(data);
  toast(uiT('download_ok'));
}

function descarregar(){
  const sc=calcScore();
  const ar=getArquetip(sc);
  const dims=[1,2,3,4,5,6,7].map(dn=>{
    const qs=QS.filter(q=>q.dn===dn);
    return {dimensio:dn,sum:qs.reduce((s,q)=>s+(ans[q.id]||0),0),max:qs.length*4};
  });
  const actuActius=actius.filter(a=>a.nom);
  const data={
    versio:'3.0',tipus:'client_onboarding',
    data:new Date().toISOString(),
    app:'The Boring Investor — Qüestionari v3',
    client:{nom:txt.nom||'—',email:txt.email||'—',capitalInicial:'—',aportacioMensual:'—',horitzo:'—',objectiu:'—'},
    perfil:{scoreTotal:sc,scoreMax:84,arquetip:ar.nom,carteraRecomanada:ar.perfil,cartLabel:ar.cartera,desc:ar.desc,lema:ar.lema,perDimensio:dims,respostesDetall:ans},
    carteraActual:{actius:actuActius,observacions:txt.obs||'—'}
  };
  enviarASheets(data);
}

function enviarASheets(data){
  const sheetsUrl = "https://script.google.com/macros/s/AKfycbwJ4C3NiKbK3bVsigAQitWfjwOvk7779r7nAi9AhTMkqkd9dcuZvMKzlaTUsZq3pjbH/exec";
  const payload = {
    data: data.data,
    nom: data.client.nom,
    email: data.client.email,
    arquetip: data.perfil.arquetip,
    cartera: data.perfil.cartLabel,
    score: data.perfil.scoreTotal,
    capitalInicial: data.client.capitalInicial,
    aportacioMensual: data.client.aportacioMensual,
    horitzo: data.client.horitzo,
    objectiu: data.client.objectiu,
    scoreTotal: data.perfil.scoreTotal + '/' + data.perfil.scoreMax,
    carteraActual: data.carteraActual.actius.map(a=>a.nom).join(', ') || '—',
    respostes: JSON.stringify(data.perfil.respostesDetall)
  };

  // Mostrar loading
  const btn = document.getElementById('btn-next');
  const originalText = btn ? btn.textContent : '';
  if(btn) btn.textContent = 'Enviant...';

  fetch(sheetsUrl, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  })
  .then(() => {
    _dadesEnviades = true;
    toast("Perfil enviat a l'assessor!");
    if(btn) btn.textContent = originalText;
    // Descàrrega automàtica com a còpia
    descarregarJSON(data);
  })
  .catch(() => {
    toast("Error enviant. Descarregant copia...");
    if(btn) btn.textContent = originalText;
    descarregarJSON(data);
  });
}

function descarregarJSON(data){
  const nom=(data.client.nom||'client').replace(/\s+/g,'_').toLowerCase();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='perfil_'+nom+'_'+new Date().toISOString().split('T')[0]+'.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function reiniciar(){
  if(!confirm('Vols esborrar totes les respostes i tornar a començar?')) return;
  [ans,txt].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));
  actius=[{nom:'',pct:'',plat:''}];
  cur=0;
  render('none');
  updateLangToggle && updateLangToggle();
  // Restaurar llengua onboarding
  ONB_LANG = localStorage.getItem('onb_lang') || 'ca';
  setOnbLang(ONB_LANG);
}

function initRadar(){
  const sc=calcScore();
  const ar=getArquetip(sc);
  const dims=[1,2,3,4,5,6,7].map(dn=>{
    const qs=QS.filter(q=>q.dn===dn);
    const sum=qs.reduce((s,q)=>s+(ans[q.id]||0),0);
    const max=qs.length*4;
    return {sum,max,pct:max?Math.round(sum/max*100):0};
  });
  const dlbls=['Objectius','Situació','Horitzó','Coneixement','Risc fin.','Risc em.','Preferències'];
  const canvas=document.getElementById('radarChart');
  if(!canvas||typeof Chart==='undefined') return;
  if(window._radarInst) window._radarInst.destroy();
  window._radarInst=new Chart(canvas,{
    type:'radar',
    data:{
      labels:dlbls,
      datasets:[
        {
          label:'El teu perfil',
          data:dims.map(d=>d.sum),
          borderColor:'rgba(255,255,255,0.85)',
          backgroundColor:'rgba(255,255,255,0.09)',
          borderWidth:2,
          pointBackgroundColor:'rgba(255,255,255,1)',
          pointBorderColor:'rgba(255,255,255,0.3)',
          pointRadius:4,
          pointHoverRadius:6,
        },
        {
          label:'Màxim possible',
          data:dims.map(d=>d.max),
          borderColor:'rgba(255,255,255,0.1)',
          backgroundColor:'rgba(255,255,255,0.02)',
          borderWidth:1,
          borderDash:[4,4],
          pointRadius:0,
        }
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            label:function(ctx){
              const d=dims[ctx.dataIndex];
              return ctx.dataset.label+': '+d.sum+'/'+d.max+' ('+d.pct+'%)';
            }
          }
        }
      },
      scales:{r:{
        min:0,
        max:Math.max(...dims.map(d=>d.max)),
        ticks:{
          stepSize:3,
          color:'rgba(255,255,255,0.18)',
          backdropColor:'transparent',
          font:{size:9}
        },
        grid:{color:'rgba(255,255,255,0.08)'},
        pointLabels:{
          color:'rgba(255,255,255,0.5)',
          font:{size:11,weight:'500'}
        },
        angleLines:{color:'rgba(255,255,255,0.08)'}
      }}
    }
  });
}

let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  if(toastT) clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),2800);
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){
    if(['TEXTAREA'].includes(document.activeElement.tagName)) return;
    if(document.activeElement.type==='range') return;
    if(!document.getElementById('btn-next').disabled) next();
  }
  if(e.key==='ArrowLeft'&&document.activeElement.tagName!=='INPUT') prev();
});
