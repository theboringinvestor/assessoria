<!DOCTYPE html>
<html lang="ca" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Boring Investor — El teu perfil</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black:#0A0A0A; --white:#FFFFFF; --bg:#F7F6F4;
  --g100:#F4F3F0; --g200:#E8E6E1; --g300:#C8C5BE;
  --g400:#9A9690; --g500:#6B6762; --g700:#3A3835;
  --accent:#1B3A6B; --accent-l:#EBF0FA;
  --green:#1A5C3A; --green-l:#EAF3DE;
  --amber:#7A4A00; --amber-l:#FEF5E7;
  --red:#8B1A1A; --red-l:#FDF0F0;
  --fd:'Playfair Display',Georgia,serif;
  --fb:'DM Sans',system-ui,sans-serif;
  --fm:'DM Mono',monospace;
  --ease:cubic-bezier(.4,0,.2,1);
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow:hidden}body{height:100%;overflow:hidden;font-family:var(--fb);background:var(--bg);color:var(--black);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

/* HEADER */
.hdr{background:var(--white);border-bottom:1px solid var(--g200);flex-shrink:0}
.hdr-top{display:flex;align-items:center;padding:0 28px;height:52px}
.logo{display:flex;align-items:center;gap:9px}
.logo-name{font-size:13px;font-weight:500;color:var(--black)}
.prog-info{display:flex;align-items:center;gap:10px;margin-left:auto}
.time-pill{font-size:11px;padding:3px 8px;background:var(--g100);border-radius:99px;color:var(--g500)}
.prog-label{font-size:11px;color:var(--g400);font-family:var(--fm)}
.prog-pct{font-size:11px;font-weight:500;color:var(--accent);font-family:var(--fm)}
.prog-bar-wrap{height:3px;background:var(--g200)}
.prog-bar-fill{height:100%;background:var(--accent);transition:width .4s var(--ease)}

/* STAGE */
.stage{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:28px 20px 40px;overflow-y:auto;overflow-x:hidden;min-height:0}
.stage.is-pregunta{align-items:center}
.q-wrap{width:100%;max-width:600px}
.out-l{animation:outL .17s var(--ease) forwards}
.in-r{animation:inR .17s var(--ease) forwards}
.out-r{animation:outR .17s var(--ease) forwards}
@keyframes outL{to{opacity:0;transform:translateX(-18px)}}
@keyframes inR{from{opacity:0;transform:translateX(18px)}}
@keyframes outR{to{opacity:0;transform:translateX(18px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .4s ease-out}

/* CARD */
.q-card{background:var(--white);border:1px solid var(--g200);border-radius:14px;padding:32px 36px;box-shadow:0 2px 20px rgba(0,0,0,.05)}
.dim-tag{font-size:10px;font-weight:500;color:var(--accent);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px}
.q-text{font-family:var(--fd);font-size:clamp(17px,2.8vw,23px);font-weight:400;line-height:1.4;color:var(--black);margin-bottom:24px;letter-spacing:-.2px}

/* OPCIONS */
.opts-grid{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:start;gap:12px;padding:13px 16px;border:1.5px solid var(--g200);border-radius:10px;cursor:pointer;transition:all .15s;background:var(--white)}
.opt:hover{border-color:var(--accent);background:var(--accent-l)}
.opt.sel{border-color:var(--accent);background:var(--accent-l)}
.opt-sym{font-size:16px;font-weight:600;color:var(--accent);min-width:28px;text-align:center;line-height:1.5;flex-shrink:0}
.opt-lbl{font-size:12px;font-weight:600;color:var(--black);margin-bottom:2px}
.opt-txt{font-size:12px;color:var(--g500);line-height:1.5}

/* TEXT INPUT */
.form-inp{width:100%;padding:14px 16px;border:1.5px solid var(--g200);border-radius:10px;font-size:18px;font-family:var(--fb);background:var(--white);color:var(--black);outline:none;transition:border-color .15s}
.form-inp:focus{border-color:var(--accent)}

/* SLIDER */
.slider-wrap{display:flex;flex-direction:column;gap:12px}
.slider-lbls{display:flex;justify-content:space-between;font-size:11px;color:var(--g400)}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:var(--g200);border-radius:99px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--white);box-shadow:0 0 0 1px var(--accent)}
.slider-readout{display:flex;align-items:baseline;gap:4px}
.slider-num{font-family:var(--fm);font-size:28px;font-weight:500;color:var(--accent)}
.slider-unit{font-size:14px;color:var(--g400)}
.slider-desc{font-size:12px;color:var(--g500);line-height:1.5;padding:10px 14px;background:var(--g100);border-radius:8px}

/* CARTERA */
.actiu-hdr,.actiu-row{display:grid;grid-template-columns:1fr 76px 1fr 28px;gap:8px;align-items:center;margin-bottom:8px}
.form-lbl{font-size:10px;font-weight:500;color:var(--g400);text-transform:uppercase;letter-spacing:.07em}
.actiu-inp{padding:8px 10px;border:1.5px solid var(--g200);border-radius:8px;font-size:13px;font-family:var(--fb);background:var(--white);color:var(--black);outline:none;transition:border-color .15s}
.actiu-inp:focus{border-color:var(--accent)}
.actiu-pct{font-family:var(--fm);font-size:12px;font-weight:500;color:var(--accent);text-align:right}
.pct-bar-wrap{height:3px;background:var(--g100);border-radius:99px;overflow:hidden;margin-top:3px}
.pct-bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.actiu-del{background:none;border:none;color:var(--g300);cursor:pointer;font-size:15px;padding:0;line-height:1}
.actiu-del:hover{color:var(--red)}
.cartera-total-row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--g200);margin-top:4px;font-size:12px}
.btn-afegir{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1.5px dashed var(--g300);border-radius:8px;background:transparent;color:var(--g500);font-size:12px;cursor:pointer;font-family:var(--fb);transition:all .15s;margin-top:4px}
.btn-afegir:hover{border-color:var(--accent);color:var(--accent)}
.cartera-obs-inp{width:100%;padding:10px 12px;border:1.5px solid var(--g200);border-radius:8px;font-size:12px;font-family:var(--fb);background:var(--white);color:var(--black);resize:vertical;min-height:56px;outline:none;transition:border-color .15s;margin-top:10px}
.cartera-obs-inp:focus{border-color:var(--accent)}

/* RESULT */
.res-wrap{display:flex;flex-direction:column;gap:16px}
.res-hero{border-radius:14px;overflow:hidden;background:var(--black);display:flex;align-items:stretch;min-height:160px}
.res-img{width:130px;flex-shrink:0;overflow:hidden}
.res-img img{width:100%;height:100%;object-fit:cover;filter:grayscale(100%) contrast(1.1)}
.res-av{width:130px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:38px;color:rgba(255,255,255,.25);font-family:var(--fd)}
.res-body{flex:1;padding:22px 26px;display:flex;flex-direction:column;justify-content:center}
.res-eyebrow{font-size:9px;font-weight:500;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
.res-nom{font-family:var(--fd);font-size:clamp(20px,3.5vw,28px);font-weight:400;color:var(--white);line-height:1.1;margin-bottom:5px}
.res-ep{font-size:11px;color:rgba(255,255,255,.4);margin-bottom:12px;font-style:italic}
.res-lema{font-size:12px;color:rgba(255,255,255,.7);line-height:1.6;font-style:italic;border-left:2px solid rgba(255,255,255,.2);padding-left:10px}
.res-desc-block{background:var(--white);border:1px solid var(--g200);border-radius:12px;padding:18px 22px;font-size:13px;color:var(--g500);line-height:1.75}
.res-cartera-block{background:var(--accent);border-radius:12px;padding:18px 22px}
.res-cartera-lbl{font-size:9px;font-weight:500;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
.res-cartera-nom{font-size:15px;font-weight:500;color:var(--white);margin-bottom:3px}
.res-cartera-desc{font-size:11px;color:rgba(255,255,255,.6);margin-bottom:12px}
.res-alloc{display:flex;flex-direction:column;gap:6px}
.res-alloc-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.res-alloc-nom{font-size:11px;color:rgba(255,255,255,.8)}
.res-alloc-bar-wrap{flex:1;height:3px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.res-alloc-bar{height:100%;background:rgba(255,255,255,.55);border-radius:99px}
.res-alloc-pct{font-size:10px;font-family:var(--fm);color:rgba(255,255,255,.55);min-width:28px;text-align:right}
.score-section{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:2px}
.dim-item{text-align:center;padding:9px 4px;background:var(--g100);border-radius:8px}
.dim-val{font-family:var(--fm);font-size:13px;font-weight:500;color:var(--accent);margin-bottom:2px}
.dim-lbl{font-size:9px;color:var(--g400);line-height:1.3}
.radar-block{background:var(--white);border:1px solid var(--g200);border-radius:12px;padding:18px 22px}
.radar-title{font-size:11px;font-weight:500;color:var(--g400);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.radar-wrap{position:relative;width:100%;max-width:260px;margin:0 auto}
.res-actions{display:flex;flex-direction:column;gap:9px;padding-bottom:8px}
.btn-send{width:100%;padding:13px;background:var(--black);color:var(--white);border:none;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fb);transition:opacity .15s}
.btn-send:hover{opacity:.85}
.btn-pdf{width:100%;padding:11px;background:transparent;color:var(--black);border:1.5px solid var(--g200);border-radius:10px;font-size:13px;cursor:pointer;font-family:var(--fb);transition:all .15s}
.btn-pdf:hover{border-color:var(--accent);color:var(--accent)}
.btn-restart{background:none;border:none;font-size:12px;color:var(--g400);cursor:pointer;font-family:var(--fb);text-align:center;padding:4px;transition:color .15s}
.btn-restart:hover{color:var(--black)}
.send-ok{font-size:12px;color:var(--green);text-align:center;padding:6px;font-weight:500}
.send-note{font-size:12px;color:var(--g500);text-align:center;padding:4px}

/* NAVEGACIÓ INFERIOR */
.nav-btns{display:flex;align-items:center;justify-content:space-between;padding:12px 28px;background:var(--white);border-top:1px solid var(--g200);flex-shrink:0}
.btn-back{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fb);background:transparent;color:var(--g500);border:1.5px solid var(--g200);transition:all .15s}
.btn-back:hover{color:var(--black);border-color:var(--black)}
.btn-back[style*="hidden"]{visibility:hidden}
.btn-next{padding:9px 22px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fb);background:var(--accent);color:var(--white);border:none;transition:opacity .15s}
.btn-next:hover{opacity:.88}
.btn-next:disabled{background:var(--g200);color:var(--g400);cursor:default;opacity:1}
.kb-hint{font-size:11px;color:var(--g400)}

/* TOAST */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--black);color:var(--white);padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s var(--ease);z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* HEADER logo fosc → clar */
.logo svg rect{stroke:var(--g300)!important}
.logo svg circle,.logo svg rect:not(:first-child){fill:var(--black)!important}

@media(max-width:600px){
  .q-card{padding:22px 18px;border-radius:12px}
  .res-img,.res-av{width:90px}
  .res-body{padding:16px 16px}
  .hdr-top,.nav-btns{padding:0 16px}
  .stage{padding:20px 14px}
  .score-section{grid-template-columns:repeat(4,1fr)}
}

/* ── RESULT PAGE (classes originals de buildResult) ── */
.result-outer{display:flex;flex-direction:column;gap:14px;padding-bottom:32px;width:100%;max-width:600px}
.res-hero{border-radius:14px;overflow:hidden;background:var(--black);display:flex;min-height:180px}
.res-hero-img{width:140px;flex-shrink:0;overflow:hidden;position:relative}
.res-hero-img img{width:100%;height:100%;object-fit:cover;filter:grayscale(100%) contrast(1.1)}
.res-av{width:140px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:42px;color:rgba(255,255,255,.25);font-family:var(--fd)}
.res-hero-info{flex:1;padding:24px 28px;display:flex;flex-direction:column;justify-content:center}
.res-eyebrow{font-size:9px;font-weight:500;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.res-nom{font-family:var(--fd);font-size:clamp(22px,4vw,30px);font-weight:400;color:var(--white);line-height:1.1;margin-bottom:5px}
.ep{font-size:11px;color:rgba(255,255,255,.4);margin-bottom:14px;font-style:italic}
.lema{font-size:12px;color:rgba(255,255,255,.7);line-height:1.6;font-style:italic;border-left:2px solid rgba(255,255,255,.2);padding-left:12px}
.score{display:flex;align-items:baseline;gap:4px;margin-bottom:8px}
.res-section{background:var(--white);border:1px solid var(--g200);border-radius:12px;padding:18px 22px}
.res-section-title,.section-title{font-size:9px;font-weight:500;color:var(--g400);text-transform:uppercase;letter-spacing:.09em;margin-bottom:12px;border-bottom:1px solid var(--g200);padding-bottom:8px}
.desc{font-size:13px;color:var(--g500);line-height:1.75}
/* Cartera */
.res-cartera-block{background:var(--accent);border-radius:12px;padding:18px 22px}
.res-cartera-lbl{font-size:9px;font-weight:500;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
.res-cartera-nom{font-size:15px;font-weight:500;color:var(--white);margin-bottom:3px}
.res-cartera-desc{font-size:11px;color:rgba(255,255,255,.6);margin-bottom:12px}
.alloc-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.alloc-name{font-size:11px;color:rgba(255,255,255,.8);min-width:140px}
.alloc-bar{flex:1;height:3px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.15)}
.alloc-pct{font-size:10px;font-family:var(--fm);color:rgba(255,255,255,.6);min-width:30px;text-align:right}
/* Dims / Scoring */
.score-section{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:4px}
.dim-item{text-align:center;padding:9px 4px;background:var(--g100);border-radius:8px}
.dim-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dim-name{font-size:11px;color:var(--g500);flex:1}
.dim-bar{flex:1;height:3px;background:var(--g200);border-radius:99px;overflow:hidden}
.dim-val{font-family:var(--fm);font-size:12px;font-weight:500;color:var(--accent);margin-bottom:2px}
.dim-lbl{font-size:9px;color:var(--g400);line-height:1.3}
/* Radar */
.radar-block{background:var(--white);border:1px solid var(--g200);border-radius:12px;padding:18px 22px}
.radar-title{font-size:11px;font-weight:500;color:var(--g400);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.radar-wrap{position:relative;width:100%;max-width:260px;margin:0 auto}
/* Botons */
.result-btns{display:flex;flex-direction:column;gap:9px;padding-bottom:8px;background:var(--bg);border-radius:12px;padding:16px}
.btn-send{width:100%;padding:13px;background:var(--black);color:var(--white);border:none;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fb);transition:opacity .15s}
.btn-send:hover{opacity:.85}
.btn-dl,.btn-secondary{width:100%;padding:12px;background:var(--white);color:var(--black);border:1.5px solid var(--g200);border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fb);transition:all .15s}
.btn-dl:hover,.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-reset{background:none;border:none;font-size:12px;color:var(--g500);cursor:pointer;font-family:var(--fb);text-align:center;padding:6px;transition:color .15s;text-decoration:underline}
.btn-reset:hover{color:var(--black)}
.section{background:var(--white);border:1px solid var(--g200);border-radius:12px;padding:18px 22px}
.footer{font-size:10px;color:var(--g400);text-align:center;padding:8px 0;line-height:1.5}
.send-ok{font-size:12px;color:var(--green);text-align:center;padding:6px}

function setOnbLang(lang) {
  ONB_LANG = lang;
  localStorage.setItem('onb_lang', lang);
  // Actualitzar botons
  const ca = document.getElementById('onb-lang-ca');
  const es = document.getElementById('onb-lang-es');
  if (ca) {
    ca.style.background = lang==='ca' ? 'rgba(255,255,255,.15)' : 'transparent';
    ca.style.color      = lang==='ca' ? 'white' : 'rgba(255,255,255,.4)';
    ca.style.borderColor= lang==='ca' ? 'rgba(255,255,255,.3)' : 'rgba(255,255,255,.1)';
  }
  if (es) {
    es.style.background = lang==='es' ? 'rgba(255,255,255,.15)' : 'transparent';
    es.style.color      = lang==='es' ? 'white' : 'rgba(255,255,255,.4)';
    es.style.borderColor= lang==='es' ? 'rgba(255,255,255,.3)' : 'rgba(255,255,255,.1)';
  }
  // Re-renderitzar pregunta actual
  render('none');
}

function tOnb(key, subkey) {
  if (ONB_LANG === 'ca') return null; // usar el valor original
  if (subkey) return QS_ES[key]?.[subkey] || null;
  return UI_ES[key] || null;
}

function sliderDescribe(q, v) {
  if (ONB_LANG === 'es') {
    if (q.id === 'D2P2') {
      return v<=5?'Muy ajustado — cada euro cuenta':v<=15?'Moderado — tienes algo de margen':v<=30?'Buen margen — puedes invertir cómodamente':'Excelente capacidad de ahorro';
    }
  }
  return q.describe(v);
}

function getQText(q) {
  if (ONB_LANG === 'es' && QS_ES[q.id]) return QS_ES[q.id].text || q.text;
  return q.text;
}
function getQPh(q) {
  if (ONB_LANG === 'es' && QS_ES[q.id]) return QS_ES[q.id].ph || q.ph || '';
  return q.ph || '';
}
function getOptLbl(q, i) {
  if (ONB_LANG === 'es' && QS_ES[q.id]?.opts?.[i]) return QS_ES[q.id].opts[i];
  return q.opts[i].lbl;
}
function getOptTxt(q, i) {
  // Descripció de l'opció — en castellà usem el lbl traduit com a txt
  if (ONB_LANG === 'es' && QS_ES[q.id]?.opts?.[i]) return QS_ES[q.id].opts[i];
  return q.opts[i].txt || q.opts[i].lbl;
}

function calcScore(){ return Object.keys(ans).filter(k=>!k.includes('_raw')).reduce((s,k)=>s+ans[k],0); }
function getArquetip(sc){ return ARQUETIPS.find(a=>sc>=a.min)||ARQUETIPS[ARQUETIPS.length-1]; }

function updateProg(){
  const isResult = QS[cur] && QS[cur].type==='result';
  const pct = isResult ? 100 : Math.round(cur/(TOTAL-1)*100);
  const labelNum = isResult ? TOTAL : cur;
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-pct').textContent = pct+'%';
  document.getElementById('prog-label').textContent = labelNum+' '+uiT('de_label')+' '+TOTAL;
  const mins = Math.max(1, Math.ceil((TOTAL-cur)*0.18));
  document.getElementById('time-pill').textContent = isResult?'':cur===0?'~5 min':mins===1?'<1 min':mins+' min';
}

function getOptTxt(q, idx, o) {
  if (ONB_LANG === 'es' && typeof QS_ES !== 'undefined' && QS_ES[q.id] && QS_ES[q.id].opts && QS_ES[q.id].opts[idx]) {
    return QS_ES[q.id].opts[idx];
  }
  return o.txt;
}

function getSliderDescribe(q, val) {
  if (ONB_LANG === 'es' && typeof QS_ES !== 'undefined' && QS_ES[q.id] && QS_ES[q.id].describes) {
    const d = QS_ES[q.id].describes;
    const v = parseInt(val)||0;
    return v<=5?d[0]:v<=15?d[1]:v<=30?d[2]:d[3];
  }
  return q.toScore ? (parseInt(val)<=5?'Molt ajustat — cada euro compta':parseInt(val)<=15?'Moderat — tens algun marge':parseInt(val)<=30?'Bon marge — pots invertir còmodament':"Excel·lent capacitat d'estalvi") : '';
}

function render(dir){
  const wrap = document.getElementById('q-wrap');
  if(dir!=='none'){
    wrap.classList.add(dir==='fwd'?'out-l':'out-r');
    setTimeout(()=>{
      wrap.classList.remove('out-l','out-r');
      wrap.classList.add('in-r');
      wrap.innerHTML = buildQ(QS[cur]);
      requestAnimationFrame(()=>{ wrap.classList.remove('in-r'); });
      finish();
    },170);
  } else {
    wrap.innerHTML = buildQ(QS[cur]);
    finish();
  }
  function finish(){
    updateProg();
    updateNav();
    attachEv(QS[cur]);
    // Scroll al principi sempre que canvia de pantalla
    const stage = document.querySelector('.stage');
    if(stage) stage.scrollTop = 0;
    window.scrollTo(0,0);
    const stageEl = document.querySelector('.stage');
    if(QS[cur].type==='result'){
      if(stageEl){ stageEl.classList.remove('is-pregunta'); }
      setTimeout(function(){ initRadar(); }, 350);
    } else {
      if(stageEl){ stageEl.classList.add('is-pregunta'); }
    }
  }
}

function buildQ(q){
  if(q.type==='result') return buildResult();
  const d=`<div class="dim-tag">${(ONB_LANG==='es'&&typeof DIM_ES!=='undefined'&&DIM_ES[q.dim])||q.dim}</div>`;

  if(q.type==='text') return `${d}
    <div class="q-text">${(ONB_LANG==='es'&&typeof QS_ES!=='undefined'&&QS_ES[q.id]&&QS_ES[q.id].text)||q.text}</div>
    <input class="form-inp" id="inp-${q.id}" type="${q.isEmail?'email':'text'}"
      placeholder="${(ONB_LANG==='es'&&typeof QS_ES!=='undefined'&&QS_ES[q.id]&&QS_ES[q.id].ph)||q.ph}" value="${txt[q.id]||''}"
      autocomplete="${q.id==='nom'?'given-name':'email'}">`;

  if(q.type==='choice') return `${d}
    <div class="q-text">${q.text}</div>
    <div class="opts">${q.opts.map((o,i)=>`
      <div class="opt${ans[q.id]===o.s?' sel':''}" onclick="pick(this,'${q.id}',${o.s})">
        <div class="opt-sym">${o.sym}</div>
        <div><div class="opt-lbl">${getOptLbl(q,i)}</div><div class="opt-txt">${getOptTxt(q,i,o)}</div></div>
      </div>`).join('')}</div>`;

  if(q.type==='slider'){
    const raw = ans[q.id+'_raw']!==undefined ? ans[q.id+'_raw'] : q.min;
    return `${d}
      <div class="q-text">${q.text}</div>
      <div class="slider-wrap">
        <div class="slider-lbls">${q.lbls.map(l=>`<span>${l}</span>`).join('')}</div>
        <input type="range" min="${q.min}" max="${q.max}" step="${q.step}" value="${raw}" id="sl-${q.id}" oninput="onSl(this,'${q.id}')">
        <div class="slider-readout">
          <span class="slider-num" id="sv-${q.id}">${raw}</span>
          <span class="slider-unit">${q.unit}</span>
        </div>
        <div class="slider-desc" id="sd-${q.id}">${sliderDescribe(q, raw)}</div>
      </div>`;
  }

  if(q.type==='cartera') return `${d}
    <div class="q-text">${q.text}</div>
    <div class="actiu-hdr">
      <span class="form-lbl" style="padding:0 2px">${ONB_LANG==='es'?'Producto':'Producte'}</span>
      <span class="form-lbl" style="text-align:center">%</span>
      <span class="form-lbl" style="padding:0 2px">${ONB_LANG==='es'?'Plataforma':'Plataforma'}</span>
      <span></span>
    </div>
    <div id="aw">${renderActius()}</div>
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
      <button class="btn-add" onclick="addA()">${uiT('cartera_add')}</button>
      <button onclick="normalitzar()" style="padding:5px 10px;border-radius:5px;font-size:10px;cursor:pointer;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.45);font-family:var(--fb)" title="${ONB_LANG==='es'?'Repartir proporcionalmente hasta 100%':'Repartir proporcionalment fins a 100%'}">= 100%</button>
    </div>
    <textarea class="inp-sm" id="obs" placeholder="${uiT('cartera_obs')}" style="margin-top:10px;min-height:58px;resize:none;width:100%;" oninput="txt.obs=this.value">${txt.obs||''}</textarea>`;

  return '';
}

function getTotal(){ return actius.reduce((s,a)=>s+(parseFloat(a.pct)||0),0); }

function renderActius(){
  const total = getTotal();
  const ok    = Math.abs(total-100)<1;
  const rows  = actius.map((a,i)=>{
    const pct = parseFloat(a.pct)||0;
    return '<div class="actiu-row" style="flex-direction:column;gap:4px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)">'
      +'<div style="display:flex;align-items:center;gap:8px">'
      +'<input class="inp-sm" style="flex:1" placeholder="'+uiT('cartera_placeholder')+'" value="'+a.nom+'" oninput="actius['+i+'].nom=this.value">'
      +'<input class="inp-sm" style="width:60px;text-align:center;font-family:var(--fm)" type="number" placeholder="%" min="0" max="100" step="5" value="'+a.pct+'" oninput="actius['+i+'].pct=this.value;refreshActius()">'
      +'<button class="btn-rm" onclick="rmA('+i+')">×</button>'
      +'</div>'
      +(pct>0?'<div style="height:3px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin:0 2px">'
        +'<div style="width:'+Math.min(100,pct)+'%;height:100%;background:rgba(255,255,255,.4);border-radius:99px;transition:width .2s"></div>'
        +'</div>':'')
      +'</div>';

function getCarteraByProfile() {
  var sc = calcScore();
  var d8p1 = ans['D8P1'] || 2;  // etapa vital (1=pre-retir, 4=inici)
  var d8p2 = ans['D8P2'] || 3;  // horitzó retir
  var d9p1 = ans['D9P1'] || 1;  // obertura alternatius
  var d9p2 = ans['D9P2'] || 1;  // experiència alternatius
  var d9p3 = ans['D9P3'] || 1;  // % màxim alternatius

  var d9total = d9p1 + d9p2 + d9p3;  // 3-12
  var esJove  = d8p1 >= 3;             // Inici o Acumulació
  var preRetir= d8p1 <= 1 || d8p2 <= 1; // Pre-retir o retir proper
  var altHigh = d9total >= 9;           // Molt interessat en alternatius
  var altMed  = d9total >= 6;           // Moderat
  var altZero = d9total <= 4;           // No alternatius

  // Assignació per perfil D8+D9
  if (preRetir && altZero)            return 'X \u00b7 La Renda';
  if (preRetir)                       return 'V \u00b7 La Muralla';
  if (esJove && altHigh && sc >= 77)  return 'IX \u00b7 El Pionier';
  if (esJove && altMed && sc >= 64)   return "VII \u00b7 L'Alam\u00ed";
  if (altHigh && sc >= 90)            return 'TBI \u00b7 The Boring Investor';
  if (altMed && sc >= 77)             return 'II \u00b7 La Caravella';
  if (altZero && sc >= 90)            return 'I \u00b7 La Catapulta';
  if (sc >= 64)                       return 'III \u00b7 El Gale\u00f3';
  if (sc >= 54)                       return 'IV \u00b7 La Catedral';
  if (sc >= 33)                       return 'VI \u00b7 El Scriptorium';

function pick(el,qid,score){
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  ans[qid]=score;
  document.getElementById('btn-next').disabled=false;
  setTimeout(()=>{ if(ans[qid]===score) next(); },460);
}

function onSl(el,qid){
  const v=parseInt(el.value);
  const q=QS.find(x=>x.id===qid);
  if(!q) return;
  ans[qid]=q.toScore(v);
  ans[qid+'_raw']=v;
  document.getElementById('sv-'+qid).textContent=v;
  document.getElementById('sd-'+qid).textContent=q.describe(v);
  document.getElementById('btn-next').disabled=false;
}

function addA(){ actius.push({nom:'',pct:'',plat:''}); refreshActius(); }
function rmA(i){ if(actius.length<=1){ actius[0]={nom:'',pct:'',plat:''}; }else{ actius.splice(i,1); } refreshActius(); }

function attachEv(q){
  if(q.type==='text'){
    const inp=document.getElementById('inp-'+q.id);
    if(!inp) return;
    inp.focus();
    inp.addEventListener('input',()=>{
      txt[q.id]=inp.value.trim();
      document.getElementById('btn-next').disabled=(q.req&&!inp.value.trim());
    });
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') next(); });
  }
  if(q.type==='slider'){
    document.getElementById('btn-next').disabled=false;
    if(ans[q.id]===undefined){
      const sl=document.getElementById('sl-'+q.id);
      if(sl){ const v=parseInt(sl.value); ans[q.id]=q.toScore(v); ans[q.id+'_raw']=v; }
    }
  }
}

function updateNav(){
  const q=QS[cur];
  const nb=document.getElementById('btn-next');
  const bb=document.getElementById('btn-back');
  bb.style.visibility=cur===0?'hidden':'visible';
  if(q.type==='result'){ nb.textContent=uiT('back_web_btn'); nb.disabled=false; return; }
  nb.textContent=uiT('next_btn');
  if(q.type==='choice') nb.disabled=ans[q.id]===undefined;
  else if(q.type==='text') nb.disabled=(q.req&&!txt[q.id]);
  else nb.disabled=false;
  const kbh = document.getElementById('kb-hint');
  if(kbh) kbh.textContent = q.type==='result' ? '' : uiT('press_enter');
  const btnBack = document.getElementById('btn-back');
  if(btnBack) btnBack.textContent = uiT('back_btn');
}

// ════════════════════════════════════════════
function next(){
  if(going) return;
  const q=QS[cur];
  if(q.type==='text'){
    const v=txt[q.id]||'';
    if(q.req&&!v){ toast(uiT('obligatori')); return; }
    if(q.isEmail&&v&&!v.includes('@')){ toast(uiT('email_invalid')); return; }
  }
  if(q.type==='result'){
    // Si no s'ha enviat encara, enviar primer
    // El botó "Tornar a la web" al nav simplement redirigeix
    window.location.href = 'https://theboringinvestor.github.io/assessoria/';
    return;
  }
  going=true;
  cur++;
  render('fwd');
  setTimeout(()=>going=false,280);
}

function prev(){
  if(going||cur===0) return;
  going=true;
  cur--;
  render('bwd');
  setTimeout(()=>going=false,280);
}

function enviarITancar(){
  const btn = document.getElementById('btn-enviar');
  if(btn) { btn.textContent = uiT('sending'); btn.disabled = true; btn.classList.add('sent'); }
  
  // 1. Enviar a Google Sheets (legacy)

      btn.style.background = '#1A5C3A';
    }

}

async function guardarASupabase() {
  if (!sbClient) { console.log('Supabase no disponible, skipping'); return; }
  
  var sc = calcScore();
  var ar = getArquetip(sc);
  var maxSc = 108;
  var pct = Math.round(sc / maxSc * 100);
  
  // Build scoring_mods (7 dimensions)
  var scoringMods = [1,2,3,4,5,6,7].map(function(dn) {
    var qs = QS.filter(function(q){ return q.dn === dn; });
    return qs.reduce(function(s,q){ return s + (ans[q.id]||0); }, 0);
  });
  
  // Build perfil object
  var perfil = {
    capitalInicial: txt.capitalInicial || '—',
    aportacioMensual: txt.aportacioMensual || '—',
    horitzo: txt.horitzo || '—',
    objectiu: txt.objectiu || '—',
    riscFinancer: pct >= 60 ? 'Alt' : pct >= 40 ? 'Moderat' : 'Baix',
    riscEmocional: scoringMods[5] >= 8 ? 'Alt' : scoringMods[5] >= 5 ? 'Moderat' : 'Baix',
    pla: 'diagnostic',
  };
  
  // Build cartera_composicio from archetype allocation
  var carteraComp = ar.alloc.map(function(a) {
    return { nom: a.n, pct: a.p, target: a.p, actual: a.p, valor: 0, color: '' };
  });
  
  // Build the client record
  var clientData = {
    nom: txt.nom || '—',
    email: (txt.email || '').toLowerCase().trim(),
    arquetip: ar.nom + ' — ' + ar.ep.split('·')[0].trim(),
    arquetip_id: ar.id,
    cartera: ar.cartera,
    scoring: pct,
    scoring_mods: scoringMods,
    perfil: perfil,
    cartera_composicio: carteraComp,
    nota: '',
    historial: [
      {
        titol: ONB_LANG === 'es' ? 'Perfil completado' : 'Perfil completat',
        data: new Date().toLocaleDateString('ca-ES', {day:'numeric', month:'short', year:'numeric'}),
        tipus: 'info',
        desc: (ONB_LANG === 'es' ? 'Cuestionario completado. Arquetipo: ' : 'Qüestionari completat. Arquetip: ') + ar.nom + '. Score: ' + pct + '/100.'
      }
    ],
    ter: ar.ter,
  };
  
  try {
    // Check if client already exists (by email)
    var email = clientData.email;
    if (!email || !email.includes('@')) {
      console.log('No email, skipping Supabase save');
      return;
    }
    
    var existing = await sbClient.from('clients').select('id').eq('email', email).limit(1);
    
    if (existing.data && existing.data.length > 0) {
      // Update existing client
      var res = await sbClient.from('clients').update(clientData).eq('email', email);
      if (res.error) throw res.error;
      console.log('Client actualitzat a Supabase:', email);
    } else {
      // Insert new client
      var res = await sbClient.from('clients').insert(clientData);
      if (res.error) throw res.error;
      console.log('Client creat a Supabase:', email);
    }
    
    toast(ONB_LANG === 'es' ? '✓ Perfil guardado en la plataforma' : '✓ Perfil guardat a la plataforma');
  } catch(e) {
    console.error('Error guardant a Supabase:', e);
    // Silent fail — the Google Sheets backup already worked
  }
}

function descarregar(){

    carteraActual:{actius:actuActius,observacions:txt.obs||'—'}
  };

function enviarASheets(data){
  const sheetsUrl = "https://script.google.com/macros/s/AKfycbzE__3ybWTxaiqCBeZ9Ehu1VxePmTUHqzyxAsR87cjXtaZRHbtPAqPO02jfxf2ElON8/exec";
  const payload = {
    data: data.data,
    nom: data.client.nom,
    email: data.client.email,
    arquetip: data.perfil.arquetip,
    cartera: data.perfil.cartLabel,
    score: data.perfil.scoreTotal,
    capitalInicial: data.client.capitalInicial,
    aportacioMensual: data.client.aportacioMensual,
    horitzo: data.client.horitzo,
    objectiu: data.client.objectiu,
    scoreTotal: data.perfil.scoreTotal + '/' + data.perfil.scoreMax,
    carteraActual: data.carteraActual.actius.map(a=>a.nom).join(', ') || '—',
    respostes: JSON.stringify(data.perfil.respostesDetall)
  };

  // Mostrar loading
  const btn = document.getElementById('btn-next');
  const originalText = btn ? btn.textContent : '';
  if(btn) btn.textContent = 'Enviant...';

  fetch(sheetsUrl, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  })
  .then(() => {
    _dadesEnviades = true;
    toast("Perfil enviat a l'assessor!");
    if(btn) btn.textContent = originalText;
    // Descàrrega automàtica com a còpia
    descarregarJSON(data);
  })
  .catch(() => {
    toast("Error enviant. Descarregant copia...");
    if(btn) btn.textContent = originalText;
    descarregarJSON(data);
  });
}

function descarregarJSON(data){
  const nom=(data.client.nom||'client').replace(/\s+/g,'_').toLowerCase();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='perfil_'+nom+'_'+new Date().toISOString().split('T')[0]+'.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function reiniciar(){
  if(!confirm('Vols esborrar totes les respostes i tornar a començar?')) return;
  [ans,txt].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));
  actius=[{nom:'',pct:'',plat:''}];
  cur=0;
  render('none');
  updateLangToggle && updateLangToggle();
  // Pre-omplir des de paràmetres URL (quan ve del dashboard)
  (function() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('nom'))   { txt.nom   = decodeURIComponent(params.get('nom'));   }
    if (params.get('email')) { txt.email  = decodeURIComponent(params.get('email')); }
    if (params.get('nom') || params.get('email')) {
      // Saltar directament a la primera pregunta de perfil (skip nom/email si ja omplert)
      // Però mostrar igualment per confirmar
      render('none');
      // Mostrar benvinguda personalitzada
      const nom = txt.nom || '';
      if (nom) {
        const toastEl = document.getElementById('toast');
        if (toastEl) {
          toastEl.textContent = 'Hola, ' + nom.split(' ')[0] + '! Les teves dades ja estan pre-omplertes.';
          toastEl.classList.add('show');
          setTimeout(() => toastEl.classList.remove('show'), 3000);
        }
      }
    }
  })();
  // Restaurar llengua onboarding
  ONB_LANG = localStorage.getItem('onb_lang') || 'ca';
  setOnbLang(ONB_LANG);
}

function initRadar(){
  const sc=calcScore();
  const ar=getArquetip(sc);
  const dims=[1,2,3,4,5,6,7].map(dn=>{
    const qs=QS.filter(q=>q.dn===dn);

  const dlbls=['Objectius','Situació','Horitzó','Coneixement','Risc fin.','Risc em.','Preferències'];

        {
          label:'El teu perfil',

      responsive:true,
      maintainAspectRatio:false,

      }}

  });
