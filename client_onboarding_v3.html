<!DOCTYPE html>
<html lang="ca" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Boring Investor — El teu perfil</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black:#0A0A0A; --white:#FFFFFF; --bg:#F7F6F4;
  --g100:#F4F3F0; --g200:#E8E6E1; --g300:#C8C5BE;
  --g400:#9A9690; --g500:#6B6762; --g700:#3A3835;
  --accent:#1B3A6B; --accent-l:#EBF0FA;
  --green:#1A5C3A; --green-l:#EAF3DE;
  --amber:#7A4A00; --amber-l:#FEF5E7;
  --red:#8B1A1A; --red-l:#FDF0F0;
  --fd:'Playfair Display',Georgia,serif;
  --fb:'DM Sans',system-ui,sans-serif;
  --fm:'DM Mono',monospace;
  --ease:cubic-bezier(.4,0,.2,1);
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow:hidden}body{height:100%;overflow:hidden;font-family:var(--fb);background:var(--bg);color:var(--black);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

/* HEADER */
.hdr{background:var(--white);border-bottom:1px solid var(--g200);flex-shrink:0}
.hdr-top{display:flex;align-items:center;padding:0 28px;height:52px}
.logo{display:flex;align-items:center;gap:9px}
.logo-name{font-size:13px;font-weight:500;color:var(--black)}
.prog-info{display:flex;align-items:center;gap:10px;margin-left:auto}
.time-pill{font-size:11px;padding:3px 8px;background:var(--g100);border-radius:99px;color:var(--g500)}
.prog-label{font-size:11px;color:var(--g400);font-family:var(--fm)}
.prog-pct{font-size:11px;font-weight:500;color:var(--accent);font-family:var(--fm)}
.prog-bar-wrap{height:3px;background:var(--g200)}
.prog-bar-fill{height:100%;background:var(--accent);transition:width .4s var(--ease)}

/* STAGE */
.stage{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:28px 20px 60px;overflow-y:auto;overflow-x:hidden;min-height:0;scroll-padding-top:20px}
.stage.is-pregunta{align-items:safe center;padding-top:24px}
.q-wrap{width:100%;max-width:600px;scroll-margin-top:20px}
.out-l{animation:outL .17s var(--ease) forwards}
.in-r{animation:inR .17s var(--ease) forwards}
.out-r{animation:outR .17s var(--ease) forwards}
@keyframes outL{to{opacity:0;transform:translateX(-18px)}}
@keyframes inR{from{opacity:0;transform:translateX(18px)}}
@keyframes outR{to{opacity:0;transform:translateX(18px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .4s ease-out}

/* CARD */
.q-card{background:var(--white);border:1px solid var(--g200);border-radius:14px;padding:32px 36px;box-shadow:0 2px 20px rgba(0,0,0,.05)}
.dim-tag{font-size:10px;font-weight:500;color:var(--accent);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px}
.q-text{font-family:var(--fd);font-size:clamp(17px,2.8vw,23px);font-weight:400;line-height:1.4;color:var(--black);margin-bottom:24px;letter-spacing:-.2px}

/* OPCIONS */
.opts-grid{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:start;gap:12px;padding:13px 16px;border:1.5px solid var(--g200);border-radius:10px;cursor:pointer;transition:all .15s;background:var(--white)}
.opt:hover{border-color:var(--accent);background:var(--accent-l)}
.opt.sel{border-color:var(--accent);background:var(--accent-l)}
.opt-sym{font-size:16px;font-weight:600;color:var(--accent);min-width:28px;text-align:center;line-height:1.5;flex-shrink:0}
.opt-lbl{font-size:12px;font-weight:600;color:var(--black);margin-bottom:2px}
.opt-txt{font-size:12px;color:var(--g500);line-height:1.5}

/* TEXT INPUT */
.form-inp{width:100%;padding:14px 16px;border:1.5px solid var(--g200);border-radius:10px;font-size:18px;font-family:var(--fb);background:var(--white);color:var(--black);outline:none;transition:border-color .15s}
.form-inp:focus{border-color:var(--accent)}

/* SLIDER */
.slider-wrap{display:flex;flex-direction:column;gap:12px}
.slider-lbls{display:flex;justify-content:space-between;font-size:11px;color:var(--g400)}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:var(--g200);border-radius:99px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--white);box-shadow:0 0 0 1px var(--accent)}
.slider-readout{display:flex;align-items:baseline;gap:4px}
.slider-num{font-family:var(--fm);font-size:28px;font-weight:500;color:var(--accent)}
.slider-unit{font-size:14px;color:var(--g400)}
.slider-desc{font-size:12px;color:var(--g500);line-height:1.5;padding:10px 14px;background:var(--g100);border-radius:8px}

/* CARTERA */
.actiu-hdr,.actiu-row{display:grid;grid-template-columns:1fr 76px 1fr 28px;gap:8px;align-items:center;margin-bottom:8px}
.form-lbl{font-size:10px;font-weight:500;color:var(--g400);text-transform:uppercase;letter-spacing:.07em}
.actiu-inp{padding:8px 10px;border:1.5px solid var(--g200);border-radius:8px;font-size:13px;font-family:var(--fb);background:var(--white);color:var(--black);outline:none;transition:border-color .15s}
.actiu-inp:focus{border-color:var(--accent)}
.actiu-pct{font-family:var(--fm);font-size:12px;font-weight:500;color:var(--accent);text-align:right}
.pct-bar-wrap{height:3px;background:var(--g100);border-radius:99px;overflow:hidden;margin-top:3px}
.pct-bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.actiu-del{background:none;border:none;color:var(--g300);cursor:pointer;font-size:15px;padding:0;line-height:1}
.actiu-del:hover{color:var(--red)}
.cartera-total-row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--g200);margin-top:4px;font-size:12px}
.btn-afegir{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1.5px dashed var(--g300);border-radius:8px;background:transparent;color:var(--g500);font-size:12px;cursor:pointer;font-family:var(--fb);transition:all .15s;margin-top:4px}
.btn-afegir:hover{border-color:var(--accent);color:var(--accent)}
.cartera-obs-inp{width:100%;padding:10px 12px;border:1.5px solid var(--g200);border-radius:8px;font-size:12px;font-family:var(--fb);background:var(--white);color:var(--black);resize:vertical;min-height:56px;outline:none;transition:border-color .15s;margin-top:10px}
.cartera-obs-inp:focus{border-color:var(--accent)}

/* RESULT */
.res-wrap{display:flex;flex-direction:column;gap:16px}
.res-hero{border-radius:14px;overflow:hidden;background:var(--black);display:flex;align-items:stretch;min-height:160px}
.res-img{width:130px;flex-shrink:0;overflow:hidden}
.res-img img{width:100%;height:100%;object-fit:cover;filter:grayscale(100%) contrast(1.1)}
.res-av{width:130px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:38px;color:rgba(255,255,255,.25);font-family:var(--fd)}
.res-body{flex:1;padding:22px 26px;display:flex;flex-direction:column;justify-content:center}
.res-eyebrow{font-size:9px;font-weight:500;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
.res-nom{font-family:var(--fd);font-size:clamp(20px,3.5vw,28px);font-weight:400;color:var(--white);line-height:1.1;margin-bottom:5px}
.res-ep{font-size:11px;color:rgba(255,255,255,.4);margin-bottom:12px;font-style:italic}
.res-lema{font-size:12px;color:rgba(255,255,255,.7);line-height:1.6;font-style:italic;border-left:2px solid rgba(255,255,255,.2);padding-left:10px}
.res-desc-block{background:var(--white);border:1px solid var(--g200);border-radius:12px;padding:18px 22px;font-size:13px;color:var(--g500);line-height:1.75}
.res-cartera-block{background:var(--accent);border-radius:12px;padding:18px 22px}
.res-cartera-lbl{font-size:9px;font-weight:500;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
.res-cartera-nom{font-size:15px;font-weight:500;color:var(--white);margin-bottom:3px}
.res-cartera-desc{font-size:11px;color:rgba(255,255,255,.6);margin-bottom:12px}
.res-alloc{display:flex;flex-direction:column;gap:6px}
.res-alloc-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.res-alloc-nom{font-size:11px;color:rgba(255,255,255,.8)}
.res-alloc-bar-wrap{flex:1;height:3px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.res-alloc-bar{height:100%;background:rgba(255,255,255,.55);border-radius:99px}
.res-alloc-pct{font-size:10px;font-family:var(--fm);color:rgba(255,255,255,.55);min-width:28px;text-align:right}
.score-section{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:2px}
.dim-item{text-align:center;padding:9px 4px;background:var(--g100);border-radius:8px}
.dim-val{font-family:var(--fm);font-size:13px;font-weight:500;color:var(--accent);margin-bottom:2px}
.dim-lbl{font-size:9px;color:var(--g400);line-height:1.3}
.radar-block{background:var(--white);border:1px solid var(--g200);border-radius:12px;padding:18px 22px}
.radar-title{font-size:11px;font-weight:500;color:var(--g400);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.radar-wrap{position:relative;width:100%;max-width:260px;margin:0 auto}
.res-actions{display:flex;flex-direction:column;gap:9px;padding-bottom:8px}
.btn-send{width:100%;padding:13px;background:var(--black);color:var(--white);border:none;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fb);transition:opacity .15s}
.btn-send:hover{opacity:.85}
.btn-pdf{width:100%;padding:11px;background:transparent;color:var(--black);border:1.5px solid var(--g200);border-radius:10px;font-size:13px;cursor:pointer;font-family:var(--fb);transition:all .15s}
.btn-pdf:hover{border-color:var(--accent);color:var(--accent)}
.btn-restart{background:none;border:none;font-size:12px;color:var(--g400);cursor:pointer;font-family:var(--fb);text-align:center;padding:4px;transition:color .15s}
.btn-restart:hover{color:var(--black)}
.send-ok{font-size:12px;color:var(--green);text-align:center;padding:6px;font-weight:500}
.send-note{font-size:12px;color:var(--g500);text-align:center;padding:4px}

/* NAVEGACIÓ INFERIOR */
.nav-btns{display:flex;align-items:center;justify-content:space-between;padding:12px 28px;background:var(--white);border-top:1px solid var(--g200);flex-shrink:0}
.btn-back{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fb);background:transparent;color:var(--g500);border:1.5px solid var(--g200);transition:all .15s}
.btn-back:hover{color:var(--black);border-color:var(--black)}
.btn-back[style*="hidden"]{visibility:hidden}
.btn-next{padding:9px 22px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fb);background:var(--accent);color:var(--white);border:none;transition:opacity .15s}
.btn-next:hover{opacity:.88}
.btn-next:disabled{background:var(--g200);color:var(--g400);cursor:default;opacity:1}
.kb-hint{font-size:11px;color:var(--g400)}

/* TOAST */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--black);color:var(--white);padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s var(--ease);z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* HEADER logo fosc → clar */
.logo svg rect{stroke:var(--g300)!important}
.logo svg circle,.logo svg rect:not(:first-child){fill:var(--black)!important}

@media(max-width:600px){
  .q-card{padding:22px 18px;border-radius:12px}
  .res-img,.res-av{width:90px}
  .res-body{padding:16px 16px}
  .hdr-top,.nav-btns{padding:0 16px}
  .stage{padding:20px 14px 60px}
  .stage.is-pregunta{padding-top:20px}
  .score-section{grid-template-columns:repeat(4,1fr)}
}

/* ── RESULT PAGE (classes originals de buildResult) ── */
.result-outer{display:flex;flex-direction:column;gap:14px;padding-bottom:32px;width:100%;max-width:600px}
.res-hero{border-radius:14px;overflow:hidden;background:var(--black);display:flex;min-height:180px}
.res-hero-img{width:140px;flex-shrink:0;overflow:hidden;position:relative}
.res-hero-img img{width:100%;height:100%;object-fit:cover;filter:grayscale(100%) contrast(1.1)}
.res-av{width:140px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:42px;color:rgba(255,255,255,.25);font-family:var(--fd)}
.res-hero-info{flex:1;padding:24px 28px;display:flex;flex-direction:column;justify-content:center}
.res-eyebrow{font-size:9px;font-weight:500;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.res-nom{font-family:var(--fd);font-size:clamp(22px,4vw,30px);font-weight:400;color:var(--white);line-height:1.1;margin-bottom:5px}
.ep{font-size:11px;color:rgba(255,255,255,.4);margin-bottom:14px;font-style:italic}
.lema{font-size:12px;color:rgba(255,255,255,.7);line-height:1.6;font-style:italic;border-left:2px solid rgba(255,255,255,.2);padding-left:12px}
.score{display:flex;align-items:baseline;gap:4px;margin-bottom:8px}
.res-section{background:var(--white);border:1px solid var(--g200);border-radius:12px;padding:18px 22px}
.res-section-title,.section-title{font-size:9px;font-weight:500;color:var(--g400);text-transform:uppercase;letter-spacing:.09em;margin-bottom:12px;border-bottom:1px solid var(--g200);padding-bottom:8px}
.desc{font-size:13px;color:var(--g500);line-height:1.75}
/* Cartera */
.res-cartera-block{background:var(--accent);border-radius:12px;padding:18px 22px}
.res-cartera-lbl{font-size:9px;font-weight:500;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
.res-cartera-nom{font-size:15px;font-weight:500;color:var(--white);margin-bottom:3px}
.res-cartera-desc{font-size:11px;color:rgba(255,255,255,.6);margin-bottom:12px}
.alloc-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.alloc-name{font-size:11px;color:rgba(255,255,255,.8);min-width:140px}
.alloc-bar{flex:1;height:3px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.15)}
.alloc-pct{font-size:10px;font-family:var(--fm);color:rgba(255,255,255,.6);min-width:30px;text-align:right}
/* Dims / Scoring */
.score-section{display:flex;flex-direction:column;margin-top:4px}
.dim-item{text-align:center;padding:9px 4px;background:var(--g100);border-radius:8px}
.dim-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dim-name{font-size:11px;color:var(--g500);flex:1}
.dim-bar{flex:1;height:3px;background:var(--g200);border-radius:99px;overflow:hidden}
.dim-val{font-family:var(--fm);font-size:12px;font-weight:500;color:var(--accent);margin-bottom:2px}
.dim-lbl{font-size:9px;color:var(--g400);line-height:1.3}
/* Radar */
.radar-block{background:var(--white);border:1px solid var(--g200);border-radius:12px;padding:18px 22px}
.radar-title{font-size:11px;font-weight:500;color:var(--g400);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.radar-wrap{position:relative;width:100%;max-width:260px;margin:0 auto}
/* Botons */
.result-btns{display:flex;flex-direction:column;gap:9px;padding-bottom:8px;background:var(--bg);border-radius:12px;padding:16px}
.btn-send{width:100%;padding:13px;background:var(--black);color:var(--white);border:none;border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fb);transition:opacity .15s}
.btn-send:hover{opacity:.85}
.btn-dl,.btn-secondary{width:100%;padding:12px;background:var(--white);color:var(--black);border:1.5px solid var(--g200);border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fb);transition:all .15s}
.btn-dl:hover,.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn-reset{background:none;border:none;font-size:12px;color:var(--g500);cursor:pointer;font-family:var(--fb);text-align:center;padding:6px;transition:color .15s;text-decoration:underline}
.btn-reset:hover{color:var(--black)}
.section{background:var(--white);border:1px solid var(--g200);border-radius:12px;padding:18px 22px}
.footer{font-size:10px;color:var(--g400);text-align:center;padding:8px 0;line-height:1.5}
.send-ok{font-size:12px;color:var(--green);text-align:center;padding:6px}
.send-note{font-size:12px;color:var(--g500);text-align:center;padding:4px}

/* ── COMPTE ENRERE auto-redirecció a la plataforma ── */
#countdown-overlay{
  position:fixed;inset:0;z-index:9999;
  background:rgba(10,10,10,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:cdFadeIn .25s ease-out;transition:opacity .22s ease;
}
@keyframes cdFadeIn{from{opacity:0}to{opacity:1}}
.countdown-card{
  background:#fff;border-radius:20px;padding:36px 40px 28px;
  width:100%;max-width:380px;text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.3);
  animation:cdSlideUp .35s cubic-bezier(.2,.8,.3,1.1);
}
@keyframes cdSlideUp{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.countdown-check{
  width:56px;height:56px;border-radius:50%;
  background:#E8F5E9;color:#1A5C3A;
  font-size:28px;font-weight:600;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 18px;
  animation:cdCheckPop .45s cubic-bezier(.2,.8,.3,1.4) .15s both;
}
@keyframes cdCheckPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.countdown-title{
  font-family:var(--fd, Georgia, serif);
  font-size:22px;font-weight:400;color:#0A0A0A;letter-spacing:-.3px;
  margin-bottom:8px;
}
.countdown-sub{
  font-size:13px;color:#6B6762;margin-bottom:14px;line-height:1.5;
}
.countdown-num{
  font-family:var(--fm, monospace);
  font-size:48px;font-weight:300;color:#1B3A6B;
  line-height:1;margin-bottom:4px;
  font-variant-numeric:tabular-nums;
}
.countdown-secs{
  font-size:11px;color:#9A9690;text-transform:uppercase;letter-spacing:.1em;
  margin-bottom:18px;
}
.countdown-progress{
  width:100%;height:3px;background:#F0EFEC;border-radius:99px;overflow:hidden;
  margin-bottom:22px;
}
.countdown-bar{
  width:100%;height:100%;background:linear-gradient(90deg,#1B3A6B,#4A7CC7);border-radius:99px;
}
.countdown-actions{
  display:flex;flex-direction:column;gap:8px;
}
.countdown-btn-primary{
  width:100%;padding:12px 18px;
  background:#0A0A0A;color:#fff;
  border:none;border-radius:10px;
  font-size:13px;font-weight:500;cursor:pointer;
  font-family:inherit;transition:all .15s;
}
.countdown-btn-primary:hover{background:#1B3A6B;transform:translateY(-1px)}
.countdown-btn-ghost{
  width:100%;padding:10px 18px;
  background:transparent;color:#6B6762;
  border:none;border-radius:10px;
  font-size:12px;cursor:pointer;
  font-family:inherit;text-decoration:underline;
}
.countdown-btn-ghost:hover{color:#0A0A0A}
</style>

</head>
<body>
<!-- Banner de sessió: només visible quan venim de la plataforma loguejat -->
<div id="session-banner" style="display:none;background:#1B3A6B;color:#fff;padding:8px 20px;font-size:12px;display:none;align-items:center;gap:12px;font-family:'DM Sans',system-ui,sans-serif">
  <span style="opacity:.7;font-size:11px">Sessió iniciada com</span>
  <strong id="session-banner-email" style="font-weight:500">—</strong>

  const labelNum = isResult ? TOTAL : cur;
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-pct').textContent = pct+'%';
  document.getElementById('prog-label').textContent = labelNum+' '+uiT('de_label')+' '+TOTAL;

function getTotal(){ return actius.reduce((s,a)=>s+(parseFloat(a.pct)||0),0); }

function renderActius(){
  const total = getTotal();
  const ok    = Math.abs(total-100)<1;
  
  // Opcions del select de categories
  const optsHtml = '<option value="">\u2014 ' + (ONB_LANG==='es'?'Selecciona categoría':'Selecciona categoria') + ' \u2014</option>'
    + ACTIU_CATEGORIES.map(c =>
        '<option value="'+c.id+'">'+c.emoji+' '+(ONB_LANG==='es'?c.es:c.ca)+'</option>'
      ).join('');
  
  const rows = actius.map((a,i)=>{
    const pct = parseFloat(a.pct)||0;
    const cat = ACTIU_CATEGORIES.find(c=>c.id===a.cat);
    const tip = cat ? cat.tip : '';
    return '<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)">'
      +'<div style="display:flex;align-items:center;gap:8px">'
      +'<select class="inp-sm" style="flex:1;cursor:pointer" onchange="actius['+i+'].cat=this.value;refreshActius()">'
        +optsHtml.replace('value="'+a.cat+'"','value="'+a.cat+'" selected')
      +'</select>'
      +'<input class="inp-sm" style="width:58px;text-align:center;font-family:var(--fm)" type="number" placeholder="%" min="0" max="100" step="5" value="'+a.pct+'" oninput="actius['+i+'].pct=this.value;refreshActius()">'
      +'<button class="btn-rm" onclick="rmA('+i+')">\xd7</button>'
      +'</div>'
      +(tip && a.cat ? '<div style="font-size:10px;color:rgba(255,255,255,.32);margin:3px 2px 0">'+tip+'</div>' : '')
      +(pct>0?'<div style="height:3px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin:4px 2px 0">'
        +'<div style="width:'+Math.min(100,pct)+'%;height:100%;background:rgba(255,255,255,.4);border-radius:99px;transition:width .2s"></div>'
        +'</div>':'')
      +'</div>';
  }).join('');
  const totalRow = '<div style="display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:8px 2px 4px;border-top:1px solid rgba(255,255,255,.08);margin-top:4px">'
    +'<span style="font-size:11px;color:rgba(255,255,255,.3);">'+uiT('cartera_pct_total')+'</span>'
    +'<span style="font-family:var(--fm);font-size:14px;font-weight:500;color:'+(ok?'rgba(100,220,120,.9)':total>100?'rgba(230,90,80,.9)':'rgba(255,255,255,.6)')+'">'+Math.round(total)+'%</span>'
    +'</div>';
  return rows + totalRow;
}

function refreshActius(){
  const aw = document.getElementById('aw');
  if(aw) aw.innerHTML = renderActius();
}

function normalitzar(){
  // Repartir els % que falten proporcionalment
  const total = getTotal();
  if(total===0||total===100) return;
  const factor = 100/total;
  actius.forEach(a=>{ if(parseFloat(a.pct)>0) a.pct = Math.round(parseFloat(a.pct)*factor).toString(); });
  refreshActius();
}

function pick(el,qid,score){
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  ans[qid]=score;
  document.getElementById('btn-next').disabled=false;
  setTimeout(()=>{ if(ans[qid]===score) next(); },460);
}

function onSl(el,qid){
  const v=parseInt(el.value);
  const q=QS.find(x=>x.id===qid);
  if(!q) return;
  ans[qid]=q.toScore(v);
  ans[qid+'_raw']=v;
  document.getElementById('sv-'+qid).textContent=v;
  document.getElementById('sd-'+qid).textContent=q.describe(v);
  document.getElementById('btn-next').disabled=false;
}

function addA(){ actius.push({cat:'',pct:''}); refreshActius(); }
function rmA(i){ if(actius.length<=1){ actius[0]={nom:'',pct:'',plat:''}; }else{ actius.splice(i,1); } refreshActius(); }

function attachEv(q){
  if(q.type==='text'){
    const inp=document.getElementById('inp-'+q.id);
    if(!inp) return;
    inp.focus();
    inp.addEventListener('input',()=>{
      txt[q.id]=inp.value.trim();
      document.getElementById('btn-next').disabled=(q.req&&!inp.value.trim());
    });
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') next(); });
  }
  if(q.type==='slider'){
    document.getElementById('btn-next').disabled=false;
    if(ans[q.id]===undefined){
      const sl=document.getElementById('sl-'+q.id);
      if(sl){ const v=parseInt(sl.value); ans[q.id]=q.toScore(v); ans[q.id+'_raw']=v; }
    }
  }
}

function updateNav(){
  const q=QS[cur];
  const nb=document.getElementById('btn-next');
  const bb=document.getElementById('btn-back');
  bb.style.visibility=cur===0?'hidden':'visible';
  if(q.type==='result'){ nb.textContent=uiT('back_web_btn'); nb.disabled=false; return; }
  nb.textContent=uiT('next_btn');
  if(q.type==='choice') nb.disabled=ans[q.id]===undefined;
  else if(q.type==='text') nb.disabled=(q.req&&!txt[q.id]);
  else nb.disabled=false;
  const kbh = document.getElementById('kb-hint');
  if(kbh) kbh.textContent = q.type==='result' ? '' : uiT('press_enter');
  const btnBack = document.getElementById('btn-back');
  if(btnBack) btnBack.textContent = uiT('back_btn');
}

// NAVEGACIÓ
// ════════════════════════════════════════════
function _skipDades(i){ return !!window._authUserId && QS[i] && (QS[i].id==='nom'||QS[i].id==='email'); }
function next(){
  if(going) return;
  const q=QS[cur];
  if(q.type==='text'){
    const v=txt[q.id]||'';
    if(q.req&&!v){ toast(uiT('obligatori')); return; }
    if(q.isEmail&&v&&!v.includes('@')){ toast(uiT('email_invalid')); return; }
  }
  if(q.type==='result'){
    // Si ve de la plataforma, redirigir-hi amb el flag just_completed=true
    // Si no, anar a la home pública
    var fromPlatform = new URLSearchParams(window.location.search).get('from') === 'platform';
    window.location.href = fromPlatform
      ? 'platform.html?just_completed=true'
      : 'https://theboringinvestor.github.io/assessoria/platform.html';
    return;
  }
  going=true;
  cur++;
  while(_skipDades(cur)) cur++; // client validat: saltar nom/email
  render('fwd');
  _onbAutosave();
  setTimeout(()=>going=false,280);
}

function prev(){
  if(going||cur===0) return;
  going=true;
  cur--;
  while(cur>0 && _skipDades(cur)) cur--; // client validat: saltar nom/email
  render('bwd');
  _onbAutosave();
  setTimeout(()=>going=false,280);
}

async function enviarITancar(){
  const btn = document.getElementById('btn-enviar');
  if(btn) { btn.textContent = uiT('sending'); btn.disabled = true; btn.classList.add('sent'); }

  // 1. Enviar a Google Sheets (legacy, fire-and-forget — és el backup)
  try { descarregar(); } catch(e) { console.warn('Sheets save error:', e); }

  // Detectar si ve de la plataforma
  var fromPlatform = new URLSearchParams(window.location.search).get('from') === 'platform';

  // 2. Guardar a Supabase (CRÍTIC — esperem el resultat).
  //    Si falla, NO iniciem el countdown i mostrem error per poder reintentar.
  var saveResult;
  try {
    saveResult = await guardarASupabase();
  } catch(e) {
    saveResult = { ok: false, error: e && e.message || 'Error desconegut' };
  }

  if (!saveResult || !saveResult.ok) {
    // El guardat ha fallat. Mostrem un error visible i permetem reintent.
    if (btn) {
      btn.textContent = ONB_LANG === 'es' ? '⚠ Error guardando' : '⚠ Error guardant';
      btn.style.background = '#8B1A1A';
      btn.classList.remove('sent');
      btn.disabled = false;
    }
    // Mostrar un panell d'error sota el botó amb opció de reintent
    mostrarErrorGuardat(saveResult ? saveResult.error : 'Error desconegut');
    return; // ← important: NO iniciem countdown
  }

  // 3. Guardat OK — netejar el progrés autodesat i mostrar confirmació
  _onbClearSaved();
  if (btn) {
    btn.textContent = ONB_LANG === 'es' ? '✓ Perfil guardado' : '✓ Perfil guardat';
    btn.style.background = '#1A5C3A';
  }
  var portalBtn = document.getElementById('btn-portal');
  if (portalBtn) {
    if (fromPlatform) {
      portalBtn.setAttribute('href', 'platform.html?just_completed=true');
    }
    portalBtn.style.display = 'block';
    portalBtn.scrollIntoView({behavior:'smooth', block:'center'});
  }

  // 4. Si ve de la plataforma, iniciar compte enrere automàtic
  if (fromPlatform) {
    iniciarCompteEnrere(5);
  }
}

// Panell d'error si el guardat a Supabase falla
function mostrarErrorGuardat(errMsg) {
  var existing = document.getElementById('save-error-panel');
  if (existing) existing.remove();
  var btn = document.getElementById('btn-enviar');
  if (!btn || !btn.parentNode) return;

  var isEs = ONB_LANG === 'es';
  var panel = document.createElement('div');
  panel.id = 'save-error-panel';
  panel.style.cssText = 'margin-top:14px;padding:14px 16px;background:#FCEBEB;border:1px solid #C0392B;border-radius:10px;font-size:12px;color:#7A1A1A;line-height:1.5';

  // Causa coneguda: la sessió no s'ha reconegut en desar (token caducat / origen
  // diferent). Reintentar amb la mateixa sessió no servirà: cal tornar a entrar.
  if (errMsg === 'SESSIO_NO_RECONEGUDA') {
    panel.innerHTML = ''
      + '<div style="font-weight:500;margin-bottom:6px">' + (isEs ? '⚠ Tu sesión ha caducado' : '⚠ La teva sessió ha caducat') + '</div>'
      + '<div style="font-size:11px;color:#8B3A2A;margin-bottom:10px">'
        + (isEs
          ? 'No hemos podido guardar tus respuestas porque tu sesión no estaba activa. Tranquilo: tus respuestas están guardadas en este dispositivo. Vuelve a iniciar sesión y las recuperaremos automáticamente para que solo tengas que enviarlas de nuevo.'
          : 'No hem pogut desar les teves respostes perquè la teva sessió no estava activa. Tranquil: les respostes queden desades en aquest dispositiu. Torna a iniciar sessió i les recuperarem automàticament perquè només les hagis de tornar a enviar.')
      + '</div>'
      + '<button onclick="window.location.href=\'platform.html\'" style="padding:8px 14px;background:#0A0A0A;color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit">' + (isEs ? 'Volver a iniciar sesión' : 'Tornar a iniciar sessió') + '</button>';
    btn.parentNode.insertBefore(panel, btn.nextSibling);
    return;
  }
  panel.innerHTML = ''
    + '<div style="font-weight:500;margin-bottom:6px">' + (isEs ? '⚠ No se ha podido guardar tu perfil' : '⚠ No s\'ha pogut desar el teu perfil') + '</div>'
    + '<div style="font-size:11px;color:#8B3A2A;margin-bottom:10px">'
      + (isEs
        ? 'Las respuestas se han guardado en una copia de seguridad, pero la plataforma aún no las ha recibido. Esto puede ser un problema temporal de conexión.'
        : 'Les respostes s\'han desat en una còpia de seguretat, però la plataforma encara no les ha rebut. Pot ser un problema temporal de connexió.')
    + '</div>'
    + '<details style="font-size:10px;color:#9A4A3A;margin-bottom:10px"><summary style="cursor:pointer">' + (isEs ? 'Detalles técnicos' : 'Detalls tècnics') + '</summary><code style="display:block;margin-top:6px;padding:6px 8px;background:rgba(255,255,255,.5);border-radius:4px;font-family:monospace;word-break:break-all">' + (errMsg || 'Unknown error') + '</code></details>'
    + '<button onclick="enviarITancar()" style="padding:8px 14px;background:#0A0A0A;color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit">' + (isEs ? '↻ Reintentar' : '↻ Reintentar') + '</button>';
  btn.parentNode.insertBefore(panel, btn.nextSibling);
}

var _countdownInterval = null;
var _countdownCancelled = false;

function iniciarCompteEnrere(segons){
  if (document.getElementById('countdown-overlay')) return; // ja està
  _countdownCancelled = false;
  
  var isEs = ONB_LANG === 'es';
  var labelTitle = isEs ? 'Perfil enviado' : 'Perfil enviat';
  var labelSub = isEs 
    ? 'Volviendo a la plataforma en' 
    : 'Tornant a la plataforma en';
  var labelSec = isEs ? 'segundos' : 'segons';
  var labelGo  = isEs ? 'Ir ahora →' : 'Anar ara →';
  var labelStay = isEs ? 'Quedarme aquí' : 'Quedar-me aquí';
  
  var overlay = document.createElement('div');
  overlay.id = 'countdown-overlay';
  overlay.innerHTML = ''
    + '<div class="countdown-card">'
    +   '<div class="countdown-check">✓</div>'
    +   '<div class="countdown-title">' + labelTitle + '</div>'
    +   '<div class="countdown-sub">' + labelSub + '</div>'
    +   '<div class="countdown-num"><span id="countdown-n">' + segons + '</span></div>'
    +   '<div class="countdown-secs">' + labelSec + '</div>'
    +   '<div class="countdown-progress"><div class="countdown-bar" id="countdown-bar"></div></div>'
    +   '<div class="countdown-actions">'
    +     '<button class="countdown-btn-primary" onclick="anarAraAlaPlataforma()">' + labelGo + '</button>'
    +     '<button class="countdown-btn-ghost" onclick="cancellarCompteEnrere()">' + labelStay + '</button>'
    +   '</div>'
    + '</div>';
  document.body.appendChild(overlay);
  
  // Animar barra de progrés (de 100% a 0%)
  setTimeout(function(){
    var bar = document.getElementById('countdown-bar');
    if (bar) {
      bar.style.transition = 'width ' + segons + 's linear';
      bar.style.width = '0%';
    }
  }, 50);
  
  var restant = segons;
  _countdownInterval = setInterval(function(){
    if (_countdownCancelled) {
      clearInterval(_countdownInterval);
      return;
    }
    restant--;
    var n = document.getElementById('countdown-n');
    if (n) n.textContent = Math.max(0, restant);
    if (restant <= 0) {
      clearInterval(_countdownInterval);
      anarAraAlaPlataforma();
    }
  }, 1000);
}

function anarAraAlaPlataforma(){
  if (_countdownInterval) clearInterval(_countdownInterval);
  window.location.href = 'platform.html?just_completed=true';
}

function cancellarCompteEnrere(){
  _countdownCancelled = true;
  if (_countdownInterval) clearInterval(_countdownInterval);
  var overlay = document.getElementById('countdown-overlay');
  if (overlay) {
    overlay.style.opacity = '0';
    setTimeout(function(){ if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }, 220);
  }
}

// Construir respostes llegibles del qüestionari per guardar a Supabase
function buildQuestionnaireResponses() {
  var responses = [];
  var questions = QS.filter(function(q){ return q.type === 'choice' || q.type === 'slider'; });
  
  questions.forEach(function(q) {
    var ansVal = ans[q.id];
    if (ansVal === undefined || ansVal === null) return;
    
    var respostaLbl = '';
    var respostaTxt = '';
    
    if (q.type === 'choice' && q.opts) {
      var opt = q.opts.find(function(o){ return o.s === ansVal; });
      if (opt) {
        respostaLbl = opt.sym + ' ' + opt.lbl;
        respostaTxt = opt.txt;
      }
    } else if (q.type === 'slider') {
      var raw = ans[q.id + '_raw'] !== undefined ? ans[q.id + '_raw'] : ansVal;
      respostaLbl = raw + (q.unit || '');
      respostaTxt = '';
    }
    
    responses.push({
      id:     q.id,
      dim:    q.dim,
      dn:     q.dn,
      text:   q.text,
      score:  ansVal,
      lbl:    respostaLbl,
      txt:    respostaTxt,
    });
  });
  
  // Afegir dades textuals (nom, email, perfil numèric)
  return {
    items: responses,
    txt: {
      nom:              txt.nom || '',
      email:            txt.email || '',
      capitalInicial:   txt.capitalInicial || '',
      aportacioMensual: txt.aportacioMensual || '',
      horitzo:          txt.horitzo || '',
      objectiu:         txt.objectiu || '',
    },
    cartera_actual: actius.filter(function(a){ return a.cat && parseFloat(a.pct)>0; }),
    data: new Date().toISOString(),
  };
}

async function guardarASupabase() {
  if (!sbClient) {
    console.warn('Supabase no disponible — el client no es podrà validar');
    return { ok: false, error: 'Supabase no disponible (problema de configuració)' };
  }
  
  var sc = calcScore();
  var ar = getArquetip(sc);
  var maxSc = 100; // risc 0-100 del mòdul
  var pct = Math.round(sc / maxSc * 100);

  // Perfil complet del mòdul (capacitat, tolerància, coneixement 0-100, sofisticació...)
  // El nivell de coneixement (eix A1-A3) alimenta la conveniència MIFID i permet
  // a l'admin suggerir plantilles segons el nivell del client (dim_coneixement).
  var perfilCalc = TBI_PERFIL.calcPerfil(ans);
  var dimConeixement = (perfilCalc && typeof perfilCalc.coneixement === 'number') ? perfilCalc.coneixement : null;
  
  // Build scoring_mods (7 dimensions)
  var scoringMods = [1,2,3,4,5,6,7].map(function(dn) {
    var qs = QS.filter(function(q){ return q.dn === dn; });
    return qs.reduce(function(s,q){ return s + (ans[q.id]||0); }, 0);
  });
  
  // Build perfil object
  var perfil = {
    capitalInicial: txt.capitalInicial || '—',
    aportacioMensual: txt.aportacioMensual || '—',
    horitzo: txt.horitzo || '—',
    objectiu: txt.objectiu || '—',
    riscFinancer: pct >= 60 ? 'Alt' : pct >= 40 ? 'Moderat' : 'Baix',
    riscEmocional: scoringMods[5] >= 8 ? 'Alt' : scoringMods[5] >= 5 ? 'Moderat' : 'Baix',
    pla: 'diagnostic',
  };
  
  // Build cartera_composicio from archetype allocation
  var carteraComp = ar.alloc.map(function(a) {
    return { nom: a.n, pct: a.p, target: a.p, actual: a.p, valor: 0, color: '' };
  });
  
  // Cartera actual: ja no es demana al qüestionari (eliminada maig 2026).
  // S'inicialitza buida; el client podrà declarar posicions reals des del portal si vol.
  var carteraActualUsuari = [];
  
  // Build the client record
  var clientData = {
    nom: txt.nom || '—',
    email: (txt.email || '').toLowerCase().trim(),
    arquetip: ar.nom + ' — ' + ar.ep.split('·')[0].trim(),
    arquetip_id: ar.id,
    cartera: ar.cartera,
    scoring: pct,
    scoring_mods: scoringMods,
    dim_coneixement: dimConeixement,
    perfil: perfil,
    cartera_composicio: carteraComp,
    nota: '',
    historial: [
      {
        titol: ONB_LANG === 'es' ? 'Perfil completado' : 'Perfil completat',
        data: new Date().toLocaleDateString('ca-ES', {day:'numeric', month:'short', year:'numeric'}),
        tipus: 'info',
        desc: (ONB_LANG === 'es' ? 'Cuestionario completado. Arquetipo: ' : 'Qüestionari completat. Arquetip: ') + ar.nom + '. Score: ' + pct + '/100.'
      }
    ],
    ter: ar.ter,
    cartera_actual_usuari: carteraActualUsuari,
    questionnaire_responses: buildQuestionnaireResponses(),
    questionnaire_date: new Date().toISOString(),
    status: window._authUserId ? 'pending' : 'lead',  // pending = client a validar · lead = visitant captat
    submitted_at: new Date().toISOString(),
  };

  // Si l'usuari ha fet el qüestionari autenticat (Fase 2), afegim l'auth_user_id
  // Això permet que les RLS futures usin auth.uid() = auth_user_id en lloc d'email
  if (window._authUserId) {
    clientData.auth_user_id = window._authUserId;
  }
  
  try {
    // Check if client already exists (by email)
    var email = clientData.email;
    if (!email || !email.includes('@')) {
      console.warn('No email vàlid, skipping Supabase save');
      return { ok: false, error: 'Email no vàlid' };
    }

    var existing = await sbClient.from('clients').select('id,cartera_target_custom,informes,reunions,nota,historial,pla,status,activated_at').eq('email', email).limit(1);
    if (existing.error) {
      console.error('Error consultant existència:', existing.error);
      return { ok: false, error: 'Lectura: ' + existing.error.message };
    }

    var action;
    if (existing.data && existing.data.length > 0) {
      // ── REFER QÜESTIONARI ──
      // Preservem TOTS els camps que l'admin/usuari han generat al llarg del temps:
      // - cartera_target_custom: cartera target editada per admin (no es perd!)
      // - informes: informes publicats per l'admin
      // - reunions: reunions agendades
      // - nota: nota de l'assessor
      // - historial: registre històric (s'hi afegeix una nova entrada, no es sobreescriu)
      // - pla, status, activated_at: ja gestionats per l'admin
      var prev = existing.data[0];

      // Eliminar de clientData els camps que no s'han de sobreescriure
      delete clientData.nota;        // mantenim la nota anterior
      delete clientData.status;      // mantenim el status actual (no tornem a 'pending')

      // Fusionar historial: la nova entrada + les anteriors
      var prevHist = Array.isArray(prev.historial) ? prev.historial : [];
      var nouEvent = clientData.historial[0] || null;
      if (nouEvent) {
        nouEvent.titol = (ONB_LANG === 'es' ? 'Cuestionario actualizado' : 'Qüestionari actualitzat');
        nouEvent.desc  = (ONB_LANG === 'es' ? 'Cuestionario rehecho. Nuevo arquetipo: ' : 'Qüestionari refet. Nou arquetip: ') + ar.nom + '. Score: ' + pct + '/100.';
        clientData.historial = [nouEvent].concat(prevHist);
      } else {
        clientData.historial = prevHist;
      }

      // Update existing client (preservant els camps no presents a clientData).
      // .select() ens retorna les files REALMENT afectades. Si en surten 0, l'escriptura
      // ha estat rebutjada en silenci (RLS: sessió no reconeguda + fila no 'pending').
      var resU = await sbClient.from('clients').update(clientData).eq('email', email).select('id,scoring');
      if (resU.error) {
        console.error('Error update Supabase:', resU.error);
        return { ok: false, error: 'Update: ' + resU.error.message };
      }
      if (!resU.data || resU.data.length === 0) {
        console.warn('UPDATE ha afectat 0 files (sessió no reconeguda o RLS):', email);
        return { ok: false, error: 'SESSIO_NO_RECONEGUDA' };
      }
      action = 'update';
      console.log('Client actualitzat (qüestionari refet, target preservat):', email);
    } else {
      // Insert new client
      var resI = await sbClient.from('clients').insert(clientData).select('id,scoring');
      if (resI.error) {
        console.error('Error insert Supabase:', resI.error);
        return { ok: false, error: 'Insert: ' + resI.error.message };
      }
      if (!resI.data || resI.data.length === 0) {
        console.warn('INSERT no ha retornat fila (RLS o sessió):', email);
        return { ok: false, error: 'SESSIO_NO_RECONEGUDA' };
      }
      action = 'insert';
      console.log('Client creat a Supabase:', email);
    }

    // Verificació post-escriptura: comprovar que la fila és visible amb status=pending
    var verify = await sbClient.from('clients')
      .select('id,status,scoring')
      .eq('email', email)
      .limit(1);
    if (verify.error || !verify.data || verify.data.length === 0) {
      console.warn('Guardat aparentment OK però la fila no és llegible:', verify);
      return { ok: false, error: 'La fila s\'ha guardat però no és accessible (possible problema RLS)' };
    }
    // El scoring desat ha de coincidir amb el que acabem d'escriure. Si no coincideix,
    // l'escriptura no s'ha persistit (rebuig silenciós) tot i no haver donat error abans.
    if (Number(verify.data[0].scoring) !== Number(pct)) {
      console.warn('Scoring desat no coincideix (no persistit):', verify.data[0].scoring, 'vs', pct);
      return { ok: false, error: 'SESSIO_NO_RECONEGUDA' };
    }
    if (verify.data[0].status !== 'pending') {
      console.warn('La fila no té status=pending:', verify.data[0]);
    }

    toast(ONB_LANG === 'es' ? '✓ Perfil guardado en la plataforma' : '✓ Perfil guardat a la plataforma');
    return { ok: true, action: action, status: verify.data[0].status };
  } catch(e) {
    console.error('Excepció guardant a Supabase:', e);
    return { ok: false, error: e && e.message || 'Excepció desconeguda' };
  }
}

function nomesDL(){

  const sc = calcScore();
  const ar = getArquetip(sc);
  const dims = [1,2,3,4,5,6,7].map(dn => {
    const qs = QS.filter(q=>q.dn===dn);
    return {dimensio:dn, sum:qs.reduce((s,q)=>s+(ans[q.id]||0),0), max:qs.length*4};
  });

    client:{nom:txt.nom||'—',email:txt.email||'—',capitalInicial:'—',aportacioMensual:'—',horitzo:'—',objectiu:'—'},

  const ar=getArquetip(sc);
  const dims=[1,2,3,4,5,6,7].map(dn=>{
    const qs=QS.filter(q=>q.dn===dn);
    return {dimensio:dn,sum:qs.reduce((s,q)=>s+(ans[q.id]||0),0),max:qs.length*4};
  });
  const actuActius=actius.filter(a=>a.nom);
  const data={
    versio:'3.0',tipus:'client_onboarding',

    app:'The Boring Investor — Qüestionari v3',
    client:{nom:txt.nom||'—',email:txt.email||'—',capitalInicial:'—',aportacioMensual:'—',horitzo:'—',objectiu:'—'},

    carteraActual:{actius:actuActius,observacions:txt.obs||'—'}
  };
  enviarASheets(data);
}

function enviarASheets(data){
  const sheetsUrl = "https://script.google.com/macros/s/AKfycbzE__3ybWTxaiqCBeZ9Ehu1VxePmTUHqzyxAsR87cjXtaZRHbtPAqPO02jfxf2ElON8/exec";
  const payload = {
    data: data.data,
    nom: data.client.nom,
    email: data.client.email,
    arquetip: data.perfil.arquetip,
    cartera: data.perfil.cartLabel,
    score: data.perfil.scoreTotal,
    capitalInicial: data.client.capitalInicial,
    aportacioMensual: data.client.aportacioMensual,
    horitzo: data.client.horitzo,
    objectiu: data.client.objectiu,
    scoreTotal: data.perfil.scoreTotal + '/' + data.perfil.scoreMax,
    carteraActual: data.carteraActual.actius.map(a=>a.nom).join(', ') || '—',
    respostes: JSON.stringify(data.perfil.respostesDetall)
  };

  // Mostrar loading
  const btn = document.getElementById('btn-next');
  const originalText = btn ? btn.textContent : '';
  if(btn) btn.textContent = 'Enviant...';

  fetch(sheetsUrl, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  })
  .then(() => {
    _dadesEnviades = true;
    toast("Perfil enviat a l'assessor!");
    if(btn) btn.textContent = originalText;
    // Descàrrega automàtica com a còpia
    descarregarJSON(data);
  })
  .catch(() => {
    toast("Error enviant. Descarregant copia...");
    if(btn) btn.textContent = originalText;
    descarregarJSON(data);
  });
}

function descarregarJSON(data){
  const nom=(data.client.nom||'client').replace(/\s+/g,'_').toLowerCase();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='perfil_'+nom+'_'+new Date().toISOString().split('T')[0]+'.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ── AUTODESAT LOCAL DE RESPOSTES ──
// Es desa el progrés a localStorage a cada pas. Si el navegador recarrega
// la pàgina (mòbil), la sessió caduca o el desat a Supabase falla, les
// respostes NO es perden: es recuperen automàticament en tornar a entrar.
var ONB_SAVE_KEY = 'tbi_onb_progress';
function _onbAutosave(){
  try {
    localStorage.setItem(ONB_SAVE_KEY, JSON.stringify({ ans: ans, txt: txt, actius: actius, cur: cur, ts: Date.now() }));
  } catch(e){}
}
function _onbClearSaved(){ try { localStorage.removeItem(ONB_SAVE_KEY); } catch(e){} }
function _onbRestore(){
  try {
    var raw = localStorage.getItem(ONB_SAVE_KEY);
    if (!raw) return false;
    var s = JSON.parse(raw);
    // Descartem progressos de fa més de 24h
    if (!s || !s.ts || (Date.now() - s.ts) > 24*3600*1000) { _onbClearSaved(); return false; }
    var nAns = Object.keys(s.ans || {}).length;
    if (!nAns) return false;
    // Si hi ha sessió activa i el progrés desat era d'un altre email, descartar
    if (txt.email && s.txt && s.txt.email && s.txt.email !== txt.email) { _onbClearSaved(); return false; }
    var sessEmail = txt.email, sessNom = txt.nom;
    Object.keys(s.ans || {}).forEach(function(k){ ans[k] = s.ans[k]; });
    Object.keys(s.txt || {}).forEach(function(k){ if (txt[k] === undefined || txt[k] === '') txt[k] = s.txt[k]; });
    if (sessEmail) txt.email = sessEmail; // la sessió mana sobre el desat
    if (sessNom)   txt.nom   = sessNom;
    if (Array.isArray(s.actius) && s.actius.length) actius = s.actius;
    if (typeof s.cur === 'number' && s.cur > 0 && s.cur < QS.length) cur = s.cur;
    while (_skipDades(cur)) cur++;
    render('none');
    var pBar = document.getElementById('progress');
    if (pBar) pBar.style.width = Math.round((cur / (QS.length - 1)) * 100) + '%';
    toast(ONB_LANG === 'es' ? '✓ Hemos recuperado tus respuestas anteriores' : '✓ Hem recuperat les teves respostes anteriors');
    return true;
  } catch(e){ return false; }
}

function reiniciar(){
  if(!confirm('Vols esborrar totes les respostes i tornar a començar?')) return;
  _onbClearSaved();
  [ans,txt].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));
  actius=[{nom:'',pct:'',plat:''}];
  cur=0;
  render('none');
  updateLangToggle && updateLangToggle();
  inicialitzarQüestionari();
  ONB_LANG = localStorage.getItem('onb_lang') || 'ca';
  setOnbLang(ONB_LANG);
}

// ════════════════════════════════════════════
// INICIALITZACIÓ — detecta sessió i salta nom/email si ja autenticat
// ════════════════════════════════════════════
async function inicialitzarQüestionari() {
  const params = new URLSearchParams(window.location.search);
  const fromPlatform = params.get('from') === 'platform';

  // 1. Llegir paràmetres URL (fallback base)
  var urlNom   = decodeURIComponent(params.get('nom') || params.get('name') || '');
  var urlEmail = decodeURIComponent(params.get('email') || '');

  // 2. Intentar llegir la sessió de Supabase (compartida entre platform.html i aquest fitxer)
  var authNom   = '';
  var authEmail = '';
  var authId    = '';
  var hasAuth   = false;

  if (sbClient) {
    try {
      var sessionRes = await sbClient.auth.getSession();
      var user = sessionRes && sessionRes.data && sessionRes.data.session && sessionRes.data.session.user;
      if (user && user.email) {
        authEmail = user.email.toLowerCase();
        authId    = user.id || '';
        // El nom pot venir de: user_metadata, el paràmetre URL, o el que ja hi ha a txt
        authNom   = (user.user_metadata && (user.user_metadata.full_name || user.user_metadata.name))
          || urlNom
          || '';
        hasAuth = true;
      }
    } catch(e) {
      console.warn('[QS] No s\'ha pogut llegir la sessió:', e);
    }
  }

  // 2b. Aquest qüestionari (idoneïtat + coneixement MIFID) és NOMÉS per a
  //     clients. Un visitant fred (sense sessió i que no ve de la plataforma)
  //     s'envia al test de salut financera públic. Bypass manual: ?client=1
  if (!hasAuth && !fromPlatform && !urlEmail && params.get('client') !== '1') {
    window.location.replace('test-salut-financera.html');
    return;
  }

  // 3. Omplir txt amb la millor font disponible
  if (hasAuth) {
    // Opció B: pre-omplir amb les dades de la sessió (nom de user_metadata o URL)
    // i saltar directament a la primera pregunta real
    txt.email = authEmail;
    txt.nom   = authNom || urlNom || '';
    window._authUserId = authId; // per a guardarASupabase

    // nom/email ara són al final del qüestionari i es salten durant la navegació (next/prev)
    // per a clients autenticats. Comencem a la primera pregunta real (edat, índex 0).
    cur = 0;

    render('none');
    // Actualitzar el comptador de progrés (no estem a 0)
    var pBar = document.getElementById('progress');
    if (pBar) pBar.style.width = Math.round((cur / (QS.length - 1)) * 100) + '%';

    if (fromPlatform) {
      _mostrarBannerSessio(authNom, authEmail);
    }

    // Toast de benvinguda amb el nom
    var firstName = (txt.nom || '').split(' ')[0];
    if (firstName) {
      var toastEl = document.getElementById('toast');
      if (toastEl) {
        toastEl.textContent = 'Hola, ' + firstName + '! Comencem directament amb les preguntes.';
        toastEl.classList.add('show');
        setTimeout(function(){ toastEl.classList.remove('show'); }, 3500);
      }
    }

  } else {
    // Sense sessió: comportament original (demanar nom i email)
    if (urlNom)   { txt.nom   = urlNom; }
    if (urlEmail) { txt.email = urlEmail; }
    cur = 0;
    render('none');

    if (urlNom || urlEmail) {
      var toastEl = document.getElementById('toast');
      if (toastEl) {
        var firstName2 = (txt.nom || '').split(' ')[0];
        toastEl.textContent = firstName2
          ? 'Hola, ' + firstName2 + '! Les teves dades ja estan pre-omplertes.'
          : 'Email pre-omplert.';
        toastEl.classList.add('show');
        setTimeout(function(){ toastEl.classList.remove('show'); }, 3000);
      }
    }

    if (fromPlatform) {
      var exitBtn = document.getElementById('onb-exit');
      if (exitBtn) exitBtn.style.display = 'inline-block';
      if (urlNom || urlEmail) {
        _mostrarBannerSessio(urlNom, urlEmail);
      }
    }
  }

  // Restaurar llengua
  ONB_LANG = localStorage.getItem('onb_lang') || 'ca';
  setOnbLang(ONB_LANG);

  // Recuperar el progrés autodesat (si n'hi ha) — després de conèixer la
  // sessió, perquè el filtre per email funcioni correctament.
  _onbRestore();
}

function _mostrarBannerSessio(nom, email) {
  var banner     = document.getElementById('session-banner');
  var bannerEmail = document.getElementById('session-banner-email');
  var bannerMsg  = document.getElementById('session-banner-msg');
  if (!banner || !bannerEmail) return;
  var displayName = nom || email || 'Usuari';
  bannerEmail.textContent = displayName + (email && nom ? ' · ' + email : '');
  banner.style.display = 'flex';
  if (bannerMsg) bannerMsg.style.display = 'inline';
  var exitBtn = document.getElementById('onb-exit');
  if (exitBtn) exitBtn.style.display = 'inline-block';
}

// Sortir del qüestionari sense desar — tanca la sessió a Supabase i torna
// al login. IMPORTANT: cal fer el signOut aquí, no només a la plataforma,
// perquè el qüestionari té la seva pròpia connexió Supabase i comparteix
// les cookies del domini.
async function sortirAlPortal(){
  var msg = ONB_LANG === 'es'
    ? '¿Salir del cuestionario sin guardar?\n\nLas respuestas no se guardarán y se cerrará la sesión.'
    : 'Sortir del qüestionari sense desar?\n\nLes respostes no es guardaran i es tancarà la sessió.';
  if (!confirm(msg)) return;

  // Indicar visualment que estem tancant sessió
  var banner = document.getElementById('session-banner');
  if (banner) banner.querySelector('button').textContent = 'Tancant...';

  try {
    if (sbClient) await sbClient.auth.signOut();
  } catch(e) { console.warn('signOut error:', e); }

  // Netejar qualsevol residu local
  try { localStorage.removeItem('tbi_session'); } catch(e){}

  // Redirigir al login (sense ?logout=1 perquè ja està fet)
  window.location.href = 'platform.html';
}

function initRadar(){
  const sc=calcScore();
  const ar=getArquetip(sc);
  const dims=[1,2,3,4,5,6,7].map(dn=>{
    const qs=QS.filter(q=>q.dn===dn);
    const sum=qs.reduce((s,q)=>s+(ans[q.id]||0),0);
    const max=qs.length*4;
    return {sum,max,pct:max?Math.round(sum/max*100):0};
  });
  const dlbls=['Objectius','Situació','Horitzó','Coneixement','Risc fin.','Risc em.','Preferències'];
  const canvas=document.getElementById('radarChart');
  if(!canvas||typeof Chart==='undefined') return;
  if(window._radarInst) window._radarInst.destroy();
  window._radarInst=new Chart(canvas,{
    type:'radar',
    data:{
      labels:dlbls,
      datasets:[
        {
          label:'El teu perfil',
          data:dims.map(d=>d.pct),
          borderColor:'rgba(27,58,107,0.9)',
          backgroundColor:'rgba(27,58,107,0.12)',
          borderWidth:2,
          pointBackgroundColor:'#1B3A6B',
          pointBorderColor:'white',
          pointRadius:4,
          pointHoverRadius:6,
        },
        {
          label:'Màxim possible',
          data:dims.map(function(){return 100;}),
          borderColor:'rgba(0,0,0,0.08)',
          backgroundColor:'rgba(0,0,0,0.02)',
          borderWidth:1,
          borderDash:[4,4],
          pointRadius:0,
        }
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            label:function(ctx){
              const d=dims[ctx.dataIndex];
              return ctx.dataset.label+': '+d.sum+'/'+d.max+' ('+d.pct+'%)';
            }
          }
        }
      },
      scales:{r:{
        min:0,
        max:100,
        ticks:{
          stepSize:20,
          color:'rgba(0,0,0,0.3)',
          backdropColor:'transparent',
          font:{size:9},
          callback:function(v){return v+'%';}
        },
        grid:{color:'rgba(0,0,0,0.07)'},
        pointLabels:{
          color:'#6B6762',
          font:{size:10,weight:'500'}
        },
        angleLines:{color:'rgba(0,0,0,0.07)'}
      }}
    }
  });
}

let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  if(toastT) clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),2800);
}
