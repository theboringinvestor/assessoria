<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --black:#0D0D0D;--white:#FAFAF8;--cream:#F5F3ED;
  --gold:#C8A54A;--gold-light:#E8D49A;--gold-dark:#9A7B2F;
  --green:#1A5C3A;--green-light:#EAF3DE;--red:#8B1A1A;--blue:#1B3A6B;
  --g50:#F9F8F5;--g100:#E8E6E0;--g200:#D4D1C9;--g300:#B0ADA5;--g400:#8A8780;--g500:#6B685F;--g600:#4A473F;
  --fd:"Playfair Display",Georgia,serif;--fb:"DM Sans",system-ui,sans-serif;--fm:"DM Mono",monospace;
}
html{scroll-behavior:smooth}
body{font-family:var(--fb);color:var(--black);background:var(--cream);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}

/* paper texture */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:radial-gradient(circle at 18% 12%,rgba(200,165,74,.05),transparent 38%),radial-gradient(circle at 82% 78%,rgba(27,58,107,.04),transparent 42%)}

.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 18px;min-height:100vh;display:flex;flex-direction:column}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 6px}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--black);display:flex;align-items:center;justify-content:center}
.brand-mark svg{width:20px;height:20px}
.brand-name{font-family:var(--fd);font-size:14px;font-weight:600;letter-spacing:-.2px;line-height:1}
.brand-name small{display:block;font-family:var(--fm);font-size:8.5px;font-weight:400;letter-spacing:.14em;color:var(--g400);text-transform:uppercase;margin-top:2px}
.topbar-q{font-family:var(--fm);font-size:11px;color:var(--g400);letter-spacing:.04em}

/* progress */
.progress{height:3px;background:var(--g100);border-radius:99px;margin:8px 2px 0;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--gold-dark),var(--gold));border-radius:99px;width:0;transition:width .45s cubic-bezier(.2,.8,.2,1)}

/* stage */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 0 28px}
.fade{animation:fade .42s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* intro */
.intro-eyebrow{font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dark);margin-bottom:16px}
.intro h1{font-family:var(--fd);font-size:clamp(30px,8vw,42px);font-weight:600;line-height:1.12;letter-spacing:-.5px;margin-bottom:18px}
.intro h1 em{font-style:italic;color:var(--gold-dark)}
.intro p{font-size:15px;color:var(--g500);line-height:1.7;margin-bottom:28px}
.intro-meta{display:flex;gap:22px;margin-bottom:34px;flex-wrap:wrap}
.intro-meta div{font-size:12px;color:var(--g400);display:flex;align-items:center;gap:7px}
.intro-meta strong{color:var(--g600);font-weight:600}

/* question */
.q-num{font-family:var(--fm);font-size:11px;color:var(--gold-dark);letter-spacing:.1em;margin-bottom:12px}
.q-title{font-family:var(--fd);font-size:clamp(23px,6vw,30px);font-weight:600;line-height:1.2;letter-spacing:-.3px;margin-bottom:6px}
.q-hint{font-size:13px;color:var(--g400);line-height:1.6;margin-bottom:24px}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{display:flex;align-items:center;gap:15px;width:100%;text-align:left;padding:17px 18px;background:var(--white);border:1.5px solid var(--g100);border-radius:14px;cursor:pointer;font-family:var(--fb);font-size:15px;color:var(--black);transition:all .16s;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.opt:hover{border-color:var(--gold);transform:translateY(-1px);box-shadow:0 6px 18px rgba(200,165,74,.14)}
.opt:active{transform:translateY(0)}
.opt-ico{flex:none;width:42px;height:42px;border-radius:11px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:20px}
.opt-body{flex:1;line-height:1.3}
.opt-body b{display:block;font-weight:600;font-size:15px}
.opt-body span{display:block;font-size:12px;color:var(--g400);margin-top:2px;font-weight:400}
.opt-arrow{flex:none;color:var(--g200);font-size:17px;transition:color .16s,transform .16s}
.opt:hover .opt-arrow{color:var(--gold);transform:translateX(3px)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:16px 30px;border:none;border-radius:12px;font-family:var(--fb);font-size:15px;font-weight:600;cursor:pointer;transition:all .18s;width:100%}
.btn-primary{background:var(--gold);color:var(--black)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(200,165,74,.32)}
.btn-dark{background:var(--black);color:#fff}
.btn-dark:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.22)}
.btn-ghost{background:transparent;border:1.5px solid var(--g200);color:var(--g600)}
.btn-ghost:hover{border-color:var(--g400)}
.btn-wa{background:#25D366;color:#0a2e16}
.btn-wa:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(37,211,102,.32)}

.q-back{margin-top:20px;background:none;border:none;color:var(--g400);font-family:var(--fb);font-size:13px;cursor:pointer;padding:6px 0;display:inline-flex;align-items:center;gap:6px}
.q-back:hover{color:var(--g600)}

/* calculating */
.calc-box{text-align:center;padding:40px 0}
.calc-ring{width:64px;height:64px;margin:0 auto 26px;border:3px solid var(--g100);border-top-color:var(--gold);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.calc-box p{font-family:var(--fm);font-size:13px;color:var(--g500);letter-spacing:.02em;min-height:18px}

/* result */
.res-eyebrow{font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dark);text-align:center;margin-bottom:6px}
.gauge-wrap{text-align:center;margin:4px 0 6px}
.gauge{position:relative;width:240px;height:138px;margin:0 auto}
.gauge svg{width:240px;height:138px;overflow:visible}
.gauge-track{fill:none;stroke:var(--g100);stroke-width:15;stroke-linecap:round}
.gauge-val{fill:none;stroke-width:15;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.gauge-num{position:absolute;left:0;right:0;bottom:6px;text-align:center}
.gauge-num b{font-family:var(--fd);font-size:46px;font-weight:600;line-height:1}
.gauge-num span{font-family:var(--fm);font-size:12px;color:var(--g400)}
.res-state{text-align:center;font-family:var(--fd);font-size:24px;font-weight:600;margin:2px 0 4px}
.res-tag{text-align:center;font-size:14px;color:var(--g500);line-height:1.6;max-width:420px;margin:0 auto 24px}

.card{background:var(--white);border:1px solid var(--g100);border-radius:16px;padding:20px;margin-bottom:14px}
.card-h{font-size:11px;font-family:var(--fm);text-transform:uppercase;letter-spacing:.1em;color:var(--g400);margin-bottom:16px}

/* dimension bars */
.dim{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.dim:last-child{margin-bottom:0}
.dim-ico{flex:none;width:34px;height:34px;border-radius:9px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:16px}
.dim-body{flex:1;min-width:0}
.dim-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.dim-name{font-size:13px;font-weight:600}
.dim-verdict{font-size:11px;color:var(--g400)}
.dim-track{height:6px;background:var(--g100);border-radius:99px;overflow:hidden}
.dim-fill{height:100%;border-radius:99px;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}

/* benefit */
.benefit{background:linear-gradient(135deg,#14233E 0%,#0D0D0D 100%);color:#fff;border-radius:18px;padding:26px 22px;margin-bottom:14px}
.benefit-h{font-family:var(--fm);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.4);margin-bottom:10px}
.benefit-big{font-family:var(--fd);font-size:clamp(34px,11vw,46px);font-weight:600;color:var(--gold);line-height:1;letter-spacing:-1px;margin-bottom:6px}
.benefit-sub{font-size:13px;color:rgba(255,255,255,.6);line-height:1.6;margin-bottom:20px}
.benefit-rows{display:flex;flex-direction:column;gap:1px;background:rgba(255,255,255,.07);border-radius:12px;overflow:hidden}
.benefit-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;background:rgba(255,255,255,.02)}
.benefit-row .lbl{font-size:12.5px;color:rgba(255,255,255,.75);line-height:1.4}
.benefit-row .lbl small{display:block;font-size:10.5px;color:rgba(255,255,255,.4);margin-top:2px}
.benefit-row .v{font-family:var(--fm);font-size:17px;font-weight:500;white-space:nowrap}
.benefit-row .v.good{color:#5BC98A}
.benefit-row .v.bad{color:#E57373}
.benefit-note{font-size:10.5px;color:rgba(255,255,255,.35);line-height:1.55;margin-top:14px}

.cta-stack{display:flex;flex-direction:column;gap:10px;margin-top:6px}

/* factor humà */
.huma{background:var(--white);border:1px solid var(--g100);border-radius:16px;padding:22px 20px;margin-bottom:14px}
.huma-gap{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#2A1212 0%,#0D0D0D 100%);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.huma-gap b{font-family:var(--fd);font-size:30px;font-weight:600;color:#E57373;line-height:1;white-space:nowrap}
.huma-gap span{font-size:12px;color:rgba(255,255,255,.65);line-height:1.55}
.huma-items{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.huma-item{display:flex;gap:12px;align-items:flex-start}
.huma-item .ic{flex:none;width:34px;height:34px;border-radius:9px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:16px}
.huma-item b{display:block;font-size:13.5px;font-weight:600;margin-bottom:2px}
.huma-item span{font-size:12px;color:var(--g500);line-height:1.6}
.huma-val{background:linear-gradient(135deg,#FFFDF5 0%,#FEF7E8 100%);border:1px solid var(--gold-light);border-radius:12px;padding:16px;text-align:center}
.huma-val .lbl{font-size:11px;font-family:var(--fm);text-transform:uppercase;letter-spacing:.1em;color:var(--g400);margin-bottom:5px}
.huma-val .num{font-family:var(--fd);font-size:30px;font-weight:600;color:var(--gold-dark);line-height:1.1}
.huma-val .sub{font-size:11.5px;color:var(--g500);margin-top:5px;line-height:1.55}
.huma-note{font-size:10.5px;color:var(--g300);line-height:1.6;margin-top:12px}
.cta-lead{text-align:center;font-size:14px;color:var(--g600);line-height:1.6;margin:18px 0 14px}
.cta-lead b{color:var(--black)}

.res-foot{text-align:center;margin:22px 0 36px}
.res-foot button{background:none;border:none;color:var(--g400);font-family:var(--fb);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.disc{font-size:10.5px;color:var(--g300);line-height:1.6;text-align:center;margin-top:18px;max-width:460px;margin-left:auto;margin-right:auto}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .gauge-val{stroke-dashoffset:var(--off,100)}
}
</style>
</head>

// ---- Render ----------------------------------------------------------
function render(){
  if(state==='intro') return renderIntro();
  if(state==='q')      return renderQuestion();
  if(state==='email')  return renderEmail();
  if(state==='calc')   return renderCalc();
  if(state==='result') return renderResult();
}

function setProgress(frac){
  document.getElementById('progress-bar').style.width = Math.round(frac*100)+'%';
}

function renderIntro(){
  document.getElementById('topbar-q').textContent = '2 minuts';
  setProgress(0);
  stage.innerHTML =
    '<div class="intro fade">'
    + '<div class="intro-eyebrow">Diagnòstic gratuït · sense registre</div>'
    + '<h1>Quina <em>salut financera</em> tens, de debò?</h1>'
    + '<p>Set preguntes ràpides i et donem dues coses: el teu estat financer puntuat de 0 a 100, i quant podries millorar en euros amb una bona estructuració. Sense lletra petita.</p>'
    + '<div class="intro-meta">'
    +   '<div>⏱️ <strong>2 minuts</strong></div>'
    +   '<div>🔒 <strong>Sense registre</strong></div>'
    +   '<div>🎯 <strong>Resultat a l\'instant</strong></div>'
    + '</div>'
    + '<button class="btn btn-dark" onclick="start()">Comença el test →</button>'
    + '</div>';
}

function renderQuestion(){
  var q = QS[cur];
  document.getElementById('topbar-q').textContent = (cur+1)+' / '+QS.length;
  setProgress(cur/QS.length);
  var opts = q.opts.map(function(o,i){
    return '<button class="opt" onclick="choose('+i+')">'
      + '<span class="opt-ico">'+o.ico+'</span>'
      + '<span class="opt-body"><b>'+o.lbl+'</b>'+(o.sub?'<span>'+o.sub+'</span>':'')+'</span>'
      + '<span class="opt-arrow">→</span>'
      + '</button>';
  }).join('');
  stage.innerHTML =
    '<div class="fade">'
    + '<div class="q-num">Pregunta '+(cur+1)+' de '+QS.length+'</div>'
    + '<div class="q-title">'+q.title+'</div>'
    + (q.hint?'<div class="q-hint">'+q.hint+'</div>':'')
    + '<div class="opts">'+opts+'</div>'
    + (cur>0?'<button class="q-back" onclick="back()">← Enrere</button>':'')
    + '</div>';
}

function renderCalc(){
  document.getElementById('topbar-q').textContent = '';
  setProgress(1);
  stage.innerHTML =
    '<div class="calc-box fade">'
    + '<div class="calc-ring"></div>'
    + '<p id="calc-msg">Analitzant les teves respostes…</p>'
    + '</div>';
  var msgs = ['Analitzant les teves respostes…','Calculant el teu estat financer…','Estimant el benefici d\'estructurar…','Preparant el teu resultat…'];
  var k=0;
  var el=document.getElementById('calc-msg');
  var iv=setInterval(function(){k++;if(el&&msgs[k])el.textContent=msgs[k];},650);
  setTimeout(function(){clearInterval(iv);state='result';render();},2300);
}

// ---- Lògica de navegació --------------------------------------------
function start(){ state='q'; cur=0; render(); }
function choose(i){ ans[QS[cur].id]=QS[cur].opts[i]; cur++; if(cur>=QS.length){state='email';render();}else render(); }
function back(){ if(cur>0){cur--; state='q'; render();} }
function restart(){ ans={}; cur=0; leadEmail=''; leadSaved=false; state='intro'; render(); }

function renderEmail(){
  document.getElementById('topbar-q').textContent = '';
  setProgress(0.95);
  stage.innerHTML =
    '<div class="fade" style="text-align:center">'
    + '<div style="font-size:38px;margin-bottom:14px">&#9993;&#65039;</div>'
    + '<div class="q-title" style="margin-bottom:8px">El teu resultat est&agrave; llest</div>'
    + '<div class="q-hint" style="max-width:400px;margin:0 auto 22px">Vols l\u2019informe complet amb recomanacions concretes? Deixa\u2019m el teu correu i te l\u2019envio personalment. Sense spam, nom\u00e9s l\u2019informe. <b>&Eacute;s opcional.</b></div>'
    + '<input type="email" id="lead-email" placeholder="elteu@correu.com" autocomplete="email" '
    +   'style="width:100%;max-width:380px;padding:15px 18px;border:1.5px solid var(--g200);border-radius:12px;font-family:var(--fb);font-size:15px;background:var(--white);margin-bottom:12px;text-align:center" '
    +   'onkeydown="if(event.key===\'Enter\')confirmEmail()">'
    + '<div class="cta-stack" style="max-width:380px;margin:0 auto">'
    +   '<button class="btn btn-dark" onclick="confirmEmail()">Envia\u2019m l\u2019informe i mostra el resultat &rarr;</button>'
    +   '<button class="btn btn-ghost" onclick="skipEmail()">Veure el resultat sense informe</button>'
    + '</div>'
    + '</div>';
  var inp=document.getElementById('lead-email');
  if(inp)setTimeout(function(){inp.focus();},250);
}
function confirmEmail(){
  var inp = document.getElementById('lead-email');
  var v = inp ? (inp.value||'').trim() : '';
  if(v && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){
    inp.style.borderColor = '#8B1A1A';
    inp.placeholder = 'Correu no v\u00e0lid \u2014 revisa\u2019l';
    if(v.length<4) inp.value='';
    return;
  }
  leadEmail = v;
  state='calc'; render();
}
function skipEmail(){ leadEmail=''; state='calc'; render(); }

// ---- Scoring i càlcul de benefici -----------------------------------
function computeResult(){
  // 1) Puntuació de l'estat financer (0-100)
  var score = 0;
  DIMS.forEach(function(d){
    var a = ans[QS.filter(function(q){return q.dim===d.id;})[0].id];
    score += a ? (a.sc||0) : 0;
  });
  score = Math.max(0, Math.min(100, score));

  // 2) Paràmetres de càlcul
  var age   = ans.edat.age;
  var cap   = ans.estalvis.cap;
  var m     = ans.mensual.m;
  var cost  = ans.onson.cost;     // cost actual estimat (% anual)
  var idle  = ans.onson.idle;     // fracció de diners aturats
  var Y     = Math.max(10, Math.min(30, 67 - age)); // horitzó fins a jubilació, acotat

  // 3) Estalvi en comissions (diferència de cost, mateix creixement brut)
  //    Comparem dos escenaris amb el MATEIX rendiment brut moderat: la
  //    diferència ve de les comissions, no d'una previsió de rendiment.
  var GROSS = 5.0;        // % brut moderat (declarat)
  var TBI   = 0.25;       // % cost TBI
  function simula(c, mes, anys, costPct){
    var net = (GROSS - costPct)/100;
    var r = Math.pow(1+net, 1/12) - 1;
    var v = c;
    var n = anys*12;
    for(var i=0;i<n;i++){ v = v*(1+r) + mes; }
    return v;
  }
  var vTBI  = simula(cap, m, Y, TBI);
  var vBanc = simula(cap, m, Y, cost);
  var estalviComissions = Math.max(0, vTBI - vBanc);

  // 4b) Valor del factor humà (Vanguard Advisor's Alpha ~3%/any).
  //     Comparem inversor per lliure (4% net, després de biaixos i errors,
  //     cf. DALBAR behavior gap −4,5%) vs acompanyat amb mètode (7% net).
  //     És una estimació d'estudis tercers, NO el nostre track record.
  function simNet(c2, mes2, anys2, netPct){
    var r2 = Math.pow(1+netPct/100, 1/12) - 1;
    var v2 = c2;
    var n2 = anys2*12;
    for(var j=0;j<n2;j++){ v2 = v2*(1+r2) + mes2; }
    return v2;
  }
  var valorAssessor = Math.max(0, simNet(cap, m, Y, 7) - simNet(cap, m, Y, 4));

  // 4) Pèrdua de poder adquisitiu per diners aturats (inflació 3%)
  var INFL = 0.03;
  var capAturat = cap * idle;
  var perduaInflacio = capAturat * (1 - Math.pow(1+INFL, -Y));

  return {
    score:score, age:age, cap:cap, m:m, Y:Y,
    estalviComissions:estalviComissions,
    perduaInflacio:perduaInflacio,
    capAturat:capAturat,
    valorAssessor:valorAssessor,
    cost:cost
  };
}

function stateInfo(score){
  if(score < 40) return {label:'Vulnerable',     color:'#8B1A1A', tag:'Les teves finances estan exposades. Hi ha riscos bàsics per cobrir abans de pensar a fer créixer el capital — i és aquí on una bona estructuració canvia més les coses.'};
  if(score < 60) return {label:'En construcció', color:'#9A7B2F', tag:'Tens una base, però amb forats. Amb uns quants ajustos d\'estructura i un pla clar, el teu diner pot començar a treballar molt millor.'};
  if(score < 80) return {label:'Sòlid',          color:'#1A5C3A', tag:'Vas bé. Les bases hi són i ara el marge de millora està en l\'optimització: costos, fiscalitat i mantenir el rumb amb disciplina.'};
  return                  {label:'Òptim',         color:'#C8A54A', tag:'Excel·lent salut financera. El teu repte ja no és arreglar res, sinó afinar costos i estratègia per exprimir cada euro al màxim.'};
}

function dimVerdict(id, frac){
  var bo = frac>=.75, mig = frac>=.4;
  var t = {
    coixi:      ['Sense protecció','Coixí parcial','Ben protegit'],
    deute:      ['Deute a controlar','Deute moderat','Lliure de deute car'],
    estalvi:    ['Sense marge','Estalvi moderat','Gran capacitat'],
    estructura: ['Diners parats','Millorable','Ben estructurat'],
    pla:        ['Sense rumb','Rumb difús','Pla clar']
  }[id] || ['Baix','Mitjà','Alt'];
  return bo ? t[2] : (mig ? t[1] : t[0]);
}

function renderResult(){
  document.getElementById('topbar-q').textContent = '';
  setProgress(1);
  var r = computeResult();
  var st = stateInfo(r.score);
  saveLead(r, st);

  // Confirmació si han deixat correu
  var emailNote = leadEmail
    ? '<div style="text-align:center;font-size:12.5px;color:var(--green);background:var(--green-light);border-radius:10px;padding:10px 14px;margin:0 auto 18px;max-width:420px">&#10003; Rebut! T\u2019enviar&eacute; l\u2019informe complet a <b>'+leadEmail+'</b> en les properes 24\u201348h.</div>'
    : '';

  // Gauge: semicercle 0-100. pathLength=100 → dashoffset = 100-score.
  var off = 100 - r.score;

  // Barres per dimensió
  var dimsHtml = DIMS.map(function(d){
    var a = ans[QS.filter(function(q){return q.dim===d.id;})[0].id];
    var sc = a ? (a.sc||0) : 0;
    var frac = d.max ? sc/d.max : 0;
    var col = frac>=.75?'#1A5C3A':(frac>=.4?'#9A7B2F':'#8B1A1A');
    return '<div class="dim">'
      + '<div class="dim-ico">'+d.ico+'</div>'
      + '<div class="dim-body">'
      +   '<div class="dim-top"><span class="dim-name">'+d.name+'</span><span class="dim-verdict">'+dimVerdict(d.id,frac)+'</span></div>'
      +   '<div class="dim-track"><div class="dim-fill" data-w="'+Math.round(frac*100)+'" style="background:'+col+'"></div></div>'
      + '</div></div>';
  }).join('');

  // Files de benefici (només mostrem les rellevants)
  var rows = '';
  if(r.estalviComissions > 0){
    rows += '<div class="benefit-row"><div class="lbl">Estalvi en comissions<small>vs el producte típic de banc, en '+r.Y+' anys</small></div><div class="v good">+'+fmtEur(r.estalviComissions)+'</div></div>';
  }
  if(r.perduaInflacio > 0){
    rows += '<div class="benefit-row"><div class="lbl">Poder adquisitiu en risc<small>els teus '+fmtEur(r.capAturat)+' aturats, en '+r.Y+' anys d\'inflació</small></div><div class="v bad">−'+fmtEur(r.perduaInflacio)+'</div></div>';
  }
  var totalMillora = r.estalviComissions + r.perduaInflacio;

  // CTA WhatsApp amb el resultat precarregat
  var waMsg = encodeURIComponent(
    'Hola Guillem! He fet el test de salut financera de The Boring Investor. '
    + 'El meu estat financer és '+r.score+'/100 ('+st.label+') '
    + 'i m\'agradaria parlar de com millorar-lo. Gràcies!'
  );
  var waUrl = 'https://wa.me/'+WA_PHONE+'?text='+waMsg;

  stage.innerHTML =
    '<div class="fade">'
    + emailNote
    + '<div class="res-eyebrow">El teu estat financer</div>'
    + '<div class="gauge-wrap"><div class="gauge">'
    +   '<svg viewBox="0 0 240 138">'
    +     '<path class="gauge-track" d="M18 130 A102 102 0 0 1 222 130" pathLength="100"/>'
    +     '<path class="gauge-val" id="gauge-val" d="M18 130 A102 102 0 0 1 222 130" pathLength="100" style="stroke:'+st.color+'"/>'
    +   '</svg>'
    +   '<div class="gauge-num"><b style="color:'+st.color+'">'+r.score+'</b><span>/ 100</span></div>'
    + '</div></div>'
    + '<div class="res-state" style="color:'+st.color+'">'+st.label+'</div>'
    + '<div class="res-tag">'+st.tag+'</div>'

    + '<div class="card"><div class="card-h">El teu desglossament</div>'+dimsHtml+'</div>'

    + '<div class="benefit">'
    +   '<div class="benefit-h">Què hi ha en joc per a tu</div>'
    +   '<div class="benefit-big">'+fmtEur(totalMillora)+'</div>'
    +   '<div class="benefit-sub">És el marge de millora estimat en '+r.Y+' anys entre tenir les finances com ara i tenir-les ben estructurades i amb cost baix.</div>'
    +   '<div class="benefit-rows">'+rows+'</div>'
    +   '<div class="benefit-note">Estimació orientativa a partir de les teves respostes, assumint un creixement brut moderat del 5 % anual i una inflació del 3 %. La diferència ve sobretot de les comissions i de tenir els diners estructurats — no és una previsió de rendiment ni una recomanació personalitzada.</div>'
    + '</div>'

    + '<div class="huma">'
    +   '<div class="card-h">I el que cap calculadora recull: el factor hum&agrave;</div>'
    +   '<div class="huma-gap"><b>&minus;4,5%</b><span>anuals perd l\u2019inversor mitj&agrave; respecte al mercat per <b style="color:#fff">decisions emocionals</b> (mercat 10,4% vs inversor 5,9% \u00b7 DALBAR, 20 anys). El problema no sol ser la cartera: som nosaltres.</span></div>'
    +   '<div class="huma-items">'
    +     '<div class="huma-item"><div class="ic">&#129504;</div><div><b>Neutralitzar els biaixos</b><span>Aversi&oacute; a la p&egrave;rdua, FOMO, seguir el ramat, excés de confiança\u2026 s&oacute;n humans i universals. Con&egrave;ixer-los no els elimina; tenir un pla escrit i alg&uacute; que t\u2019aturi al moment clau, s&iacute;.</span></div></div>'
    +     '<div class="huma-item"><div class="ic">&#129529;</div><div><b>Coaching emocional</b><span>La baranda quan vols saltar: no vendre en p&agrave;nic a les caigudes (el 2020 el mercat va caure un 34% i ho va recuperar en 5 mesos) ni comprar l\u2019actiu de moda quan ja surt als diaris.</span></div></div>'
    +     '<div class="huma-item"><div class="ic">&#128203;</div><div><b>Mètode i disciplina</b><span>Aportacions autom&agrave;tiques, rebalanceig anual i revisi&oacute; trimestral. Avorrit a posta: el temps al mercat guanya sempre a encertar el moment.</span></div></div>'
    +     '<div class="huma-item"><div class="ic">&#128184;</div><div><b>Evitar els errors cars</b><span>Market timing, concentrar massa en una sola posici&oacute;, ignorar el cost dels productes o mirar la cartera cada dia. Cap &eacute;s d\u2019intel\u00b7lig&egrave;ncia: tots s&oacute;n de comportament.</span></div></div>'
    +   '</div>'
    +   '<div class="huma-val"><div class="lbl">Qu&egrave; valdria aix&ograve; per a tu</div><div class="num">+'+fmtEur(r.valorAssessor)+'</div><div class="sub">si l\u2019acompanyament et fa guanyar un <b>+3% anual</b> (estimaci&oacute; Vanguard Advisor\u2019s Alpha: 2,7\u20133,5%) amb els teus n&uacute;meros, en '+r.Y+' anys.</div></div>'
    +   '<div class="huma-note">Fonts: DALBAR QAIB (behavior gap) i Vanguard Advisor\u2019s Alpha. S&oacute;n estimacions d\u2019estudis independents sobre el valor de l\u2019assessorament met&ograve;dic, no una promesa de rendiment de cap cartera concreta.</div>'
    + '</div>'

    + '<div class="cta-lead"><b>Vols recuperar aquests '+fmtEur(totalMillora)+'?</b><br>Parlem-ne sense compromís i et dic com estructurar-ho pas a pas.</div>'
    + '<div class="cta-stack">'
    +   '<a class="btn btn-wa" href="'+waUrl+'" target="_blank" rel="noopener">💬 Parlem pel WhatsApp</a>'
    +   '<a class="btn btn-primary" href="'+PLATFORM_URL+'">Crea el teu pla complet →</a>'
    + '</div>'

    + '<div class="res-foot"><button onclick="restart()">↻ Tornar a fer el test</button></div>'
    + '<div class="disc">The Boring Investor · Anàlisi i educació financera independent. Aquest test és una eina orientativa i no constitueix assessorament d\'inversió personalitzat. Candidat EFA · pre-certificació.</div>'
    + '</div>';

  // Animacions d'entrada (gauge + barres)
  requestAnimationFrame(function(){
    setTimeout(function(){
      var g=document.getElementById('gauge-val');
      if(g){ g.style.setProperty('--off', off); g.style.strokeDashoffset = off; }
      document.querySelectorAll('.dim-fill').forEach(function(f){ f.style.width = f.getAttribute('data-w')+'%'; });
    }, 120);
  });
}

// ---- Init ------------------------------------------------------------
render();
</script>

</html>
