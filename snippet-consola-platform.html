<!-- ════════════════════════════════════════════════════════════════
     TBI · accés a la consola d'assessor des de platform.html
     Enganxar JUST ABANS de </body>. No toca res més de la pàgina.
     Només es mostra si is_tbi_admin() retorna true: un client no el veu.
     ════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  var SB_URL = 'https://nvcmwhzcskihgktltavm.supabase.co';
  var SB_KEY = 'sb_publishable_Fy-iwa-lUQOSI4QTkj9EPw_wlSiymVY';

  // El testimoni de sessió ja hi és: mateix domini, mateix projecte.
  function token() {
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (/^sb-.*-auth-token$/.test(k)) {
          var v = JSON.parse(localStorage.getItem(k));
          if (v && v.access_token) return v.access_token;
        }
      }
    } catch (e) { /* magatzem bloquejat */ }
    return null;
  }

  function pintar() {
    if (document.getElementById('tbi-consola-link')) return;
    var a = document.createElement('a');
    a.id = 'tbi-consola-link';
    a.href = 'tbi-admin.html';
    a.textContent = 'Consola d’assessor';
    a.setAttribute('aria-label', 'Obrir la consola d’assessor');
    a.style.cssText = [
      'position:fixed',
      'right:18px',
      'bottom:calc(18px + env(safe-area-inset-bottom, 0px))',
      'z-index:9999',
      'display:inline-flex',
      'align-items:center',
      'gap:8px',
      'padding:11px 18px',
      'border-radius:999px',
      'background:#C8A54A',
      'color:#16233A',
      'font:600 14px/1 "IBM Plex Sans",system-ui,sans-serif',
      'text-decoration:none',
      'box-shadow:0 6px 20px rgba(22,35,58,.22)',
      'transition:transform .15s ease'
    ].join(';');
    a.onmouseenter = function () { a.style.transform = 'translateY(-2px)'; };
    a.onmouseleave = function () { a.style.transform = 'none'; };
    document.body.appendChild(a);
  }

  var tk = token();
  if (!tk) return;
  fetch(SB_URL + '/rest/v1/rpc/is_tbi_admin', {
    method: 'POST',
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + tk,
      'Content-Type': 'application/json'
    },
    body: '{}'
  })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (ok) { if (ok === true) pintar(); })
    .catch(function () { /* si falla, simplement no surt el botó */ });
})();
</script>
