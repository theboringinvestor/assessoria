<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Boring Investor — Portal Client</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --black:#0A0A0A;--white:#FFFFFF;--bg:#F7F6F4;
  --g100:#F4F3F0;--g200:#E8E6E1;--g300:#C8C5BE;--g400:#9A9690;--g500:#6B6762;
  --accent:#1B3A6B;--accent-l:#EBF0FA;
  --green:#1A5C3A;--green-l:#EAF3DE;
  --amber:#7A4A00;--amber-l:#FEF5E7;
  --red:#8B1A1A;--red-l:#FDF0F0;
  --fd:'Playfair Display',Georgia,serif;
  --fb:'DM Sans',system-ui,sans-serif;
  --fm:'DM Mono',monospace;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--fb);background:var(--bg);color:var(--black);-webkit-font-smoothing:antialiased}
/* ── TOPBAR ── */
.topbar{height:56px;background:var(--white);border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:100}
.topbar-logo{display:flex;align-items:center;gap:10px}
.topbar-brand{font-size:13px;font-weight:500}
.topbar-sub{font-size:10px;color:var(--g400)}
.logout-btn{font-size:12px;color:var(--g400);cursor:pointer;background:none;border:none;font-family:var(--fb);padding:6px 12px;border-radius:6px;transition:all .15s}
.logout-btn:hover{background:var(--g100);color:var(--black)}
/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--white);border:1px solid var(--g200);border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.login-title{font-family:var(--fd);font-size:26px;font-weight:400;margin-bottom:6px;letter-spacing:-.3px}
.login-sub{font-size:13px;color:var(--g400);margin-bottom:28px;line-height:1.6}
.input{width:100%;padding:12px 14px;border:1.5px solid var(--g200);border-radius:8px;font-size:14px;font-family:var(--fb);background:var(--white);color:var(--black);outline:none;transition:border-color .15s;margin-bottom:12px}
.input:focus{border-color:var(--accent)}
.btn-primary{width:100%;padding:13px;background:var(--black);color:var(--white);border:none;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;font-family:var(--fb);transition:opacity .15s}
.btn-primary:hover{opacity:.85}
.btn-primary:disabled{opacity:.4;cursor:default}
.login-msg{font-size:12px;color:var(--g500);text-align:center;margin-top:14px;line-height:1.6}
.login-msg.ok{color:var(--green)}
.login-msg.err{color:var(--red)}
/* ── PORTAL ── */
.portal{max-width:780px;margin:0 auto;padding:32px 20px 60px}
.portal-hello{margin-bottom:28px}
.portal-hello-eye{font-size:10px;font-weight:500;color:var(--g400);text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px}
.portal-hello-name{font-family:var(--fd);font-size:30px;font-weight:400;letter-spacing:-.3px;margin-bottom:4px}
.portal-hello-sub{font-size:13px;color:var(--g500)}
/* Cards */
.card{background:var(--white);border:1px solid var(--g200);border-radius:var(--r);padding:20px 24px;margin-bottom:16px}
.card-title{font-size:9px;font-weight:500;color:var(--g400);text-transform:uppercase;letter-spacing:.09em;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--g200)}
/* Score */
.score-hero{background:var(--black);border-radius:var(--r);padding:24px 28px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.score-left{}
.score-arquetip-eye{font-size:9px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px}
.score-arquetip{font-family:var(--fd);font-size:24px;font-weight:400;color:var(--white);margin-bottom:3px}
.score-cartera{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:12px}
.score-lema{font-size:12px;color:rgba(255,255,255,.6);font-style:italic;border-left:2px solid rgba(255,255,255,.2);padding-left:10px;line-height:1.6;max-width:340px}
.score-right{text-align:right}
.score-num{font-family:var(--fm);font-size:44px;font-weight:500;line-height:1}
.score-denom{font-size:14px;opacity:.35;margin-left:2px}
.score-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.4;margin-top:4px}
/* Perfil grid */
.perfil-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.perfil-item{padding:10px 12px;background:var(--g100);border-radius:8px}
.perfil-lbl{font-size:9px;font-weight:500;color:var(--g400);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.perfil-val{font-size:13px;font-weight:500;color:var(--black)}
/* Cartera */
.alloc-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--g100)}
.alloc-row:last-child{border-bottom:none}
.alloc-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.alloc-nom{font-size:12px;color:var(--black);flex:1}
.alloc-bar-wrap{width:100px;height:4px;background:var(--g200);border-radius:99px;overflow:hidden}
.alloc-bar{height:100%;border-radius:99px;background:var(--accent)}
.alloc-pct{font-family:var(--fm);font-size:11px;color:var(--accent);min-width:32px;text-align:right}
/* Dims */
.dims-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px}
.dim-item{text-align:center;padding:8px 3px;background:var(--g100);border-radius:7px}
.dim-val{font-family:var(--fm);font-size:13px;font-weight:500}
.dim-lbl{font-size:8px;color:var(--g400);margin-top:2px;line-height:1.2}
/* Projeccions */
.proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.proj-card{padding:12px;border-radius:8px;text-align:center}
.proj-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.proj-val{font-family:var(--fm);font-size:16px;font-weight:500}
/* Historial */
.hist-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--g100)}
.hist-item:last-child{border-bottom:none}
.hist-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.hist-titol{font-size:12px;font-weight:500;color:var(--black);margin-bottom:2px}
.hist-data{font-size:10px;color:var(--g400)}
.hist-desc{font-size:11px;color:var(--g500);margin-top:2px;line-height:1.5}
/* Nota assessor */
.nota-box{background:var(--g100);border-radius:8px;padding:14px 16px;font-size:13px;color:var(--g600);line-height:1.7;border-left:3px solid var(--g300);font-style:italic}
/* Disc */
.disc{font-size:10px;color:var(--g400);line-height:1.6;margin-top:24px;padding-top:14px;border-top:1px solid var(--g200)}
/* Loading */
.loading{display:flex;align-items:center;justify-content:center;min-height:200px;font-size:13px;color:var(--g400)}
/* Radar */
.radar-wrap{max-width:260px;height:220px;margin:0 auto}
@media(max-width:600px){
  .perfil-grid{grid-template-columns:1fr}
  .dims-grid{grid-template-columns:repeat(4,1fr)}
  .proj-grid{grid-template-columns:1fr}
  .score-hero{flex-direction:column}
  .score-right{text-align:left}
}

/* ── CARTERA EDITABLE ── */
.cartera-edit-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--g100)}
.cartera-edit-row:last-child{border-bottom:none}
.cartera-edit-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.cartera-edit-nom{font-size:12px;color:var(--black);flex:1;min-width:0}
.cartera-edit-pct{
  width:56px;padding:4px 6px;border:1px solid var(--g200);border-radius:5px;
  font-size:12px;font-family:var(--fm);text-align:right;
  background:var(--white);color:var(--black);
}
.cartera-edit-pct:focus{outline:none;border-color:var(--accent)}
.cartera-edit-qty{
  width:72px;padding:4px 6px;border:1px solid var(--g200);border-radius:5px;
  font-size:12px;font-family:var(--fm);text-align:right;
  background:var(--white);color:var(--black);
}
.cartera-edit-qty:focus{outline:none;border-color:var(--accent)}
.cartera-edit-bar{width:80px;height:4px;background:var(--g200);border-radius:99px;overflow:hidden}
.cartera-edit-bar-fill{height:100%;border-radius:99px;transition:width .3s}
.cartera-total-row{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--g200);
}
.cartera-total-lbl{font-size:11px;color:var(--g400)}
.cartera-total-val{font-family:var(--fm);font-size:13px;font-weight:500}
.cartera-save-btn{
  margin-top:12px;width:100%;padding:10px;
  background:var(--accent);color:white;border:none;border-radius:8px;
  font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fb);
  transition:opacity .15s;
}
.cartera-save-btn:hover{opacity:.85}
.cartera-save-btn:disabled{opacity:.4;cursor:default}
.cartera-projeccio{
  margin-top:12px;padding:12px;background:var(--g100);border-radius:8px;
}
.cartera-proj-title{font-size:10px;font-weight:500;color:var(--g500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.cartera-proj-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.cartera-proj-lbl{color:var(--g500)}
.cartera-proj-val{font-family:var(--fm);font-weight:500}

/* ── PORTAL TABS ── */
.portal-tabs{display:flex;gap:2px;background:var(--g100);padding:4px;border-radius:10px;margin-bottom:28px;overflow-x:auto}
.portal-tab{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;color:var(--g500);border:none;background:transparent;font-family:var(--fb);white-space:nowrap;transition:all .15s}
.portal-tab.active{background:var(--white);color:var(--black);box-shadow:0 1px 4px rgba(0,0,0,.1)}
/* Anàlisi portal */
.pa-card{background:var(--white);border:1px solid var(--g200);border-radius:12px;padding:18px 20px;margin-bottom:12px;cursor:pointer;transition:border-color .15s}
.pa-card:hover{border-color:var(--g300)}
.pa-card-title{font-size:14px;font-weight:500;color:var(--black);margin-bottom:4px}
.pa-card-sub{font-size:12px;color:var(--g400);font-style:italic;margin-bottom:8px}
.pa-card-resum{font-size:12px;color:var(--g500);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* Carteres portal */
.pc-card{background:var(--white);border:1px solid var(--g200);border-radius:12px;overflow:hidden;margin-bottom:14px}
.pc-header{padding:16px 20px;border-bottom:1px solid var(--g100)}
.pc-nom{font-family:var(--fd);font-size:18px;font-weight:400;color:var(--black);margin-bottom:3px}
.pc-desc{font-size:12px;color:var(--g500);line-height:1.5}
.pc-body{padding:14px 20px}
.pc-alloc-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--g100)}
.pc-alloc-row:last-child{border-bottom:none}

/* Freemium overlay */
.freemium-blur{filter:blur(4px);pointer-events:none;user-select:none;opacity:.5}
.freemium-overlay{position:relative}
.freemium-overlay::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 0%,rgba(247,246,244,.95) 60%);
  z-index:2;pointer-events:none;
}
.freemium-cta{
  position:relative;z-index:3;
  margin-top:16px;padding:20px;
  background:var(--white);border:1.5px solid var(--accent);border-radius:12px;
  text-align:center;
}
.freemium-cta-title{font-family:var(--fd);font-size:18px;font-weight:400;color:var(--black);margin-bottom:6px}
.freemium-cta-sub{font-size:13px;color:var(--g500);margin-bottom:16px;line-height:1.6}
.freemium-cta-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.freemium-cta-btn{padding:10px 20px;background:var(--accent);color:white;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;font-family:var(--fb)}
.freemium-cta-btn-sec{padding:10px 20px;background:transparent;color:var(--black);border:1.5px solid var(--g200);border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;font-family:var(--fb)}
</style>
</head>
<body>

<!-- ── TOPBAR (sempre visible) ── -->
<div class="topbar" id="topbar" style="display:none">
  <div class="topbar-logo">
    <svg width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
      <rect x="1" y="1" width="26" height="26" rx="3" fill="none" stroke="#C8C5BE" stroke-width="1.5"/>
      <circle cx="8.5" cy="10" r="2" fill="#0A0A0A"/>
      <circle cx="8.5" cy="17" r="2" fill="#0A0A0A"/>
      <rect x="12" y="13" width="5" height="1.5" rx=".75" fill="#0A0A0A"/>
      <rect x="19" y="8" width="1.5" height="11" rx=".75" fill="#0A0A0A"/>
    </svg>
    <div>
      <div class="topbar-brand">The Boring Investor</div>
      <div class="topbar-sub">Portal del client</div>
    </div>
  </div>
  <button class="logout-btn" onclick="logout()">Tancar sessió →</button>
</div>

<!-- ── LOGIN ── -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="30" height="30" rx="3" fill="none" stroke="#0A0A0A" stroke-width="2"/>
        <circle cx="10" cy="11" r="2.2" fill="#0A0A0A"/>
        <circle cx="10" cy="19" r="2.2" fill="#0A0A0A"/>
        <rect x="14" y="14.2" width="7" height="2" rx="1" fill="#0A0A0A"/>
        <rect x="23" y="9" width="2" height="14" rx="1" fill="#0A0A0A"/>
      </svg>
      <div>
        <div style="font-size:13px;font-weight:500">The Boring Investor</div>
        <div style="font-size:10px;color:var(--g400)">Portal del client</div>
      </div>
    </div>
    <div class="login-title">Accedeix al teu perfil</div>
    <div class="login-sub">Introdueix el teu email i t'enviarem un accés directe. Sense contrasenya.</div>
    <input type="email" id="login-email" class="input" placeholder="el.teu@email.com" autocomplete="email">
    <button class="btn-primary" id="login-btn" onclick="sendMagicLink()">Enviar accés →</button>
    <div class="login-msg" id="login-msg"></div>
  </div>
</div>

<!-- ── PORTAL (visible un cop autenticat) ── -->
<div id="portal-wrap" style="display:none">
  <div class="portal" id="portal-content">
    <div class="loading">Carregant el teu perfil...</div>
  </div>
</div>

<script>
// ── CONFIG SUPABASE ──
const SUPABASE_URL = 'https://nvcmwhzcskihgktltavm.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52Y213aHpjc2tpaGdrdGx0YXZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwNTI1NDAsImV4cCI6MjA5MDYyODU0MH0.lsA4QjCGcyo8CWxjWQxFYu3wkJ-POnnzP0Dr6n2k8tQ'; // Substituir per la clau real

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ── AUTH ──
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) showPortal(session.user.email);
  else showLogin();

  // Detectar magic link callback
  sb.auth.onAuthStateChange(function(event, session) {
    if (event === 'SIGNED_IN' && session) {
      showPortal(session.user.email);
    }
  });
}

function showLogin() {
  document.getElementById('login-wrap').style.display = 'flex';
  document.getElementById('portal-wrap').style.display = 'none';
  document.getElementById('topbar').style.display = 'none';
}

function showPortal(email) {
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('portal-wrap').style.display = 'block';
  document.getElementById('topbar').style.display = 'flex';
  loadClientData(email);
}

async function sendMagicLink() {
  var email = document.getElementById('login-email').value.trim();
  var btn   = document.getElementById('login-btn');
  var msg   = document.getElementById('login-msg');
  if (!email || !email.includes('@')) {
    msg.className = 'login-msg err';
    msg.textContent = 'Introdueix un email vàlid.';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Enviant...';
  msg.textContent = '';

  const { error } = await sb.auth.signInWithOtp({
    email: email,
    options: { emailRedirectTo: 'https://assessoria-ten.vercel.app/portal.html' }
  });

  if (error) {
    msg.className = 'login-msg err';
    msg.textContent = 'Error: ' + error.message;
    btn.disabled = false;
    btn.textContent = 'Enviar accés →';
  } else {
    msg.className = 'login-msg ok';
    msg.textContent = '✓ Comprova el teu email — t\'hem enviat l\'accés. Pots tancar aquesta pestanya.';
    btn.textContent = 'Enviat ✓';
  }
}

async function logout() {
  await sb.auth.signOut();
  showLogin();
}

// ── CARREGAR DADES DEL CLIENT ──
async function loadClientData(email) {
  var el = document.getElementById('portal-content');

  // Buscar client per email
  const { data: clients, error } = await sb
    .from('clients')
    .select('*')
    .eq('email', email)
    .limit(1);

  if (error || !clients || clients.length === 0) {
    el.innerHTML = '<div class="loading" style="flex-direction:column;gap:12px">'
      + '<div style="font-size:32px">👋</div>'
      + '<div>Benvingut/da! El teu perfil s\'està preparant.</div>'
      + '<div style="font-size:12px;color:var(--g400)">Guillem Puig ha de completar la teva fitxa. Rebràs un avís quan estigui a punt.</div>'
      + '</div>';
    return;
  }

  var c = clients[0];
  _portalEmail = email;
  // Detectar pla del client per freemium
  var pla = c.perfil && c.perfil.pla ? c.perfil.pla : (c.pla || 'senyal');
  _clientPla = pla;
  renderPortal(c, el);
}

// ── RENDER DEL PORTAL ──
function renderPortal(c, el) {
  var sc = c.scoring || 0;
  var maxSc = 100;
  var scoreColor = sc>=70?'#4CAF82':sc>=50?'#5B8FD4':sc>=30?'#D4943A':'#C0392B';
  var scoreBg    = sc>=70?'#EAF3DE':sc>=50?'#EBF0FA':sc>=30?'#FEF5E7':'#FDF0F0';
  var scoreLabel = sc>=70?'Excel·lent':sc>=50?'Bona base':sc>=30?'Millorable':'En revisió';
  var perfil = c.perfil || {};
  var cartera = c.cartera_composicio || [];
  var mods    = c.scoring_mods || [];
  var proj    = c.projeccions || {};
  var hist    = c.historial || [];
  var dlbls   = ['Objectius','Situació','Horitzó','Coneixement','Risc fin.','Risc em.','Preferències'];
  var modNoms = ['Costos','Diversificació','Concentració','Coherència','Robustesa','Simplicitat','Procés'];
  var dataAvui = new Date().toLocaleDateString('ca-ES',{day:'numeric',month:'long',year:'numeric'});

  // Alloc rows
  var colors = ['#1B3A6B','#4CAF82','#D4943A','#C0392B','#6B6762','#9A9690','#3A3835'];
  var allocHtml = cartera.map(function(a,i){
    var col = a.color || colors[i%colors.length];
    return '<div class="alloc-row">'
      +'<div class="alloc-dot" style="background:'+col+'"></div>'
      +'<div class="alloc-nom">'+a.nom+'</div>'
      +'<div class="alloc-bar-wrap"><div class="alloc-bar" style="width:'+(a.pct||0)+'%;background:'+col+'"></div></div>'
      +'<div class="alloc-pct">'+a.pct+'%</div>'
      +'</div>';
  }).join('') || '<div style="font-size:12px;color:var(--g400)">Pendent de definir</div>';

  // Dims
  var dimsHtml = dlbls.map(function(lbl,i){
    var val = mods[i] || 0;
    var pct = Math.round(val/4*100);
    var col = pct>=70?'#1A5C3A':pct>=50?'#1B3A6B':pct>=30?'#7A4A00':'#8B1A1A';
    return '<div class="dim-item">'
      +'<div class="dim-val" style="color:'+col+'">'+val+'</div>'

var _clientPla = "senyal";
var _carteraEdit = false;
var _carteraData = [];

function toggleEditCartera() {
  _carteraEdit = !_carteraEdit;
  var view = document.getElementById('cartera-view');
  var edit = document.getElementById('cartera-edit');
  if (view) view.style.display = _carteraEdit ? 'none' : 'block';
  if (edit) edit.style.display = _carteraEdit ? 'block' : 'none';
}

function recalcCartera(idx) {
  var pct = parseFloat(document.getElementById('pct-'+idx).value) || 0;
  var bar = document.getElementById('bar-'+idx);
  if (bar) bar.style.width = Math.min(pct, 100) + '%';

  // Total %
  var total = 0;
  document.querySelectorAll('.cartera-edit-pct').forEach(function(inp) {
    total += parseFloat(inp.value) || 0;
  });
  var totalEl = document.getElementById('total-pct-val');
  if (totalEl) {
    totalEl.textContent = total.toFixed(1) + '%';
    totalEl.style.color = Math.abs(total - 100) < 0.5 ? '#1A5C3A' : (total > 100 ? '#8B1A1A' : '#7A4A00');
  }

  // Total €
  var totalQty = 0;
  document.querySelectorAll('.cartera-edit-qty').forEach(function(inp) {
    totalQty += parseFloat(inp.value) || 0;
  });
  var totalQtyEl = document.getElementById('total-qty-val');
  if (totalQtyEl) totalQtyEl.textContent = totalQty > 0 ? totalQty.toLocaleString('ca-ES') + '€' : '—';
}

async function guardarCartera() {
  var btn = document.querySelector('.cartera-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Guardant...'; }

  var pcts = document.querySelectorAll('.cartera-edit-pct');
  var qtys = document.querySelectorAll('.cartera-edit-qty');

  // Llegir valors actuals
  var novaCartera = [];
  pcts.forEach(function(inp, i) {
    var qtyEl = qtys[i];
    novaCartera.push({
      pct: parseFloat(inp.value) || 0,
      qty: qtyEl ? (parseFloat(qtyEl.value) || null) : null
    });
  });

  // Guardar via Supabase
  try {
    var { data: clients } = await sb.from('clients').select('cartera_composicio').eq('email', (await sb.auth.getUser()).data.user.email).limit(1);
    if (clients && clients[0]) {
      var carteraActual = clients[0].cartera_composicio || [];
      var carteraActualitzada = carteraActual.map(function(a, i) {
        return Object.assign({}, a, {
          pct: novaCartera[i] ? novaCartera[i].pct : a.pct,
          qty: novaCartera[i] && novaCartera[i].qty ? novaCartera[i].qty : a.qty,
        });
      });
      var { error } = await sb.from('clients').update({ cartera_composicio: carteraActualitzada }).eq('email', (await sb.auth.getUser()).data.user.email);
      if (error) throw error;
      if (btn) { btn.disabled = false; btn.textContent = '✓ Guardat!'; setTimeout(function(){ btn.textContent = 'Guardar canvis →'; }, 2000); }
      toggleEditCartera();
    }
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Error: ' + e.message; }
  }
}

        + (c.tbi ? '<div style="font-size:10px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px">⭐ Cartera Pròpia TBI</div>' : '')
        + '<div class="pc-nom">' + c.nom + '</div>'
        + '<div class="pc-desc">' + c.desc + '</div>'
        + '<div style="font-size:10px;color:var(--g400);margin-top:6px">' + c.stats + '</div>'
      + '</div>'
      + '<div class="pc-body">'
        + c.actius.map(function(a){
          return '<div class="pc-alloc-row">'
            + '<div style="width:8px;height:8px;border-radius:2px;flex-shrink:0;background:' + a.color + '"></div>'
            + '<div style="font-size:12px;color:var(--black);flex:1">' + a.nom + '</div>'
            + '<div style="width:80px;height:4px;background:var(--g200);border-radius:99px;overflow:hidden"><div style="height:100%;width:' + a.pct + '%;background:' + a.color + ';border-radius:99px"></div></div>'
            + '<div style="font-family:var(--fm);font-size:11px;color:var(--g500);min-width:30px;text-align:right">' + a.pct + '%</div>'
          + '</div>';
        }).join('')
      + '</div>'
    + '</div>';
  });
  el.innerHTML = html;
}


// ── FREEMIUM ──
var PLANS_PREMIUM = ['bruxola','mapa','rumb','family'];

function isPremium() {
  return PLANS_PREMIUM.indexOf(_clientPla) >= 0;
}

function freemiumBlock(titol, descripcio) {
  return '<div class="freemium-overlay">'
    + '<div class="freemium-blur" style="padding:14px;border:1px solid var(--g200);border-radius:12px;min-height:120px">'
      + '<div style="font-size:14px;font-weight:500;color:var(--black);margin-bottom:8px">' + titol + '</div>'
      + '<div style="height:8px;background:var(--g200);border-radius:4px;margin-bottom:6px;width:80%"></div>'
      + '<div style="height:8px;background:var(--g200);border-radius:4px;margin-bottom:6px;width:60%"></div>'
      + '<div style="height:8px;background:var(--g200);border-radius:4px;width:70%"></div>'
    + '</div>'
    + '<div class="freemium-cta">'
      + '<div class="freemium-cta-title">🔓 ' + titol + '</div>'
      + '<div class="freemium-cta-sub">' + (descripcio||'Aquesta funcionalitat no està disponible al teu pla actual. Millora el teu pla per accedir-hi.') + '</div>'
      + '<div class="freemium-cta-btns">'
        + '<a href="https://wa.me/34629340892?text=Vull%20millorar%20el%20meu%20pla" target="_blank" class="freemium-cta-btn">💬 Millorar pla per WhatsApp</a>'
        + '<a href="https://assessoria-ten.vercel.app/landing.html#serveis" target="_blank" class="freemium-cta-btn-sec">Veure plans →</a>'
      + '</div>'
    + '</div>'
  + '</div>';
}

// ── MODE PREVIEW (des del dashboard) ──
function checkPreviewMode() {
  var params = new URLSearchParams(window.location.search);
  if (params.get('preview') === '1') {
    var email = params.get('email') || '';
    // Mode preview: saltar l'auth i mostrar el portal directament
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('portal-wrap').style.display = 'block';
    document.getElementById('topbar').style.display = 'flex';
    // Mostrar banner de preview
    var banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;top:56px;left:0;right:0;background:#0A0A0A;color:white;text-align:center;padding:8px;font-size:12px;z-index:200;font-family:var(--fb)';
    banner.innerHTML = '👁 Mode previsualització assessor — ' + email + ' <button onclick="this.parentElement.remove()" style="margin-left:12px;background:rgba(255,255,255,.2);border:none;color:white;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:11px">×</button>';
    document.body.appendChild(banner);
    // Carregar dades si hi ha email
    if (email) loadClientData(email);
    else {
      // Mostrar portal de demo buit
      document.getElementById('portal-content').innerHTML = '<div style="padding:40px;text-align:center;color:var(--g400)"><div style="font-size:32px;margin-bottom:12px">👁</div><div>Mode previsualització</div><div style="font-size:12px;margin-top:6px">Selecciona un client al dashboard i clica "Vista client" a la seva fitxa</div></div>';
    }
    return true;
  }
  return false;
}

// ── START ──
if (!checkPreviewMode()) init();
</script>
