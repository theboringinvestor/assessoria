<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Boring Investor — Portal Client</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',system-ui,sans-serif;background:#F2F1EE;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .wrap{text-align:center;padding:40px 24px}
  .logo{width:40px;height:40px;margin:0 auto 16px}
  p{font-size:13px;color:#9A9690;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <svg class="logo" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1" width="26" height="26" rx="3" fill="none" stroke="#C8C5BE" stroke-width="1.5"/>
    <circle cx="8.5" cy="10" r="2" fill="#0A0A0A"/>
    <circle cx="8.5" cy="17" r="2" fill="#0A0A0A"/>
    <rect x="12" y="12.5" width="6" height="1.5" rx=".75" fill="#0A0A0A"/>
    <rect x="20.5" y="8" width="1.5" height="12" rx=".75" fill="#0A0A0A"/>
  </svg>
  <p>Redirigint a la plataforma...</p>
</div>
<script>
  // Preservar paràmetres i hash (magic link de Supabase)
  var hash = window.location.hash || '';
  var search = window.location.search || '';
  // Si ve d'un magic link de Supabase (té access_token al hash),
  // redirigir a platform.html passant el hash perquè Supabase el processi allà
  window.location.replace('platform.html' + search + hash);
</script>
</body>
</html>
